class_id: AF-WCC-VAC-GEN
title: Weak cosmic censorship for asymptotically flat vacuum spacetimes with generic
  data
quantifiers:
  forall: for all asymptotically flat vacuum initial data sets (Sigma, g, K) in the
    weighted data class D_w below
  exists: there exists a maximal globally hyperbolic development (M, g) with complete
    future null infinity I+
topology:
  dimension: 4
  manifold: 4-dimensional smooth Lorentzian manifold, globally hyperbolic
  asymptotics: asymptotically flat with complete future null infinity I+
  symmetry: none assumed; data are generic in the sense of the genericity section
data_class:
  regularity: C^2 metric with H^3_loc initial data
  weighted_norm: finite weighted Sobolev norm ||(g - delta, K)||_{H^3_w} with weight
    w = (1 + r^2)^{1/2}
  decay: ADM mass finite; fall-off r^{-1/2} along I+
matter: 'vacuum Einstein equations: T_{mu nu} = 0, equivalently Ricci-flat'
genericity:
  kind: open dense subset of the weighted data class D_w
  parameter_space: the parameter space D_w of asymptotically flat vacuum initial data
i_plus:
  name: future null infinity I+
  visibility: no singularity is visible from I+; I+ is future-complete
conclusion:
  type: theorem
  class_object: AF-WCC-VAC-GEN
  statement: the maximal development cannot be isometrically embedded into any larger
    C^2 Lorentzian manifold
