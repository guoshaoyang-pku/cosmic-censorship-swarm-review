class_id: AF-SCC-C2-VAC-GEN
title: Strong cosmic censorship, C2 formulation, asymptotically flat vacuum, generic
  data
quantifiers:
  forall: for all asymptotically flat vacuum initial data sets (Sigma, g, K) in the
    weighted data class D_w below
  exists: there exists a maximal globally hyperbolic development (M, g) that admits
    no C^2 extension
topology:
  dimension: 4
  manifold: 4-dimensional smooth Lorentzian manifold, globally hyperbolic
  asymptotics: asymptotically flat
  symmetry: none assumed
data_class:
  regularity: C^2 metric with H^3_loc initial data
  weighted_norm: finite weighted Sobolev norm ||(g - delta, K)||_{H^3_w}
  decay: ADM mass finite; weighted fall-off at spatial infinity
matter: 'vacuum Einstein equations: T_{mu nu} = 0, equivalently Ricci-flat'
genericity:
  kind: open dense subset of the weighted data class D_w
  parameter_space: the parameter space D_w of asymptotically flat vacuum initial data
inextendibility:
  regularity: C^0
  statement: the maximal development is C^0-inextendible
conclusion:
  type: theorem
  class_object: AF-SCC-C2-VAC-GEN
  statement: for all data in the open dense set of D_w the maximal development is
    C^2-inextendible
