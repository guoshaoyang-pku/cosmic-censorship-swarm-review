class_id: AF-SCC-C0-VAC-GEN
regularity: C^0 (continuous metric; no differentiability of the extension is required)
topology: globally hyperbolic asymptotically flat 3+1 spacetime, future null infinity
  I+ as in the companion schema
hypotheses:
  data: asymptotically flat vacuum initial data, same weighted class as the companion
    regularity schema
  genericity: open dense subset of asymptotically flat vacuum data
genericity: open dense subset of asymptotically flat vacuum data in H^s_{-delta}
conclusion_type: counterexample
conclusion: 'The C^0-inextendibility formulation of strong cosmic censorship is false
  for perturbations of sub-extremal Kerr: the evolution extends across the Cauchy
  horizon with continuous metric.'
known_obstruction: Dafermos-Luk prove C^0 extendibility of the Kerr Cauchy horizon
  (arXiv:1710.01722); conditionally on Kerr exterior stability the C^0-inextendibility
  statement fails; the surviving statement concerns weak null singularities.
anti_scope:
- not the C2-inextendibility statement
- excludes AF-SCC-C2-VAC-GEN
- does not assert that no continuous extension exists
