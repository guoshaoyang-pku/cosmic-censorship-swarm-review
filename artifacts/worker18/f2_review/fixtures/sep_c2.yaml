class_id: AF-SCC-C2-VAC-GEN
regularity: C^2 (the extension is required to be a C^2 Lorentzian manifold solving
  the vacuum Einstein equations)
topology: globally hyperbolic asymptotically flat 3+1 spacetime, future null infinity
  I+ complete
hypotheses:
  data: asymptotically flat vacuum initial data with weighted Sobolev decay
  genericity: open dense subset of the constraint manifold
genericity: open dense subset of asymptotically flat vacuum data in H^s_{-delta}
conclusion_type: open_problem
conclusion: For generic asymptotically flat vacuum data the maximal Cauchy development
  admits no C^2 extension across a Cauchy horizon.
known_obstruction: Blue-shift instability suggests extensions are at most C0; no proof
  of C2-inextendibility exists for generic vacuum data.
anti_scope:
- not the C0-inextendibility statement
- excludes AF-SCC-C0-VAC-GEN
- matter models other than vacuum are out of scope
