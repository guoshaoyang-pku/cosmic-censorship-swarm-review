scope_statement: 'The maximal globally hyperbolic development of generic asymptotically flat vacuum initial data
  (4-dimensional Einstein vacuum equations, Lambda = 0) admits no proper future extension whose metric is merely
  continuous (C0) and Lorentzian; no differentiability, no curvature, and no equation requirement are assumed of
  the extension. The class is about non-extendibility of the development; it makes no statement about what an observer
  at I+ sees.

  '
quantifiers:
  formal: 'forall r in D0: exists G_r subset X^r_vac(AF) with G_r comeager: forall (Sigma,h,K) in G_r, letting (M,g)
    be the maximal globally hyperbolic development: not exists a proper future C0 metric extension (M'',g'',iota)
    of (M,g).'
  ordered:
  - kind: forall
    binder: r
    domain_id: D0
  - kind: exists
    binder: G_r
    domain_id: D1
  - kind: forall
    binder: (Sigma,h,K)
    domain_id: D2
  - kind: not_exists
    binder: (M',g',iota)
    domain_id: D3
  domains:
    D0:
      definition: 'admissible regularity indices, a tagged disjoint union: r = smooth (the smooth-with-decay default)
        or r = (sobolev,s,delta) with s > 5/2 and delta in (1/2,1). X^r_vac(AF) is the corresponding one-ended AF
        vacuum constraint manifold (Frechet for r = smooth; weighted Sobolev product H^s_delta x H^{s-1}_{delta+1}
        for r = (sobolev,s,delta)). The index r ranges over exactly D0, so the smooth branch is no longer typed
        as a pair and the class does not range over ''suitable'' regularity. [rev12 F-2 well-typedness repair: F1-review-19
        F-2, F2b-review-034 HF-034-1]'
      definition_ref: regularity.data_regularity
    D1:
      definition: comeager (residual) subsets of X^r_vac(AF) in the named topology; X^r_vac(AF) minus G_r is meager
      definition_ref: genericity
    D2:
      definition: one-ended asymptotically flat vacuum initial data satisfying both constraint equations in the
        declared regularity class
      definition_ref: data_class
    D3:
      definition: proper future C0 metric extensions of the maximal development, in the exact sense of extension_predicate
      definition_ref: extension_predicate
  order_matters: true
  order_note: the comeager set is fixed independently of the data; the extension quantifier is a negated existential
    over extensions of the given development, not over data
  negation: there exists r in D0 such that for every comeager G_r subset X^r_vac(AF) there is (Sigma,h,K) in G_r
    whose maximal development admits a proper future C0 metric extension; equivalently the set of data admitting
    such an extension is non-meager.
  negation_normal_form: '{ r in D0 : { D in X : exists proper future C0 metric extension of MGHD(D) } is non-meager
    } is non-empty'
  quantifier_class: forall-exists(comeager)-forall-not-exists(extension)
c0_specifics:
  provenance:
    harvested_from: schemas/af_scc_c0_vacuum.yaml
    authored_by: deepseek-flash-05
    worker_sha256: 0150bfdf671b1452cc03a15db260a498aab05e6db5227773e691bbe91ca477d7
    harvested_at: '2026-09-11T23:30:35+08:00'
    status: input to the canonical revision; one sentence corrected, citation unverified
  what_fails_at_c0:
  - curvature invariants are undefined for a merely continuous metric, so curvature-blow-up criteria are unavailable
    and may not appear as hypotheses
  - differentiability of the metric across a Cauchy horizon is unavailable; any obstruction must be a global C0
    geometric obstruction
  - geodesic uniqueness is unavailable (see extension_predicate.c0_uniqueness_caveat), so completeness arguments
    do not transfer from the C2 sibling
  conclusion_relation_to_sibling: 'the extension regularity is lower than in the C2 sibling, but the logical strength
    is not lower: excluding all continuous extensions excludes all C2 extensions. The one-way entailment C0 => C2
    is recorded in implication_ledger; the converse is forbidden. (The worker draft''s sentence ''the two classes
    inherit nothing from each other in either direction'' is rejected as incorrect.)'
  candidate_tool:
    name: spacelike-diameter obstruction for C0-inextendibility
    identifier: arXiv:1507.00601
    citation_status: unresolved
    note: worker-supplied identifier, NOT verified by this author; L1 must confirm author, scope (Schwarzschild-type
      interiors only) and that it is not imported as a proof of this class
extension_predicate:
  name: proper_future_extension_in_class
  frozen_regularity: C2
  frozen_equation_concept: none
  frozen_direction: future
  definition: 'A triple (M'', g'', iota) is a proper future C0 metric extension of (M,g) iff: (a) iota: M -> M''
    is an isometric embedding (iota_* g = g'' restricted to iota(M)); (b) iota(M) is an open, proper subset of M'';
    (c) M'' is a SMOOTH (C-infinity) connected 4-manifold, time-orientable, whose time orientation restricts to
    that of M; the smooth structure is the category in which the metric is a tensor field, while the metric itself
    is only continuous (worker-16 F2b-16-03 accepted: a merely topological M'' cannot carry a classical Lorentzian
    tensor field); (d) g'' is a continuous, nondegenerate Lorentzian metric on M'' (signature (-,+,+,+)); (e) NO
    equation is required of g'' on M''; (f) the extension adds points to the future: int(M'' minus iota(M)) is non-empty
    AND there exist q in iota(M) and p in int(M'' minus iota(M)) with p in I^+(q; g''), where I^+ is the chronological
    future. The interior requirement blocks an extension that only adds boundary/dense-open points (R2 major: clause
    (f) was escapable). CONVENTION CAVEAT: for merely continuous metrics the causal structure can be degenerate
    and chronological futures may fail to be open or may depend on the curve class (Grant et al., worker-supplied
    pointer arXiv:1901.07996, UNVERIFIED); if the causal relation is degenerate, the witness must instead be a timelike
    curve from iota(M) to a point of int(M'' minus iota(M)). [R2 major, recorded not fully resolved]'
  why_bare_metric: 'this is the strongest form of the statement: every extension class with more structure or more
    requirements is a subset of this one, so ruling out ALL continuous metric extensions is the hardest and most
    informative version.'
  must_not_conflate:
  - extensions with locally square-integrable curvature (H2_loc) are a DIFFERENT class; H2_loc is not C0
  - extensions that solve Ric = 0 distributionally are a DIFFERENT, strictly weaker class (see variants)
  - a C1 or C^{1,1} extension class is different from C0
  - a 'continuous metric extension' is not required to make the geodesic equation classically well posed; see the
    C0 uniqueness caveat
  c0_uniqueness_caveat: for a merely continuous metric the classical geodesic equation is not defined (Christoffel
    symbols involve first derivatives), so local uniqueness of geodesics is not automatic and the elementary argument
    'future geodesic completeness of M blocks future extensions' CANNOT be imported from the C2 sibling. Non-vacuity
    must be argued inside this class, not borrowed.
topology:
  spacetime_dimension: 4
  slice_topology: Sigma connected, oriented, complete Riemannian 3-manifold diffeomorphic to R^3 (exactly one asymptotically
    flat end)
  end_structure: one AF end
  completeness_of_slice: true
  conformal_boundary:
  - I+ (future null infinity)
  - I- (past null infinity)
  - i0 (spatial infinity)
  I_plus_topology: R x S^2
  development_topology: M globally hyperbolic, M diffeomorphic to Sigma x R, Sigma a Cauchy surface
  extension_topology: 'M'' a connected SMOOTH 4-manifold (the category in which the metric is a tensor field) containing
    iota(M) as an open proper subset; the metric g'' is only continuous. M'' is NOT assumed globally hyperbolic,
    compact, or AF. [R2 major: the rev4 smooth-category repair is now propagated here, to topology.forbidden and
    to falsifier.tier_1.witness_type]'
  forbidden:
  - closed or periodic spatial slice
  - more than one asymptotically flat end
  - assuming g' is differentiable (that is the sibling class or a stronger one); M' is a smooth manifold but g'
    is merely continuous
  - assuming the extension preserves any asymptotic structure
data_class:
  matter: none
  cosmological_constant: 0
  equations: Einstein vacuum equations Ric(g) = 0
  constraints:
    hamiltonian: R(h) - K_ij K^ij + (tr_h K)^2 = 0
    momentum: D^j (K_ij - (tr_h K) h_ij) = 0
  regularity_class:
    default: 'smooth-with-decay: h and K of class C^infinity with the numeric rates below'
    sobolev_variant:
      s: s > 5/2
      delta: delta in (1/2, 1)
      spaces: h - delta_ij in H^s_delta, K in H^{s-1}_{delta+1}
      status: standard_choice; UNVERIFIED citation
  asymptotic_decay:
    metric: h_ij - delta_ij = O(r^{-1}) and |d^k h| = O(r^{-1-k}) for 1 <= k <= s
    second_fundamental_form: K_ij = O(r^{-2}) and |d^k K| = O(r^{-2-k}) for 0 <= k <= s-1
    parity_conditions: not imposed
  symmetry: none_assumed
  adm_mass:
    exists: true
    sign: m_ADM >= 0 by the positive mass theorem
    citation_status: unresolved
    locator: to be supplied by L1 (Schoen-Yau / Witten); the sign is used only to exclude negative-mass data from
      the ambient space
    hypotheses_reconciliation: pointwise rates are the smooth-with-decay default; the Sobolev variant uses the same
      rates distributionally, and i_plus k >= 3 is assumed independently of both (worker-16 F2b-16-04 acknowledged,
      recorded not resolved)
  gauge: no gauge fixed on the data; all predicates are diffeomorphism invariant
  diffeo_quotient: genericity is defined on data modulo asymptotically-identity diffeomorphisms; the quotient construction
    is a declared open technical gap (see unresolved_items)
regularity:
  data_regularity: smooth-with-decay default, or H^s_delta with s > 5/2, delta in (1/2,1)
  solution_regularity: g of class C^infinity(M) for smooth data (H^s_loc for the Sobolev variant); maximal globally
    hyperbolic development exists and is unique up to isometry
  i_plus_regularity: gtilde extends to I+ with C^k regularity, k >= 3; k is part of the assumption
  extension_regularity: C0
  extension_regularity_exact: continuous (C0) nondegenerate Lorentzian metric; no differentiability assumed
  extension_solution_concept: none
  must_not_conflate:
  - H2_loc (locally square-integrable curvature) is a distinct regularity-axis value phrased in terms of CURVATURE,
    not metric differentiability. No containment with C2 or C0 is asserted here; the informal phrase 'strictly between'
    is not used and must not be cited (worker-16 F2b-16-02 accepted).
  - a distributional-vacuum C0 extension is a strictly weaker statement (fewer allowed extensions)
  - a C2-inextendibility result does not establish this class; the implication runs C0 => C2 only (see implication_ledger)
  - 'differentiability smuggled in through ''smooth coordinates'' or a ''regular boundary'': the metric is only
    continuous'
  - WCC content (I+ completeness, visibility) must not appear as the conclusion here
genericity:
  kind: residual_comeager
  ambient_space: the constraint manifold X^r_vac(AF) of one-ended asymptotically flat vacuum data, with the SUBSPACE
    topology induced from the weighted Sobolev product H^s_delta x H^{s-1}_{delta+1} (not the unconstrained product,
    under which X_vac would be meager and no G would exist). X_vac is a closed subset of a Banach space, hence Baire,
    so G is non-empty.
  topology_or_measure: subspace topology on the constraint manifold; Frechet topology for the smooth-with-decay
    class. The diffeomorphism quotient is not used to define comeagerness (open technical gap).
  generic_set: G = countable intersection of open dense subsets of X^r_vac(AF); complement meager; non-empty by
    Baire-ness
  excluded_set: meager; must contain (status unresolved) the stationary/axisymmetric Kerr data, whose maximal development
    admits a C-infinity (hence C0) vacuum extension, plus self-similar and finite-dimensional analytic families
  excluded_set_status: unresolved
  is_part_of_class: true
  class_change_warning: genericity is part of the class identity. The comeager form is this class. 'For all data'
    is strictly stronger. The dense-open form is ALSO strictly stronger, because a dense open set is comeager (it
    is the countable intersection of the constant family). The comeager form does not imply the dense-open form
    (a comeager set can have empty interior). No strengthening may be substituted silently.
  transfer_failures:
  - pair:
    - residual_comeager
    - full_measure
    direction: no_transfer
    witness: let C = intersection over n of open dense U_n with measure < 1/n; C is comeager and null, so comeagerness
      does not yield full measure [R1 F03]
    status: standard_fact
    citation_status: unresolved
  - pair:
    - full_measure
    - residual_comeager
    direction: no_transfer
    witness: the complement of the comeager null set above is meager with full measure; the irrationals are both
      and witness nothing [R1 F03]
    status: standard_fact
    citation_status: unresolved
  - pair:
    - residual_comeager
    - finite_codimension_complement
    direction: no_transfer
    witness: a fat Cantor set is meager with positive measure, hence not covered by countably many finite-codimension
      submanifolds
    status: elementary
    citation_status: n/a
  - pair:
    - residual_comeager
    - open_dense_escape
    direction: no_transfer
    witness: 'the irrationals are comeager with empty interior: a comeager set need not contain any nonempty open
      subset, so the comeager form does not yield a dense-open form'
    status: standard_fact
    citation_status: unresolved
  transfer_holds:
  - pair:
    - open_dense_escape
    - residual_comeager
    direction: transfers
    witness: a dense open set U is the countable intersection of the constant family {U}, hence comeager; the dense-open
      form implies the comeager form
    status: elementary
    citation_status: n/a
  - pair:
    - finite_codimension_complement
    - residual_comeager
    direction: transfers
    witness: a proper closed finite-codimension submanifold is closed and nowhere dense, so a countable union of
      them is meager; if the exceptional set is so covered, the property holds on a comeager set
    status: elementary
    citation_status: n/a
  variants:
  - kind: open_dense_escape
    statement_strength: strictly_stronger
    is_this_class: false
    relation: implies residual_comeager
  - kind: dense_escape
    statement_strength: strictly_weaker
    is_this_class: false
    relation: 'implied by residual_comeager in a Baire space (a comeager set is dense); a dense set need not be
      comeager, so it is strictly weaker than the class default. [R2-16 corrected: was off-vocabulary and mislabelled
      incomparable]'
  - kind: full_measure
    statement_strength: incomparable
    is_this_class: false
    requires: a specified measure on X, e.g. a Gaussian measure induced by the constraint map
  - kind: none
    statement_strength: strictly_stronger
    is_this_class: false
non_vacuity:
  condition: the class must be applied to data whose maximal development admits a future boundary that is not a
    regular (smoothly attachable) boundary; a development that is already future geodesically complete is expected
    to be inextendible, but in the C0 class this expectation is NOT elementary because geodesic uniqueness for continuous
    metrics is not available (see extension_predicate.c0_uniqueness_caveat).
  witness_type: one-parameter family in G whose development contains a future trapped surface and a Cauchy horizon
    candidate; incompleteness of the development is the non-vacuity marker
  status: trapped-surface formation is standard; membership of the family in G is UNVERIFIED here
  vacuity_falsifier: 'if the class is cited for a development already shown C2-inextendible, the citation adds NO
    information about the C0 statement (a C2 result is weaker) and must be marked weaker-evidence, not as evidence
    for this class. The word ''subsumed'' is reserved for the direction that actually holds: a C0 proof subsumes
    the C2 sibling, never the reverse. [R2-02 contradiction repaired]'
  iota_regularity: the embedding iota is a C-infinity isometric embedding (smooth category); g' is continuous. Freezing
    this convention removes the ambiguity R2-04 raised; a C0-embedding variant would be a different class.
  c0_specific_note: 'a C2-inextendibility proof does NOT subsume this class''s conclusion. The implication runs
    C0 => C2 only: C0-inextendibility is the stronger statement, so a C2 result is weaker and citing it as if it
    established C0-inextendibility is conclusion inflation (worker-08 e08-blocker-c0-converse accepted and repaired
    at revision 4; the earlier revision stated the converse).'
i_plus:
  role: assumption
  in_conclusion: false
  completeness_in_conclusion: false
  definition: AF structure at future null infinity is used only to define the data class and the maximal development;
    I+ appears nowhere in the conclusion
  forbidden:
  - asserting I+ completeness as part of this class conclusion
  - importing the WCC I+ predicate as the falsifier of this class
visibility:
  role: not_in_conclusion
  reason: visibility from I+ is the WCC predicate. This SCC class asserts non-extendibility of the maximal development;
    a singularity can be invisible from I+ and still the development can be extendible, and vice versa. The two
    axes are logically independent as stated.
  visible_singularity_is_wcc: true
  forbidden_falsifier: a visible incomplete causal geodesic is a WCC falsifier; it is NOT the falsifier of this
    class
  derived_note: inextendibility is a statement about the boundary of the development, not about causal relations
    to I+
conclusion:
  conclusion_type: scc_c0_future_inextendibility
  epistemic_status: open_problem
  family: SCC
  statement_natural_language: Generic asymptotically flat vacuum initial data have a maximal development that is
    future-inextendible as a continuous Lorentzian manifold.
  statement_formal: 'forall r in D0 exists G_r comeager forall D in G_r: not exists proper_future_extension_in_class(MGHD(D))'
  equivalent_rephrasings:
  - phrasing: the maximal development is future inextendible as a C0 Lorentzian manifold
    status: equivalent by definition of extension_predicate
  - phrasing: the metric cannot be continuously extended past the future boundary of the development
    status: informal, UNVERIFIED as an equivalence
  known_obstruction: 'the exact stationary (Kerr) vacuum data admit a C-infinity vacuum extension, hence also a
    C0 extension, so the unqualified statement over ALL AF vacuum data is false; the class is only meaningful with
    the generic quantifier and the extendible family must be shown meager. citation_status: unresolved (L1 owns
    the anchor).'
  forbidden_strengthenings:
  - the class conclusion must not be replaced by a C2/C1/H2_loc inextendibility claim (those are WEAKER statements,
    listed under forbidden_weakenings, not strengthenings). [R2-11 mislabel repaired]
  - two-sided inextendibility (different, stronger statement)
  - the statement for ALL AF vacuum data (false if the Kerr obstruction is as stated)
  - I+ completeness or asymptotic predictability (WCC content)
  forbidden_weakenings:
  - dropping the generic quantifier in practice while keeping the word
  - substituting the distributional-vacuum variant for the bare-metric class
  - substituting H2_loc for C0 (H2_loc-inextendibility is weaker and entails the C2 sibling, not this class)
  - substituting C2 or C1 for C0, or citing a C2 result as evidence for this class
  - using the C0 token for the distributional-vacuum variant without declaring the equation requirement
  - replacing future by two-sided direction
  claim_promotion: epistemic_status=open_problem; theorem requires artifact_refs with a checked proof
implication_ledger:
  extension_class_containment: 'E_C0 contains E_H2loc contains E_{C^1,1} contains E_C2; this class requires the
    LOWEST regularity, so its inexistence statement is the STRONGEST of the three and entails the others. [R2 major:
    the earlier revision listed H2_loc as forbidden and as incomparable]'
  one_way_entailments:
  - from: no proper future C0 metric extension
    to: no proper future H2_loc extension
    relation: entails
    reason: E_H2loc subset of E_C0 (an H2_loc extension is a continuous metric extension)
    status: elementary
  - from: no proper future H2_loc extension
    to: no proper future C2 extension
    relation: entails
    reason: E_C2 subset of E_H2loc (a C2 metric has locally bounded curvature)
    status: standard_fact
  - from: no proper future C0 metric extension
    to: no proper future C2 extension
    relation: entails
    reason: transitivity of the two rows above; C0-inextendibility is stronger than the C2 class's conclusion
    status: elementary
  - from: no proper future C0 metric extension
    to: no proper future C0 distributional-vacuum extension
    relation: entails
    reason: extensions required to solve Ric = 0 distributionally are a subset of all continuous metric extensions
    status: elementary
  forbidden_transfers:
  - from: no proper future C2 extension
    to: this class
    reason: C2 is a strictly larger extension class, so C2-inextendibility is strictly weaker
  - from: no proper future C2 extension
    to: no proper future H2_loc extension
    reason: the converse containment is false
  - from: AF-WCC-VAC-GEN
    to: this class
    reason: visibility and inextendibility are logically independent as stated
  cross_family: no WCC <-> SCC transfer is licensed by this artifact
  subsumption_note: if this class is proved, the H2_loc and C2 siblings follow; recording either as an independent
    achievement would double-count. This direction runs C0 => H2loc => C2, never the reverse.
falsifier:
  tier_1:
    refutes: AF-SCC-C0-VAC-GEN
    witness_type: an open (or at least non-meager) set of one-ended AF vacuum data whose maximal developments admit
      proper future C0 metric extensions, with the extension exhibited explicitly (SMOOTH 4-manifold M', continuous
      nondegenerate metric g', C-infinity isometric embedding iota, an interior future point added as in clause
      (f))
    genericity_requirement: 'tier 1 refutes the class by showing the EXTENDIBLE set is non-meager (equivalently:
      it meets every comeager set). One extendible datum is NOT sufficient in general because G is existentially
      quantified and individual membership is undecided. Route R1 = non-meagerness (general); route R2 = a datum
      in an explicitly instantiated generic set G* (instantiated claims only). [R1 F01 accepted]'
    proof_obligations:
    - non-meagerness of the extendible set (general route R1)
    - the extension is a proper future extension in the frozen class
    - D in G* (membership), needed only for the instantiated route R2
    machine_checkable_steps:
    - constraint residuals below tolerance
    - g' is continuous and nondegenerate on a neighbourhood of the boundary (sampled)
    - iota is an isometry onto an open proper subset
    - the added points lie in the future of iota(M)
