# WITHOUT removing any of its content.
# Added: an evidence_type catalog, T-SCHEMA/T-LIT/T-NUM/T-FORMAL acceptance lines that each
# name an evidence type, gate->task_type mapping, G-FORMAL as a first-class pending gate,
# HF-14..HF-17, metric evidence bindings, and a structural validator contract.
