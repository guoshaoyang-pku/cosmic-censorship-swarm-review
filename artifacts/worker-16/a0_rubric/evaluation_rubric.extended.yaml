schema_version: "0.1"
artifact_id: A0-evaluation-rubric
canonical_path: evaluation_rubric.yaml
created_at: "2026-09-11T23:20:00+08:00"
author: lead-audit
owner: lead-audit
draft_author: deepseek-flash-16
status: draft_for_gate
extends_sha256: 25808142ed60e88545e15bc3499e2aba8c0fb074a2f9e55d07d561b623a3f1b0
no_universal_scalar_score:
  enforced: true
  statement: >-
    TRUE by construction. There is no single number that ranks a schema, a theorem ledger, a
    numerical calibration and a formalization. Each task type has its own verifier and gate;
    metrics are reported per task type and are never averaged into one score.
  forbidden_uses:
    - a weighted sum of metrics used as an accept/reject threshold
    - ranking classes, task types or ablation arms by a single score
    - collapsing reviewer dimension scores into one number before a verdict
  hard_failure: HF-14

# --- Evidence types ----------------------------------------------------------------------
# Every acceptance line in task_types must reference one of these ids in `evidence_type`.
evidence_types:
  - id: EV-ARTIFACT-HASH
    description: On-disk artifact exists and its sha256 is recorded in the event stream.
    machine_checkable: true
    reviewer_required: false
  - id: EV-CMD-EXIT
    description: >-
      A recorded command with exit code, seed and tool version/commit; re-running it
      reproduces the recorded result within the stated tolerance.
    machine_checkable: true
    reviewer_required: false
  - id: EV-SCHEMA-FIELD
    description: A machine-readable field exists at a named path with a value from an allowed set.
    machine_checkable: true
    reviewer_required: false
  - id: EV-GATE-VERDICT
    description: A gate event with verdict pass/fail/pending, criteria and evidence_refs.
    machine_checkable: true
    reviewer_required: false
  - id: EV-REVIEW-VERDICT
    description: >-
      A reviewer event with reviewer id, verdict, per-dimension score vector, hard failures
      and the sha256 of the reviewed artifact.
    machine_checkable: false
    reviewer_required: true
  - id: EV-LOCATOR-RESOLVE
    description: DOI/arXiv/journal locator resolved, with resolver result and retrieved_at.
    machine_checkable: true
    reviewer_required: false
  - id: EV-QUOTE-VERBATIM
    description: A verbatim quote from the fetched source matched to the claim statement.
    machine_checkable: false
    reviewer_required: true
  - id: EV-LEAN-BUILD
    description: A pinned-toolchain kernel build log with exit code and declared axiom set.
    machine_checkable: true
    reviewer_required: false
  - id: EV-CONVERGENCE
    description: A resolution ladder (>=4) with measured order and residual table.
    machine_checkable: true
    reviewer_required: false
  - id: EV-INVARIANT
    description: Constraint/conservation diagnostic table over the run.
    machine_checkable: true
    reviewer_required: false
  - id: EV-NULL-CONTROL
    description: Matched-budget null or iid control run with equal tokens and wall-clock.
    machine_checkable: true
    reviewer_required: false
  - id: EV-COUNTEREXAMPLE
    description: An explicit finite witness re-checked by an independent verifier.
    machine_checkable: true
    reviewer_required: false
  - id: EV-DIFF-MATRIX
    description: Per-fixture accept/reject matrix from two independently written checkers.
    machine_checkable: true
    reviewer_required: false
  - id: EV-PROVENANCE-LOG
    description: Append-only ledger entry with event id, actor, timestamp and prior hash.
    machine_checkable: true
    reviewer_required: false

# --- Task-type verifiers (A0 assignment: schema, literature, numerics, formal) -------------
verifiers:
  schema_formulation:
    gate: G-FORM
    machine_checkable: true
    checks: [frozen class id, single-class binding, exact quantifier order, topology block,
             weighted data class, genericity kind + topology, I+/visibility role by family,
             extension regularity xor, conclusion type vs class, falsifier tiering, non-vacuity]
    evidence: "artifact bytes + sha256 + one linter verdict; two reviewer verdicts for promotion"
    human_adjudication_only: [physical fidelity of the formulation, whether the schema is well-posed]
  literature:
    gate: G-LIT
    machine_checkable: partially
    checks: [locator present, resolution_status honest, retrieved page recorded, per-source
             matter/Lambda/dimension/symmetry/formulation scope recorded, quote recorded,
             quantity_check for numeric claims]
    human_adjudication_only: [whether the quoted theorem really has the claimed scope]
  numerics:
    gate: G-NUM
    machine_checkable: true
    checks: [process-boundary timeout, "at least 4 resolutions", observed order vs declared order,
             invariant residuals, independent replication within tolerance, seeds recorded]
    human_adjudication_only: [physical interpretation of the calibrated regime]
  formalization:
    gate: G-FORMAL (future)
    machine_checkable: true
    checks: [kernel build reproducible, no sorry/axiom/admit/unsafe, axiom cone printed,
             statement hash pinned, no weakened conclusion]
    human_adjudication_only: [whether the formal statement matches the informal class text]

# --- Per-task-type acceptance lines (each names an evidence type) -------------------------
task_types:
  T-SCHEMA:
    label: Formulation schema / class definition
    verifier_ref: verifiers.schema_formulation
    owner_gate: G-FORM
    verifier:
      machine_checkable:
        - class_id is exactly one frozen id
        - required fields present at named paths (quantifiers, topology, data_class, genericity, I_plus, visibility, conclusion_type)
        - composite regularity ban (no merged regularity token, no dual-regularity class_id)
        - conclusion_primary in the class allowed set
        - artifact sha256 recorded
      reviewer_adjudicated:
        - quantifier prefix faithfully expresses the intended class (no hedging, correct order)
        - genericity notion is load-bearing for the statement
        - falsifier is finite and decidable in the stated topology
    acceptance_lines:
      - id: S1
        requirement: "class_id is exactly one id from frozen_classes (never a disjunction)"
        evidence_type: EV-SCHEMA-FIELD
        check: "read class_id; membership test against frozen_classes"
        pass_condition: "exactly one frozen id"
        hard_failure_if: HF-02
        machine_checkable: true
      - id: S2
        requirement: "exact quantifier prefix, no hedging tokens"
        evidence_type: EV-SCHEMA-FIELD
        check: "scan quantifier field; forbid {roughly, essentially, typically, or}"
        pass_condition: "no forbidden token; quantifier order explicit"
        hard_failure_if: HF-06
        machine_checkable: true
      - id: S3
        requirement: "data class names topology, regularity, decay, constraints and end structure"
        evidence_type: EV-SCHEMA-FIELD
        check: "required subfields present and non-empty at named json paths"
        pass_condition: "all five subfields present"
        hard_failure_if: HF-06
        machine_checkable: true
      - id: S4
        requirement: "genericity notion named from the allowed set"
        evidence_type: EV-SCHEMA-FIELD
        check: "value in {comeager, full_measure, open_dense, codim_ge_1, non_generic_excluded}"
        pass_condition: "one allowed value"
        hard_failure_if: HF-06
        machine_checkable: true
      - id: S5
        requirement: "conclusion type allowed for the class; implied conclusions carry an implication note"
        evidence_type: EV-SCHEMA-FIELD
        check: "conclusion_primary in class allowed set; implication_note present when implied non-empty"
        pass_condition: "allowed conclusion and note present"
        hard_failure_if: HF-02
        machine_checkable: true
      - id: S6
        requirement: "falsifier is a finite checkable procedure in the stated topology"
        evidence_type: EV-REVIEW-VERDICT
        check: "reviewer exhibits the finite witness search or a proof that none exists"
        pass_condition: "reviewer verdict accept with cited sha256"
        hard_failure_if: HF-01
        machine_checkable: false
      - id: S7
        requirement: "no cross-class evidence without transfer_argument and downgraded conclusion"
        evidence_type: EV-SCHEMA-FIELD
        check: "evidence entries carry class_id == schema class_id unless transfer_argument present"
        pass_condition: "no silent transfer"
        hard_failure_if: HF-02
        machine_checkable: true
      - id: S8
        requirement: "artifact exists and sha256 is recorded before any gate verdict"
        evidence_type: EV-ARTIFACT-HASH
        check: "path exists; sha256 matches the recorded digest"
        pass_condition: "hash match"
        hard_failure_if: HF-05
        machine_checkable: true

  T-LIT:
    label: Literature ledger and citation audit
    verifier_ref: verifiers.literature
    owner_gate: G-LIT
    verifier:
      machine_checkable:
        - locator present and resolver returns the cited work
        - verification_status is on the declared ladder and never skipped
        - class metadata (matter, Lambda, dimension, symmetry, regularity) present
        - unresolved list exists
      reviewer_adjudicated:
        - verbatim quote supports the stated theorem at the stated strength
        - the "what it does NOT prove" list is complete for the cited claim
        - quantitative statements match the source
    acceptance_lines:
      - id: L1
        requirement: "locator resolves to the cited work"
        evidence_type: EV-LOCATOR-RESOLVE
        check: "resolve DOI/arXiv id; compare title/authors/year"
        pass_condition: "resolver match; retrieved_at recorded"
        hard_failure_if: HF-03
        machine_checkable: true
      - id: L2
        requirement: "theorem quoted verbatim from the fetched source at the stated strength"
        evidence_type: EV-QUOTE-VERBATIM
        check: "reviewer compares the quote to the fetched text and the claim statement"
        pass_condition: "quote present and not stronger than source"
        hard_failure_if: HF-03
        machine_checkable: false
      - id: L3
        requirement: "source metadata recorded and compatible with the claim class"
        evidence_type: EV-SCHEMA-FIELD
        check: "fields matter_model, cosmological_constant, dimension, symmetry, regularity present and equal to class requirements"
        pass_condition: "all present and compatible"
        hard_failure_if: HF-02
        machine_checkable: true
      - id: L4
        requirement: "explicit non-claims list for every cited theorem"
        evidence_type: EV-REVIEW-VERDICT
        check: "reviewer confirms the non-claims match the source's hypotheses"
        pass_condition: "non-claims non-empty and accurate"
        hard_failure_if: HF-06
        machine_checkable: false
      - id: L5
        requirement: "verification_status never skipped; unresolved stays unresolved until a locator check"
        evidence_type: EV-PROVENANCE-LOG
        check: "status ladder transitions recorded with actor and timestamp"
        pass_condition: "no upgrade without locator evidence"
        hard_failure_if: HF-01
        machine_checkable: true
      - id: L6
        requirement: "quantitative claims carry quantity_check against the source"
        evidence_type: EV-QUOTE-VERBATIM
        check: "reviewer matches number/rate/exponent/codimension to the source"
        pass_condition: "within stated tolerance"
        hard_failure_if: HF-04
        machine_checkable: false
      - id: L7
        requirement: "unresolved items listed, never silently dropped"
        evidence_type: EV-SCHEMA-FIELD
        check: "unresolved[] present when any row is unresolved"
        pass_condition: "list present and complete"
        hard_failure_if: HF-01
        machine_checkable: true

  T-NUM:
    label: Numerical calibration and solver results
    verifier_ref: verifiers.numerics
    owner_gate: G-NUM
    verifier:
      machine_checkable:
        - numerics_lock respected (no self-gravitating artifact or N1+ work while locked)
        - evaluator behind a process boundary with a hard timeout
        - resolution ladder >= 4 with measured order
        - residual and invariant tables present
        - command, seed, version recorded and re-runnable
      reviewer_adjudicated:
        - discretization is consistent with the stated PDE and gauge
        - failure criteria are pre-registered rather than post-hoc
        - convergence order is credible given the scheme and the observed regime
    acceptance_lines:
      - id: N1
        requirement: "numerics_lock respected: no self-gravitating code or N1+ artifact while locked"
        evidence_type: EV-CMD-EXIT
        check: "lock guard test fails closed; registry scan for self-gravitating artifacts"
        pass_condition: "guard exit 0 while locked; no N1 artifact"
        hard_failure_if: HF-16
        machine_checkable: true
      - id: N2
        requirement: "evaluator runs in a separate process with a hard timeout"
        evidence_type: EV-CMD-EXIT
        check: "harness kills a deliberate infinite loop and reports timeout separately"
        pass_condition: "timeout/truncated/empty counted separately"
        hard_failure_if: HF-10
        machine_checkable: true
      - id: N3
        requirement: "convergence ladder >= 4 resolutions with observed order reported"
        evidence_type: EV-CONVERGENCE
        check: "fit order from the ladder; compare with declared order minus tolerance"
        pass_condition: "observed order within tolerance"
        hard_failure_if: HF-08
        machine_checkable: true
      - id: N4
        requirement: "exact-solution residual or self-convergence consistency reported"
        evidence_type: EV-CONVERGENCE
        check: "closed-form test case residual shrinks with resolution"
        pass_condition: "monotone residual decrease"
        hard_failure_if: HF-08
        machine_checkable: true
      - id: N5
        requirement: "invariant diagnostics (constraint residual, conservation) reported"
        evidence_type: EV-INVARIANT
        check: "table present with values at each resolution"
        pass_condition: "diagnostics present and bounded as declared"
        hard_failure_if: HF-08
        machine_checkable: true
      - id: N6
        requirement: "two independent runs reproduce within stated tolerance"
        evidence_type: EV-CMD-EXIT
        check: "same command re-run; compare outputs"
        pass_condition: "within stated tolerance"
        hard_failure_if: HF-08
        machine_checkable: true
      - id: N7
        requirement: "raw data, command, seed and version recorded"
        evidence_type: EV-PROVENANCE-LOG
        check: "ledger entry contains all four"
        pass_condition: "all present"
        hard_failure_if: HF-08
        machine_checkable: true
      - id: N8
        requirement: "any comparative performance claim carries a matched-budget null control"
        evidence_type: EV-NULL-CONTROL
        check: "tokens and wall-clock equal between arms; null arm present"
        pass_condition: "budgets matched; null reported"
        hard_failure_if: HF-17
        machine_checkable: true

  T-FORMAL:
    label: Lean/formalization artifacts
    verifier_ref: verifiers.formalization
    owner_gate: G-FORMAL
    verifier:
      machine_checkable:
        - pinned-toolchain kernel build exit 0
        - declared sorry/admit count matches build log
        - axiom set matches the pinned set
        - unresolved lemma count and dependency depth reported
      reviewer_adjudicated:
        - formal statement faithfully maps to the informal claim (no strengthening)
        - definitions encode the intended class rather than a convenient surrogate
    acceptance_lines:
      - id: F1
        requirement: "kernel build passes reproducibly with a pinned toolchain"
        evidence_type: EV-LEAN-BUILD
        check: "rebuild at the pinned commit; exit code and toolchain hash recorded"
        pass_condition: "exit 0 in a clean checkout"
        hard_failure_if: HF-08
        machine_checkable: true
      - id: F2
        requirement: "sorry/admit count declared and matches the build log"
        evidence_type: EV-LEAN-BUILD
        check: "count placeholders in source vs declared count"
        pass_condition: "counts match; no undeclared gap"
        hard_failure_if: HF-01
        machine_checkable: true
      - id: F3
        requirement: "formal statement maps to the informal claim without strengthening"
        evidence_type: EV-REVIEW-VERDICT
        check: "reviewer compares both statements and records the mapping"
        pass_condition: "reviewer verdict accept with cited sha256"
        hard_failure_if: HF-06
        machine_checkable: false
      - id: F4
        requirement: "unresolved lemma count and dependency depth reported"
        evidence_type: EV-SCHEMA-FIELD
        check: "metrics present per node"
        pass_condition: "both numbers present"
        hard_failure_if: HF-08
        machine_checkable: true
      - id: F5
        requirement: "axiom set pinned; additions declared and reviewed"
        evidence_type: EV-LEAN-BUILD
        check: "compare printed axiom cone with the pinned set"
        pass_condition: "no undeclared axiom"
        hard_failure_if: HF-01
        machine_checkable: true

# --- Validation contract ------------------------------------------------------------------
validation:
  # Filled by artifacts/audit/audit_run.py; a rubric with no passing self-test is not a gate.
  validator: artifacts/audit/audit_run.py
  last_run: null
  last_run_result: null
  report_sha256: null
  structural_validator: artifacts/worker-16/a0_rubric/check_rubric.py
  structural_report: artifacts/worker-16/a0_rubric/validator_report.json
  structural_checks:
    - V1 YAML parses; artifact_id, owner, status present
    - V2 T-SCHEMA/T-LIT/T-NUM/T-FORMAL present with machine_checkable and reviewer_adjudicated parts
    - V3 every acceptance line names an evidence_type from the catalog
    - V4 every hard_failure_if references an existing HF id
    - V5 no universal scalar score; metrics are diagnostic_only and forbid cross-class aggregation
    - V6 every hard failure has severity+detector; every gate has criteria+task_type
    - V7 every referenced class id is frozen or GLOBAL

frozen_classes:
  # Exactly these class IDs may appear in claims/artifacts. Any other ID is a class-binding
  # failure. Classes are not interchangeable and must never be disjoined in a statement.
  - id: AF-WCC-VAC-GEN
    label: Asymptotically flat, weak cosmic censorship, vacuum, generic
    dimension: "3+1"
    asymptotics: AF
    matter_model: vacuum
    symmetry: none_required
    cosmological_constant: 0
    formulation: WCC
    conclusion_primary: future_asymptotic_predictability
    conclusion_implied: [completeness_of_I_plus, no_naked_singularity_from_I_plus]
    forbidden_evidence:
      - matter_model != vacuum (no scalar/dust/perfect-fluid transfer without transfer_argument)
      - cosmological_constant != 0
      - dimension != "3+1"
  - id: AF-SCC-C2-VAC-GEN
    label: Asymptotically flat, strong cosmic censorship, C2 inextendibility, vacuum, generic
    dimension: "3+1"
    asymptotics: AF
    matter_model: vacuum
    symmetry: none_required
    cosmological_constant: 0
    formulation: SCC-C2
    conclusion_primary: C2_inextendibility_of_maximal_development
    conclusion_implied: []
    forbidden_evidence:
      - matter_model != vacuum
      - cosmological_constant != 0
      - formulation == SCC-C0 (C0 result cannot be cited as C2 evidence without an
        explicit transfer_argument; C0-inextendibility is STRONGER than C2)
      - dimension != "3+1"
    implication_note: "SCC-C0 implies SCC-C2; the converse does not hold."
  - id: AF-SCC-C0-VAC-GEN
    label: Asymptotically flat, strong cosmic censorship, C0 inextendibility, vacuum, generic
    dimension: "3+1"
    asymptotics: AF
    matter_model: vacuum
    symmetry: none_required
    cosmological_constant: 0
    formulation: SCC-C0
    conclusion_primary: C0_inextendibility_of_maximal_development
    conclusion_implied: [C2_inextendibility_of_maximal_development]
    forbidden_evidence:
      - matter_model != vacuum
      - cosmological_constant != 0
      - dimension != "3+1"
    status_risk: >-
      Known C0-extendibility results for perturbations of subextremal Kerr (Dafermos-Luk
      line of work) are an open-set counterexample candidate for this class as literally
      stated. Until L1 binds the exact hypotheses, this class' status MUST be recorded as
      `conditional` or `refuted_candidate`, never `open_conjecture` and never `theorem`.
  - id: AF-WCC-SCALAR-SPH
    label: Asymptotically flat, weak cosmic censorship, massless scalar field, spherical symmetry
    dimension: "3+1"
    asymptotics: AF
    matter_model: massless_scalar_field
    symmetry: spherical
    cosmological_constant: 0
    formulation: WCC
    conclusion_primary: future_asymptotic_predictability
    conclusion_implied: [completeness_of_I_plus, no_naked_singularity_from_I_plus]
    forbidden_evidence:
      - matter_model != massless_scalar_field
      - cosmological_constant != 0
      - dimension != "3+1"

# --- Gates -------------------------------------------------------------------------------
gates:
  - id: G-FORM
    scope: [F1, F2]
    task_type: T-SCHEMA
    criteria:
      - each schema has exactly one class_id from frozen_classes
      - exact quantifier prefix (no "roughly", "essentially", "or")
      - data space named with topology + regularity + decay + constraint + end structure
      - genericity type named: one of {comeager, full_measure, open_dense, codim_ge_1, non_generic_excluded}
      - conclusion_primary chosen from the class' allowed set; implied conclusions carry an
        implication note
      - falsifier is a finite, checkable procedure in the stated topology
      - no cross-class evidence without a transfer_argument and a downgraded conclusion_type
      - artifact exists and sha256 recorded
    verdict: pending
  - id: G-LIT
    scope: [L0, L1]
    task_type: T-LIT
    criteria:
      - every citation has a locator (DOI | arXiv id | journal page) and resolution_status
      - every claim's evidence set has citation_support == 1.0 (no unresolved/contradicted)
      - statement scope matched to class_id; matter/Lambda/dimension/symmetry of the source
        explicitly recorded
      - quantitative claims (rates, exponents, codimension) carry a quantity_check
      - unresolved items listed in `unresolved[]`, not silently dropped
    verdict: pending
  - id: G-AUDIT
    scope: [A1]
    task_type: cross_cutting
    criteria:
      - every done/passed node has an existing artifact with a recorded sha256
      - hard_failure_rate <= 0.10 across reviewed artifacts
      - duplicate_cluster_rate <= 0.25 across accepted claims
      - reviewer agreement kappa >= 0.60 on a >= 20% blind sample, or the review is
        re-run with a third reviewer
      - independent-replication claim for any numeric result (two runs, same command)
    verdict: pending
  - id: G-NUM
    scope: [N0, N1]
    task_type: T-NUM
    criteria:
      - G-FORM and G-AUDIT passed
      - evaluator runs behind a process boundary with a hard timeout (no in-process
        arbitrary Python)
      - convergence study with >= 4 resolutions and observed order reported
      - invariant diagnostics (constraint residuals, mass/charge conservation) reported
      - two independent runs reproduce within stated tolerance
    verdict: pending
    lock: "N1 self-gravitating production is locked until G-FORM and G-AUDIT pass."
  - id: G-FORMAL
    scope: [any formalization node]
    task_type: T-FORMAL
    criteria:
      - kernel build passes with a pinned toolchain
      - declared sorry/admit count matches the build log (no undeclared gaps)
      - formal statement maps to the informal claim by an explicit fidelity note
      - axiom set is pinned; additions are declared and reviewed
    verdict: pending

# --- Hard-failure taxonomy ----------------------------------------------------------------
# HF-NN are binary defects; any occurrence is counted. A claim/artifact with a critical HF
# cannot be accepted regardless of other merits.
hard_failures:
  - id: HF-01
    name: fluent_text_promotion
    severity: critical
    detector: claim.conclusion_type == theorem AND (no artifact_refs OR artifact missing OR hash mismatch)
  - id: HF-02
    name: class_leakage
    severity: critical
    detector: unknown class_id | disjunction of class_ids | evidence metadata violates the
      class forbidden_evidence list without transfer_argument | conclusion_type not allowed
      for class
  - id: HF-03
    name: unsupported_citation
    severity: critical
    detector: claim cites a citation whose resolution_status in {unresolved, contradicted}
      or whose class metadata mismatches the claim's class
  - id: HF-04
    name: quantitative_mismatch
    severity: major
    detector: statement contains a quantity (rate/exponent/codimension/count) and evidence
      refs lack quantity_check, or quantity differs from source by more than stated tolerance
  - id: HF-05
    name: done_without_artifact
    severity: critical
    detector: node.status == done AND declared artifact does not exist / hash not recorded
  - id: HF-06
    name: assumption_smuggling
    severity: critical
    detector: statement requires smallness/symmetry/regularity/measure condition present in
      the cited theorem but absent from the schema's assumptions (or vice versa)
  - id: HF-07
    name: duplication
    severity: major
    detector: pairwise similarity of claim statements above 0.60, or the same artifact
      submitted under two node IDs without cross-reference
  - id: HF-08
    name: unreproducible_command
    severity: major
    detector: artifact records a command without exit code, seed, version/commit, or the
      result is not reproducible from the command
  - id: HF-09
    name: max_statistic_over_few_seeds
    severity: major
    detector: reported score is a max/best over < 8 seeds, or best-seed reported without
      mean and sd
  - id: HF-10
    name: evaluator_boundary_violation
    severity: critical
    detector: LLM-generated code evaluated in the same process (no fork/timeout), or a run
      whose truncated/timeout/empty calls are not counted separately
  - id: HF-11
    name: budget_laundering
    severity: major
    detector: arm comparison unequal in total tokens or wall-clock; effort axis varied while
      claiming a call-count-matched design
  - id: HF-12
    name: claim_recycling
    severity: minor
    detector: a previously rejected claim re-submitted without change and without a new
      evidence ref
  - id: HF-13
    name: cross_project_contamination
    severity: major
    detector: >-
      artifact contains tokens or criteria from the base repository's previous project
      (Erdos problem 64 / cap-set / graph search / FunSearch) as if they were cosmic-censorship
      criteria, e.g. 'cubic graph', 'minimum degree', '2^k cycle', 'cap set' inside a
      class-binding rule set; or an agent's task framing imports WCC/SCC as graph-theoretic
      weakly/strongly connected components
    evidence_2026_09_11: artifacts/worker-06/class_binding_rules.json
      cross_domain_contamination_regexes; astra-lead-literature.log line 10 (WCC/SCC first
      parsed as connected components before self-correction)
  - id: HF-14
    name: universal_scalar_score
    severity: critical
    detector: >-
      any gate, metric, dashboard or verdict that reduces acceptance to one composite
      scalar, ranks classes/task types/arms by a single score, or aggregates metrics across
      classes before an accept/reject decision
  - id: HF-15
    name: unnamed_evidence
    severity: major
    detector: >-
      an acceptance line, review verdict or gate criterion that does not name an
      evidence_type from evidence_types, or cites an evidence object that does not exist
  - id: HF-16
    name: numerics_lock_violation
    severity: critical
    detector: >-
      numerics_lock.state == locked AND (a self-gravitating artifact exists OR an N1+ node
      is active/done OR a lock-guard test is absent/failing open)
  - id: HF-17
    name: missing_null_control
    severity: major
    detector: >-
      a comparative claim (arm vs arm, swarm vs baseline, class vs class) without a matched
      token and wall-clock budget and a null/iid control run

# --- Metrics ------------------------------------------------------------------------------
# Diagnostic only. Every metric names its evidence type and forbids cross-class aggregation;
# none may be used as a single acceptance score (see no_universal_scalar_score / HF-14).
metrics:
  class_binding:
    definition: fraction of claims whose class_id is frozen, singular, and consistent with
      the evidence metadata and conclusion type
    evidence_type: EV-SCHEMA-FIELD
    target: 1.0
    granularity: per_class
    aggregation_across_classes: forbidden
    accept_reject_role: diagnostic_only
  citation_support:
    definition: sum(weight(status)) / n_citations, weights verified_primary=1.0,
      verified_secondary=0.5, partial=0.25, unresolved=0.0, contradicted=-1.0, capped at 0
    evidence_type: EV-LOCATOR-RESOLVE
    target: 1.0
    granularity: per_class
    aggregation_across_classes: forbidden
    accept_reject_role: diagnostic_only
  hard_failure_rate:
    definition: claims/artifacts with >=1 critical HF divided by reviewed claims/artifacts
    evidence_type: EV-REVIEW-VERDICT
    target: "<= 0.10"
    granularity: per_task_type
    aggregation_across_classes: forbidden
    accept_reject_role: diagnostic_only
  duplication:
    definition: "1 - mean pairwise novelty; novelty(text) = 1 - max shingle Jaccard to any
      other accepted text"
    evidence_type: EV-DIFF-MATRIX
    target: "<= 0.25"
    granularity: per_task_type
    aggregation_across_classes: forbidden
    accept_reject_role: diagnostic_only
  effective_sample_size:
    definition: "Kish ESS = (sum w)^2 / sum(w^2) over reviewer/agent labels; the project
      prior is that nine 'independent' LLM judges give ESS ~2.2 and must not be reported
      as nine independent reviews"
    evidence_type: EV-REVIEW-VERDICT
    target: "report ESS, never nominal n"
    granularity: per_review_pool
    aggregation_across_classes: forbidden
    accept_reject_role: diagnostic_only
  information_gain:
    definition: "IG(task) = H_before(class status distribution) - H_after, in bits, counted
      only for artifacts that pass their gate; cost-normalised as IG per 10^3 tokens and
      IG per agent-hour"
    evidence_type: EV-GATE-VERDICT
    target: "> 0 net of null control; stop a direction when marginal IG/token falls below
      the cheapest alternative arm"
    granularity: per_class_and_task_type
    aggregation_across_classes: forbidden
    accept_reject_role: diagnostic_only
  novel_accepted_coverage:
    definition: number of frozen classes with >=1 newly accepted artifact / 4
    evidence_type: EV-GATE-VERDICT
    target: "report per class, never as a lone headline number"
    granularity: per_class
    aggregation_across_classes: forbidden
    accept_reject_role: diagnostic_only

# --- Review protocol ----------------------------------------------------------------------
review_protocol:
  sampling: ">= 20% of accepted claims, blind to author identity where the harness allows"
  independence: "reviewers must not be authors; reviewers must be counted by Kish ESS"
  promotion_rule: "only G-* verdicts promote a node to done; agent consensus is not evidence"
  null_first: "every quantitative comparison is accompanied by a matched-budget null/iid control"
  seeds_rule: "max-statistics require >= 8 seeds; otherwise report mean +/- sd and label suggestive"
  verdict_shape: "verdict in {accept, revise, reject, inconclusive} + per-dimension score vector + hard_failures[] + cited sha256"
  evidence_rule: "every acceptance line and every verdict names an evidence_type; unnamed evidence is HF-15"

non_goals:
  - "This rubric does not decide physics. It decides whether an artifact may be promoted."
  - "It does not replace per-class domain review; a class schema still needs a competent reader."
  - "It does not author a scalar leaderboard; HF-14 forbids one."

falsifiers:
  - id: RUB-F1
    statement: "An acceptance line exists whose evidence type cannot be checked by machine or reviewer-adjudicated with named evidence."
    verdict_if_true: "rubric rejected"
  - id: RUB-F2
    statement: "A composite scalar is used anywhere to accept, reject, rank or promote."
    verdict_if_true: "rubric rejected (HF-14)"
  - id: RUB-F3
    statement: "Two task types collapse to the same verifier, making the per-task-type split cosmetic."
    verdict_if_true: "merge the task types or reject the split"
  - id: RUB-F4
    statement: "A frozen class cannot be distinguished from another on a concrete test case."
    verdict_if_true: "taxonomy (F0) failure, not a rubric failure; escalate to lead-formulation"
