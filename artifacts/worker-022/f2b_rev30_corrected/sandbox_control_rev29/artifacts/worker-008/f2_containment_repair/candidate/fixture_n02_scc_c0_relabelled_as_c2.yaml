schema_version: '1.0'
artifact_kind: class_schema
class_id: AF-SCC-C2-VAC-GEN
node_id: F2b
owner: lead-formulation
authored_by: astra-lead-formulation
authored_at: '2026-09-11T23:23:57+08:00'
timestamp_provenance: authored_at corrected to the filesystem mtime of this file; the first-pass value was ahead
  of wall clock (lead self-audit 2026-09-11T23:26+08:00)
revision: 1
supersedes: null
class_components:
  asymptotics: AF
  censorship: SCC
  matter: VAC
  genericity: GEN
  regularity_token: C0
class_contract_pointer: artifacts/formulation/formulation_taxonomy.yaml#class_contracts.AF-SCC-C0-VAC-GEN
sibling_disjoint_from: AF-SCC-C2-VAC-GEN
epistemic_status: open_problem
promotion_rule: may be recorded as a theorem only with a checked proof artifact and artifact_refs; a schema is never
  evidence for its own conclusion
scope_statement: 'The maximal globally hyperbolic development of generic asymptotically flat vacuum initial data
  (4-dimensional Einstein vacuum equations, Lambda = 0) admits no proper future extension whose metric is merely
  continuous (C0) and Lorentzian; no differentiability, no curvature, and no equation requirement are assumed of
  the extension. The class is about non-extendibility of the development; it makes no statement about what an observer
  at I+ sees.

  '
quantifiers:
  formal: 'forall (s,delta) in D0: exists G_{s,delta} subset X^{s,delta}_vac(AF) with G_{s,delta} comeager: forall
    (Sigma,h,K) in G_{s,delta}, letting (M,g) be the maximal globally hyperbolic development: not exists a proper
    future C0 metric extension (M'',g'',iota) of (M,g).'
  ordered:
  - kind: forall
    binder: (s,delta)
    domain_id: D0
  - kind: exists
    binder: G_{s,delta}
    domain_id: D1
  - kind: forall
    binder: (Sigma,h,K)
    domain_id: D2
  - kind: not_exists
    binder: (M',g',iota)
    domain_id: D3
  domains:
    D0:
      definition: 'admissible regularity pairs: Sobolev variant s > 5/2 and delta in (1/2,1), or the smooth-with-decay
        default'
      definition_ref: regularity.data_regularity
    D1:
      definition: comeager (residual) subsets of X^{s,delta}_vac(AF) in the named topology; complement meager
      definition_ref: genericity
    D2:
      definition: one-ended asymptotically flat vacuum initial data satisfying both constraint equations in the
        declared regularity class
      definition_ref: data_class
    D3:
      definition: proper future C0 metric extensions of the maximal development, in the exact sense of extension_predicate
      definition_ref: extension_predicate
  order_matters: true
  order_note: the comeager set is fixed independently of the data; the extension quantifier is a negated existential
    over extensions of the given development, not over data
  negation: there exists (s,delta) in D0 such that for every comeager G subset X^{s,delta}_vac(AF) there is (Sigma,h,K)
    in G whose maximal development admits a proper future C0 metric extension; equivalently the set of data admitting
    such an extension is non-meager.
  negation_normal_form: '{ (s,delta) in D0 : { D in X : exists proper future C0 metric extension of MGHD(D) } is
    non-meager } is non-empty'
  quantifier_class: forall-exists(comeager)-forall-not-exists(extension)
extension_predicate:
  name: proper_future_extension_in_class
  frozen_regularity: C0
  frozen_equation_concept: none
  frozen_direction: future
  definition: 'A triple (M'', g'', iota) is a proper future C0 metric extension of (M,g) iff: (a) iota: M -> M''
    is an isometric embedding (iota_* g = g'' restricted to iota(M)); (b) iota(M) is an open, proper subset of M'';
    (c) M'' is a topological 4-manifold, connected and time-orientable, whose time orientation restricts to that
    of M; (d) g'' is a continuous, nondegenerate Lorentzian metric on M'' (signature (-,+,+,+)); (e) NO equation
    is required of g'' on M''; (f) the extension adds points to the future: there exist q in iota(M) and p in M''
    minus iota(M) with p in I^+(q; g'').'
  why_bare_metric: 'this is the strongest form of the statement: every extension class with more structure or more
    requirements is a subset of this one, so ruling out ALL continuous metric extensions is the hardest and most
    informative version.'
  must_not_conflate:
  - extensions with locally square-integrable curvature (H2_loc) are a DIFFERENT class; H2_loc is not C0
  - extensions that solve Ric = 0 distributionally are a DIFFERENT, strictly weaker class (see variants)
  - a C1 or C^{1,1} extension class is different from C0
  - a 'continuous metric extension' is not required to make the geodesic equation classically well posed; see the
    C0 uniqueness caveat
  c0_uniqueness_caveat: for a merely continuous metric the classical geodesic equation is not defined (Christoffel
    symbols involve first derivatives), so local uniqueness of geodesics is not automatic and the elementary argument
    'future geodesic completeness of M blocks future extensions' CANNOT be imported from the C2 sibling. Non-vacuity
    must be argued inside this class, not borrowed.
topology:
  spacetime_dimension: 4
  slice_topology: Sigma connected, oriented, complete Riemannian 3-manifold diffeomorphic to R^3 (exactly one asymptotically
    flat end)
  end_structure: one AF end
  completeness_of_slice: true
  conformal_boundary:
  - I+ (future null infinity)
  - I- (past null infinity)
  - i0 (spatial infinity)
  I_plus_topology: R x S^2
  development_topology: M globally hyperbolic, M diffeomorphic to Sigma x R, Sigma a Cauchy surface
  extension_topology: M' a connected topological 4-manifold containing iota(M) as an open proper subset; M' is NOT
    assumed smooth, globally hyperbolic, compact, or AF
  forbidden:
  - closed or periodic spatial slice
  - more than one asymptotically flat end
  - assuming M' is a smooth manifold with a C2 metric (that is the sibling class)
  - assuming the extension preserves any asymptotic structure
data_class:
  matter: none
  cosmological_constant: 0
  equations: Einstein vacuum equations Ric(g) = 0
  constraints:
    hamiltonian: R(h) - K_ij K^ij + (tr_h K)^2 = 0
    momentum: D^j (K_ij - (tr_h K) h_ij) = 0
  regularity_class:
    default: 'smooth-with-decay: h and K of class C^infinity with the numeric rates below'
    sobolev_variant:
      s: s > 5/2
      delta: delta in (1/2, 1)
      spaces: h - delta_ij in H^s_delta, K in H^{s-1}_{delta+1}
      status: standard_choice; UNVERIFIED citation
  asymptotic_decay:
    metric: h_ij - delta_ij = O(r^{-1}) and |d^k h| = O(r^{-1-k}) for 1 <= k <= s
    second_fundamental_form: K_ij = O(r^{-2}) and |d^k K| = O(r^{-2-k}) for 0 <= k <= s-1
    parity_conditions: not imposed
  adm_mass:
    exists: true
    sign: m_ADM >= 0 by the positive mass theorem
    citation_status: unresolved
  gauge: no gauge fixed on the data; all predicates are diffeomorphism invariant
  diffeo_quotient: genericity is defined on data modulo asymptotically-identity diffeomorphisms; the quotient construction
    is a declared open technical gap (see unresolved_items)
regularity:
  data_regularity: smooth-with-decay default, or H^s_delta with s > 5/2, delta in (1/2,1)
  solution_regularity: g of class C^infinity(M) for smooth data (H^s_loc for the Sobolev variant); maximal globally
    hyperbolic development exists and is unique up to isometry
  i_plus_regularity: gtilde extends to I+ with C^k regularity, k >= 3; k is part of the assumption
  extension_regularity: C0
  extension_regularity_exact: continuous (C0) nondegenerate Lorentzian metric; no differentiability assumed
  extension_solution_concept: none
  must_not_conflate:
  - H2_loc (locally square-integrable curvature) is strictly between C2 and C0 and is NOT this class
  - a distributional-vacuum C0 extension is a strictly weaker statement (fewer allowed extensions)
  - a C2-inextendibility result does not establish this class; the implication runs C0 => C2 only (see implication_ledger)
  - 'differentiability smuggled in through ''smooth coordinates'' or a ''regular boundary'': the metric is only
    continuous'
  - WCC content (I+ completeness, visibility) must not appear as the conclusion here
genericity:
  kind: residual_comeager
  ambient_space: X^{s,delta}_vac(AF), modulo asymptotically-identity diffeomorphisms
  topology_or_measure: norm topology of H^s_delta x H^{s-1}_{delta+1}; Frechet topology for the smooth class
  generic_set: G = countable intersection of open dense sets; complement meager
  excluded_set: meager; must contain (status unresolved) the stationary/axisymmetric Kerr data, whose maximal development
    admits a C-infinity (hence C0) vacuum extension, plus self-similar and finite-dimensional analytic families
  excluded_set_status: unresolved
  is_part_of_class: true
  class_change_warning: 'genericity is part of the class: ''for all data'' is strictly stronger and ''open dense
    only'' strictly weaker; neither may be substituted'
  transfer_failures:
  - pair:
    - residual_comeager
    - full_measure
    direction: no_transfer
    witness: comeager sets can be Lebesgue-null
    status: standard_fact
    citation_status: unresolved
  - pair:
    - full_measure
    - residual_comeager
    direction: no_transfer
    witness: comeager null sets exist
    status: standard_fact
    citation_status: unresolved
  - pair:
    - open_dense_escape
    - residual_comeager
    direction: no_transfer
    witness: open dense does not imply comeager
    status: elementary
    citation_status: n/a
  variants:
  - kind: open_dense_escape
    statement_strength: strictly_weaker
    is_this_class: false
  - kind: none
    statement_strength: strictly_stronger
    is_this_class: false
non_vacuity:
  condition: the class must be applied to data whose maximal development admits a future boundary that is not a
    regular (smoothly attachable) boundary; a development that is already future geodesically complete is expected
    to be inextendible, but in the C0 class this expectation is NOT elementary because geodesic uniqueness for continuous
    metrics is not available (see extension_predicate.c0_uniqueness_caveat).
  witness_type: one-parameter family in G whose development contains a future trapped surface and a Cauchy horizon
    candidate; incompleteness of the development is the non-vacuity marker
  status: trapped-surface formation is standard; membership of the family in G is UNVERIFIED here
  vacuity_falsifier: if the class is cited for a development that is trivially inextendible for reasons unrelated
    to the C0 statement (e.g. one already shown C2-inextendible by a stronger theorem), the citation adds no information
    and must be marked as subsumed, not as evidence for this class
  c0_specific_note: a C2-inextendibility proof SUBSUMES this class's conclusion (C0-inextendibility is stronger);
    citing the weaker class as if it were the achievement is conclusion deflation and must be labelled
i_plus:
  role: assumption
  in_conclusion: false
  completeness_in_conclusion: false
  definition: AF structure at future null infinity is used only to define the data class and the maximal development;
    I+ appears nowhere in the conclusion
  forbidden:
  - asserting I+ completeness as part of this class conclusion
  - importing the WCC I+ predicate as the falsifier of this class
visibility:
  role: not_in_conclusion
  reason: visibility from I+ is the WCC predicate. This SCC class asserts non-extendibility of the maximal development;
    a singularity can be invisible from I+ and still the development can be extendible, and vice versa. The two
    axes are logically independent as stated.
  visible_singularity_is_wcc: true
  forbidden_falsifier: a visible incomplete causal geodesic is a WCC falsifier; it is NOT the falsifier of this
    class
  derived_note: inextendibility is a statement about the boundary of the development, not about causal relations
    to I+
conclusion:
  conclusion_type: scc_c0_future_inextendibility
  epistemic_status: open_problem
  family: SCC
  statement_natural_language: Generic asymptotically flat vacuum initial data have a maximal development that is
    future-inextendible as a continuous Lorentzian manifold.
  statement_formal: 'forall (s,delta) in D0 exists G_{s,delta} comeager forall D in G_{s,delta}: not exists proper_future_extension_in_class(MGHD(D))'
  equivalent_rephrasings:
  - phrasing: the maximal development is future inextendible as a C0 Lorentzian manifold
    status: equivalent by definition of extension_predicate
  - phrasing: the metric cannot be continuously extended past the future boundary of the development
    status: informal, UNVERIFIED as an equivalence
  known_obstruction: 'the exact stationary (Kerr) vacuum data admit a C-infinity vacuum extension, hence also a
    C0 extension, so the unqualified statement over ALL AF vacuum data is false; the class is only meaningful with
    the generic quantifier and the extendible family must be shown meager. citation_status: unresolved (L1 owns
    the anchor).'
  forbidden_strengthenings:
  - C2 or C1 or H2_loc inextendibility (different classes; C2 and H2_loc are NOT stronger than C0)
  - two-sided inextendibility (different, stronger statement)
  - the statement for ALL AF vacuum data (false if the Kerr obstruction is as stated)
  - I+ completeness or asymptotic predictability (WCC content)
  forbidden_weakenings:
  - dropping the generic quantifier in practice while keeping the word
  - substituting the distributional-vacuum variant for the bare-metric class
  - substituting H2_loc for C0
  - replacing future by two-sided direction
  claim_promotion: epistemic_status=open_problem; theorem requires artifact_refs with a checked proof
implication_ledger:
  one_way_entailments:
  - from: no proper future C0 metric extension
    to: no proper future C2 extension
    relation: entails
    reason: every C2 extension is a C0 metric extension
    status: elementary
  - from: no proper future C0 metric extension
    to: no proper future C0 distributional-vacuum extension
    relation: entails
    reason: extensions required to solve Ric = 0 distributionally are a subset of all continuous metric extensions
    status: elementary
  forbidden_transfers:
  - from: no proper future C2 extension
    to: this class
    reason: C2 is a strictly smaller extension class (E_C2 subset of E_C0), so C2-inextendibility is strictly weaker than C0-inextendibility
  - from: H2_loc-inextendibility
    to: this class
    reason: H2_loc is a distinct value on the regularity axis and is not contained in this class's extension set
      in the needed direction
  - from: AF-WCC-VAC-GEN
    to: this class
    reason: visibility and inextendibility are logically independent as stated
  cross_family: no WCC <-> SCC transfer is licensed by this artifact
  subsumption_note: if this class is proved, the C2 sibling follows; recording the sibling as an independent achievement
    would double-count
falsifier:
  tier_1:
    refutes: AF-SCC-C0-VAC-GEN
    witness_type: an open (or at least non-meager) set of one-ended AF vacuum data whose maximal developments admit
      proper future C0 metric extensions, with the extension exhibited explicitly (topological manifold, continuous
      nondegenerate metric, isometric embedding, future points added)
    genericity_requirement: one extendible data set refutes only the 'for all data' strengthening; tier 1 requires
      the extendible set to be shown non-meager
    machine_checkable_steps:
    - constraint residuals below tolerance
    - g' is continuous and nondegenerate on a neighbourhood of the boundary (sampled)
    - iota is an isometry onto an open proper subset
    - the added points lie in the future of iota(M)
    non_machine_checkable_step: non-meagerness of the extendible set
  tier_2:
    refutes: only the strictly stronger class 'forall AF vacuum data'
    witness_type: one AF vacuum data set (e.g. exact Kerr data) with an exhibited proper future C0 metric extension
    labelling_required: refutes_strengthening_only
  schema_falsifiers:
  - 'a statement is bound to this class whose conclusion is really C2 or H2_loc inextendibility: class inflation'
  - 'a statement is bound to this class whose falsifier is a visible singularity: wrong-family falsifier'
  - 'an H2_loc hypothesis is present but the class claims bare C0: smuggled regularity'
  - 'the class is cited for a development already shown C2-inextendible and presented as new evidence: subsumed
    citation'
anti_scope:
  not_this_class:
  - class_id: AF-SCC-C2-VAC-GEN
    why: different (weaker) statement; C0 containment runs C0 => C2 only
  - class_id: AF-WCC-VAC-GEN
    why: visibility/predictability content, not extendibility
  - class_id: AF-WCC-SCALAR-SPH
    why: different matter and symmetry
  - class_id: AF-SCC-L2LOC-VAC-GEN (candidate)
    why: H2_loc extension class is separate and must not be reported as C0
  - class_id: AF-SCC-C0-DISTRIBUTIONAL-VAC-GEN (candidate variant)
    why: equation requirement is a frozen axis
  phrases_that_are_not_this_class:
  - any 'C0 or C2' composite regularity
  - '''inextendible'' with no regularity token'
  - '''locally square-integrable curvature'' presented as C0'
  - '''the singularity is not visible'' (WCC phrasing)'
provenance:
  citation_status: unverified
  sources:
  - concept: Choquet-Bruhat-Geroch maximal globally hyperbolic development
    identifier: null
    status: unresolved
    needed_for: regularity
  - concept: C0-inextendibility results and their exact hypotheses (which additional structure, if any, the extension
      is assumed to carry)
    identifier: null
    status: unresolved
    needed_for: extension_predicate, conclusion
  - concept: Kerr family and its maximal analytic extension as a counterexample to the unqualified statement
    identifier: null
    status: unresolved
    needed_for: known_obstruction
  - concept: H2_loc-inextendibility results and why they are not C0
    identifier: null
    status: unresolved
    needed_for: anti_scope, must_not_conflate
  unresolved_citations:
  - whether the literature's C0-inextendibility results assume any curvature or solution structure on the extension
  - the claimed meagerness of the extendible family
  no_progress_claim: no assertion that this class is proved, refuted, or open; L1 owns the ledger
unresolved_items:
- diffeomorphism-quotient construction for genericity
- meagerness of the excluded families
- non-vacuity witness membership in G
- the correct definition of 'extension' for merely continuous metrics (geodesic uniqueness may fail)
review_status:
  independent_reviewers: []
  verdict: pending
  requested_reviewers:
  - deepseek-flash-19
  - astra-lead-audit
  gate: G-FORM
