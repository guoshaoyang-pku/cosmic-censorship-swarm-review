class_components:
  asymptotics: AF
  censorship: SCC
  matter: VAC
  genericity: GEN
  regularity_token: C0
class_contract_pointer: artifacts/formulation/formulation_taxonomy.yaml#class_contracts.AF-SCC-C0-VAC-GEN
sibling_disjoint_from: AF-SCC-C2-VAC-GEN
epistemic_status: open_problem
promotion_rule: may be recorded as a theorem only with a checked proof artifact and
  artifact_refs; a schema is never evidence for its own conclusion
scope_statement: 'The maximal globally hyperbolic development of generic asymptotically
  flat vacuum initial data (4-dimensional Einstein vacuum equations, Lambda = 0, no
  symmetry) admits no proper future extension whose metric is merely continuous (C0)
  and Lorentzian. No differentiability, no curvature, and no equation requirement
  are assumed of the extension. The class concerns non-extendibility of the development
  and makes no statement about what an observer at I+ sees.

  '
quantifiers:
  formal: 'exists G subset X_vac(AF), G comeager in the Frechet topology of the frozen
    data class: forall D in G, letting (M,g) = MGHD(D): not exists (M'',g'',iota)
    in Ext_future_C0(M,g)'
  ordered:
  - kind: exists
    binder: G
    domain_id: D1
  - kind: forall
    binder: D
    domain_id: D2
  - kind: not_exists
    binder: (M',g',iota)
    domain_id: D3
  domains:
    D1:
      definition: 'comeager (residual) subsets of X_vac(AF): countable intersections
        of open dense sets, with meager complement, in the Frechet topology of the
        frozen smooth-with-decay class'
      definition_ref: genericity
    D2:
      definition: one-ended asymptotically flat vacuum initial data of the frozen
        smooth-with-decay class, satisfying both constraint equations
      definition_ref: data_class
    D3:
      definition: triples satisfying clauses (a)-(f) of extension_predicate, with
        extension_regularity frozen to C0
      definition_ref: extension_predicate
  order_matters: true
  order_note: the comeager set is chosen once for the single frozen data class and
    independently of the individual data D; the final quantifier is a negated existential
    over extensions of a fixed development, not over data
  negation: every comeager G subset X_vac(AF) contains data D whose maximal development
    admits a proper future C0 metric extension; equivalently the extendible data form
    a non-meager set.
  negation_normal_form: '{ D in X_vac(AF) : Ext_future_C0(MGHD(D)) non-empty } is
    non-meager'
  quantifier_class: exists(comeager)-forall-not_exists(extension)
  extensions:
    single_class_note: 'this artifact is ONE class statement: the data class is frozen
      (no disjunctive domain), so it can satisfy an exact-match guard against F1/F2a.'
extension_predicate:
  name: proper_future_C0_metric_extension
  frozen_regularity: C0
  frozen_equation_concept: none
  frozen_direction: future
  extensions:
    category: M' is a smooth (C-infinity) connected 4-manifold; g' is a continuous
      section of the symmetric 2-tensor bundle over M'. Only g' regularity is frozen
      to C0; the manifold category is smooth so that tensor fields are standard.
  definition: '(M'',g'',iota) is a proper future C0 metric extension of (M,g) iff
    (a) iota: M -> M'' is an isometric embedding, iota_* g = g'' restricted to iota(M);
    (b) iota(M) is an open proper subset of M''; (c) M'' is connected and time-orientable,
    and its time orientation restricts to that of M; (d) g'' is continuous and nondegenerate
    with Lorentzian signature (-,+,+,+); (e) g'' is not required to satisfy any equation
    on M''; (f) the extension adds points to the future: some p in M'' minus iota(M)
    lies in I^+(q;g'') for some q in iota(M).'
  why_bare_metric: every extension class carrying more structure or more requirements
    is a subset of this one, so excluding all continuous metric extensions is the
    strongest and most informative statement on the regularity axis.
  must_not_conflate:
  - H2_loc (locally square-integrable curvature) is a distinct regularity-axis value,
    not this class; C2 is contained in H2_loc elementarily, but H2_loc is NOT contained
    in C0 at the borderline Sobolev embedding s = n/2 = 2 in four dimensions, so containment
    must not be assumed
  - extensions solving Ric = 0 distributionally form a DIFFERENT, strictly weaker
    class
  - a C1 or C^{1,1} extension class is different from C0
  - a continuous metric extension need not make the geodesic equation classically
    well posed
  c0_uniqueness_caveat: for a merely continuous metric the Christoffel symbols are
    not defined, so classical geodesic uniqueness is not available; the elementary
    argument "future geodesic completeness of M blocks future extensions" may NOT
    be imported from the C2 sibling. Non-vacuity must be argued inside this class.
c0_specifics:
  what_fails_at_c0:
  - curvature invariants are undefined for a merely continuous metric, so curvature-blow-up
    criteria are unavailable and may not appear as hypotheses
  - differentiability of the metric across a Cauchy horizon is unavailable; any obstruction
    must be a global C0 geometric obstruction
  - geodesic uniqueness is unavailable (see extension_predicate.c0_uniqueness_caveat),
    so completeness arguments do not transfer
  - the candidate positive tool is the spacelike-diameter obstruction; it is recorded
    only as a candidate anchor pending L1 and is demonstrated, at most, for Schwarzschild-type
    interiors, not for generic data
  - a continuous extension can exist and still be essentially singular (weak null
    singularity); excluding that is a different, revised class
  conclusion_relation_to_sibling: 'the regularity demanded of the extension is lower
    than in the C2 sibling, while the logical strength of the statement is not lower:
    excluding all continuous extensions excludes all C2 extensions. The two classes
    inherit nothing from each other in either direction, and this schema contains
    no C2 hypothesis and no C2 conclusion.'
topology:
  spacetime_dimension: 4
  slice_topology: Sigma connected, oriented, complete Riemannian 3-manifold diffeomorphic
    to R^3, exactly one asymptotically flat end
  end_structure: one AF end
  completeness_of_slice: true
  conformal_boundary:
  - I+ (future null infinity)
  - I- (past null infinity)
  - i0 (spatial infinity)
  I_plus_topology: R x S^2
  development_topology: M globally hyperbolic, M diffeomorphic to Sigma x R, Sigma
    a Cauchy surface
  extension_topology: M' a smooth connected 4-manifold containing iota(M) as an open
    proper subset; M' not assumed globally hyperbolic, compact, or AF
  forbidden:
  - closed or periodic spatial slice
  - more than one asymptotically flat end
  - assuming M' carries a twice-differentiable metric (that is the sibling class)
  - assuming the extension preserves any asymptotic structure
data_class:
  matter: none
  cosmological_constant: 0
  symmetry: none_assumed
  extensions:
    symmetry_note: no symmetry is assumed; whether symmetric data form a meager subset
      of the declared data space is left in unresolved_items, not asserted
  equations: Einstein vacuum equations Ric(g) = 0
  constraints:
    hamiltonian: R(h) - K_ij K^ij + (tr_h K)^2 = 0
    momentum: D^j (K_ij - (tr_h K) h_ij) = 0
  regularity_class:
    default: 'smooth-with-decay explicit class: h and K of class C^infinity with the
      numeric rates below; this is the frozen class of the statement'
    extensions:
      selected: smooth-with-decay
    sobolev_variant:
      is_this_class: false
      name: weighted Sobolev H^s_delta
      s: s > 5/2
      delta: delta in (1/2, 1)
      spaces: h - delta_ij in H^s_delta, K in H^{s-1}_{delta+1}
      status: declared separately and IS NOT this class; the disjunctive domain used
        in revision 2 made the artifact a family of statements (HF-06) and is removed.
        The s and delta values are named here for compatibility with the binding gate's
        data-class check; they are not quantified over by this class.
  asymptotic_decay:
    metric: h_ij - delta_ij = O(r^{-1}); |d^k h| = O(r^{-1-k}) for 1 <= k <= infinity,
      understood in the smooth-with-decay class
    second_fundamental_form: K_ij = O(r^{-2}); |d^k K| = O(r^{-2-k}) for 0 <= k <=
      infinity, understood in the smooth-with-decay class
    parity_conditions: not imposed
  adm_mass:
    exists: true
    citation_status: unresolved
    extensions:
      sign_status: consequence requiring the positive mass theorem under the declared
        completeness and decay hypotheses; NOT asserted as a hypothesis-free fact
      pmt_locator: unresolved
  gauge: no gauge fixed on the data; predicates are diffeomorphism invariant
  diffeo_quotient: genericity is defined on data modulo asymptotically-identity diffeomorphisms;
    the quotient construction is a declared open technical gap (unresolved_items)
regularity:
  data_regularity: smooth-with-decay class as frozen in data_class.regularity_class.default
  solution_regularity: g of class C^infinity(M) for the frozen smooth data; the maximal
    globally hyperbolic development exists and is unique up to isometry
  i_plus_regularity: the conformal factor extends to I+ with C^k regularity, k >=
    3; k >= 3 is an ASSUMPTION of this class, source unresolved (it is not derived
    here)
  extension_regularity: C0
  extension_regularity_exact: continuous nondegenerate Lorentzian metric on a smooth
    4-manifold; no differentiability assumed
  extension_solution_concept: none
  must_not_conflate:
  - 'H2_loc is a distinct regularity-axis value: C2 is contained in H2_loc elementarily,
    but H2_loc is not contained in C0 at the borderline Sobolev embedding s = n/2
    = 2 in four dimensions'
  - a distributional-vacuum C0 extension is a strictly weaker statement (fewer allowed
    extensions)
  - a C2-inextendibility result does not establish this class; containment runs in
    one direction only (see implication_ledger)
  - 'differentiability smuggled in through ''smooth coordinates'' or a ''regular boundary'':
    only g'' is continuous, though M'' is smooth'
  - WCC content (I+ completeness, visibility) must not appear as this class's conclusion
genericity:
  kind: residual_comeager
  ambient_space: X_vac(AF), the frozen smooth-with-decay one-ended AF vacuum data
    space, modulo asymptotically-identity diffeomorphisms
  topology_or_measure: Frechet topology of the smooth-with-decay class
  generic_set: '{ D in X_vac(AF) : D lies in G = countable intersection of open dense
    subsets }; complement meager'
  excluded_set: meager set containing, with status unresolved, the stationary/axisymmetric
    Kerr data (whose maximal development admits a C^infinity, hence C0, vacuum extension),
    plus self-similar and finite-dimensional analytic families; whether this union
    is meager is itself unresolved
  excluded_set_status: unresolved
  is_part_of_class: true
  class_change_warning: 'genericity is part of the class: ''for all data'' is strictly
    stronger and any other genericity notion yields a different class; neither may
    be substituted'
  extensions:
    open_dense_escape_definition: open_dense_escape means the GOOD set (the set on
      which the conclusion holds) is required to be nonempty open dense, with no comeager
      condition. This variant is strictly STRONGER than the class, because a nonempty
      open dense set U is itself a countable intersection of open dense sets (of one),
      hence is comeager, so any witness for the variant is a witness for the class.
  transfer_failures:
  - pair:
    - residual_comeager
    - full_measure
    direction: no_transfer
    witness: comeager sets can be Lebesgue-null
    status: standard_fact
    citation_status: unresolved
  - pair:
    - full_measure
    - residual_comeager
    direction: no_transfer
    witness: comeager null sets exist
    status: standard_fact
    citation_status: unresolved
  - pair:
    - residual_comeager
    - open_dense_escape
    direction: no_transfer
    witness: 'a comeager set need not be open: R minus Q is comeager and not open'
    status: elementary
  - pair:
    - open_dense_escape
    - residual_comeager
    direction: entails
    witness: 'a nonempty open dense set is comeager: it is a countable intersection
      of one open dense set, and its complement is closed with empty interior (nowhere
      dense)'
    status: elementary
  variants:
  - kind: open_dense_escape
    statement_strength: strictly_stronger
    is_this_class: false
    relation: implies residual_comeager by the corrected transfer row above
  - kind: full_measure
    statement_strength: incomparable
    is_this_class: false
  - kind: weighted Sobolev H^s_delta
    statement_strength: separate_data_class
    is_this_class: false
non_vacuity:
  condition: the class must be applied to data whose maximal development admits a
    future boundary that is not a regular (smoothly attachable) boundary; a development
    that is already future geodesically complete is expected to be inextendible but,
    in the C0 class, that expectation is not elementary because geodesic uniqueness
    for continuous metrics is unavailable.
  witness_type: one-parameter family in G whose development contains a future trapped
    surface and a Cauchy-horizon candidate; incompleteness of the development is the
    non-vacuity marker
  status: trapped-surface formation is standard; membership of the family in G is
    UNVERIFIED here
  vacuity_falsifier: if the class is cited for a development already shown C2-inextendible,
    the citation adds no information and must be marked subsumed, not as evidence
    for this class
  c0_specific_note: a C0-inextendibility proof subsumes the C2 sibling's conclusion,
    because the C2 extension class is strictly larger; the converse does not hold.
    Citing a C2-inextendibility result as evidence for this class is subsumed-citation
    deflation and must be labelled
i_plus:
  role: assumption
  in_conclusion: false
  completeness_in_conclusion: false
  definition: the AF structure at future null infinity serves only to define the data
    class and the maximal development; I+ appears nowhere in the conclusion
  forbidden:
  - asserting I+ completeness as part of this class conclusion
  - importing the WCC I+ predicate as this class's falsifier
visibility:
  role: not_in_conclusion
  reason: visibility from I+ is the WCC predicate. This SCC class asserts non-extendibility
    of the maximal development; a singularity can be invisible from I+ while the development
    is extendible, and conversely. The two axes are logically independent as stated
    here.
  visible_singularity_is_wcc: true
  forbidden_falsifier: a visible incomplete causal geodesic is a WCC falsifier; it
    is NOT a falsifier of this class
  derived_note: inextendibility concerns the boundary of the development, not causal
    relations to I+
conclusion:
  conclusion_type: scc_c0_future_inextendibility
  epistemic_status: open_problem
  family: SCC
  statement_natural_language: Generic asymptotically flat vacuum initial data (frozen
    smooth-with-decay class, no symmetry) have a maximal development that is future-inextendible
    as a continuous Lorentzian manifold.
  statement_formal: 'exists G subset X_vac(AF) comeager forall D in G: not exists
    proper_future_C0_metric_extension(MGHD(D))'
  equivalent_rephrasings:
  - phrasing: the maximal development is future-inextendible as a C0 Lorentzian manifold
    status: equivalent by definition of extension_predicate
  - phrasing: the metric cannot be continuously extended past the future boundary
      of the development
    status: informal; UNVERIFIED as an equivalence
  known_obstruction: exact stationary (Kerr) vacuum data admit a C-infinity vacuum
    extension, hence a C0 extension, so the unqualified statement over ALL AF vacuum
    data is false; the class is meaningful only with the genericity condition, and
    the extendible family must be shown meager. This statement uses only the elementary
    existence of the Kerr maximal analytic extension; the C0-inextendibility literature
    is NOT cited as established here and is delegated to L1.
  forbidden_strengthenings:
  - C2, C1, or H2_loc inextendibility (different classes on the regularity axis)
  - two-sided inextendibility (different, stronger statement)
  - the statement for ALL AF vacuum data (false if the Kerr obstruction is as stated)
  - I+ completeness or asymptotic predictability (WCC content)
  forbidden_weakenings:
  - dropping the generic quantifier in practice while keeping the word
  - substituting the distributional-vacuum variant for the bare-metric class
  - substituting H2_loc for C0
  - replacing future by two-sided direction
  - reintroducing a disjunctive data domain so that the artifact becomes a family
    of statements
  claim_promotion: epistemic_status=open_problem; a theorem requires artifact_refs
    with a checked proof
implication_ledger:
  one_way_entailments:
  - from: no proper future C0 metric extension
    to: no proper future C2 extension
    relation: entails
    reason: every C2 metric extension is a C0 metric extension
    status: elementary
  - from: no proper future C0 metric extension
    to: no proper future C0 distributional-vacuum extension
    relation: entails
    reason: extensions required to solve Ric = 0 distributionally are a subset of
      all continuous metric extensions
    status: elementary
  - from: no proper future C0 metric extension
    to: no proper future H2_loc extension
    relation: unresolved
    reason: C2 is contained in H2_loc elementarily, but H2_loc is NOT contained in
      C0 at the borderline Sobolev embedding s = n/2 = 2 in four dimensions; see regularity.must_not_conflate[0];
      one L1-verified lattice for {C0, H2_loc, C1, C2} is required
    status: unresolved
  forbidden_transfers:
  - from: no proper future C2 extension
    to: this class
    reason: the C2 extension class is strictly larger, so C2-inextendibility is strictly
      weaker than C0-inextendibility
  - from: no proper future H2_loc extension
    to: this class
    reason: H2_loc is a distinct value on the regularity axis and is not contained
      in this class's extension set in the needed direction
  - from: AF-WCC-VAC-GEN
    to: this class
    reason: visibility and inextendibility are logically independent as stated
  cross_family: no WCC <-> SCC transfer is licensed by this artifact
  subsumption_note: if this class is proved, the C2 sibling follows; recording the
    sibling as an independent achievement would double-count
  extensions:
    sibling_convention_note: 'this artifact freezes the bare-metric convention (frozen_equation_concept:
      none). The C2 sibling currently adopts the opposite convention (equations required
      of the extension). The C0 implies C2 entailment above is only valid once both
      artifacts use the same extension-class convention; the F2 integration artifact
      must reconcile the convention before the entailment is used (HF-06).'
falsifier:
  tier_1:
    refutes: AF-SCC-C0-VAC-GEN
    witness_type: a non-meager set of one-ended AF vacuum data (frozen smooth-with-decay
      class) whose maximal developments admit proper future C0 metric extensions,
      with each extension exhibited explicitly (smooth M', continuous nondegenerate
      g', isometric embedding, future points added)
    genericity_requirement: a single extendible data set refutes only the 'for all
      data' strengthening; tier 1 requires non-meagerness of the extendible set
    machine_checkable_steps:
    - constraint residuals below tolerance
    - g' continuous and nondegenerate on a neighbourhood of the boundary (sampled)
    - iota is an isometry onto an open proper subset
    - the added points lie to the future of iota(M)
    non_machine_checkable_step: non-meagerness of the extendible set
  tier_2:
    refutes: only the strictly stronger class 'for all AF vacuum data'
    witness_type: one AF vacuum data set (for example exact Kerr data) with an exhibited
      proper future C0 metric extension
    labelling_required: refutes_strengthening_only
  schema_falsifiers:
  - 'a statement bound to this class whose conclusion is really C2 or H2_loc inextendibility:
    class inflation'
  - 'a statement bound to this class whose falsifier is a visible singularity: wrong-family
    falsifier'
  - 'an H2_loc hypothesis present while the class claims bare C0: smuggled regularity'
  - 'the class cited for a development already shown C2-inextendible and presented
    as new evidence: subsumed citation'
anti_scope:
  not_this_class:
  - class_id: AF-SCC-C2-VAC-GEN
    why: different (weaker) statement; the containment C0 implies C2 runs one way
      only
  - class_id: AF-WCC-VAC-GEN
    why: visibility/predictability content, not extendibility
  - class_id: AF-WCC-SCALAR-SPH
    why: different matter and symmetry
  - class_id: AF-SCC-L2LOC-VAC-GEN (candidate)
    why: H2_loc is a separate regularity-axis value and must not be reported as C0
  - class_id: AF-SCC-C0-DISTRIBUTIONAL-VAC-GEN (candidate variant)
    why: the equation requirement is a frozen axis
  - class_id: weighted Sobolev H^s_delta data class (candidate variant)
    why: different data class after the HF-06 fix; not part of this statement
  phrases_that_are_not_this_class:
  - '''inextendible'' with no regularity token'
  - '''locally square-integrable curvature'' presented as C0'
  - '''the singularity is not visible'' (WCC phrasing)'
  extensions:
    composite_regularity_lint:
      rule_id: R13
      transcription: (C0|C2)\s*(or|and|/)\s*(C0|C2)
      exemption: this schema contains no occurrence of that pattern outside this lint
        block, which is tagged as an explicit forbidden-phrase quotation
      exempt_forbidden_phrase_quotation: true
provenance:
  citation_status: unverified
  sources:
  - concept: Choquet-Bruhat-Geroch maximal globally hyperbolic development
    identifier: null
    status: unresolved
    needed_for: regularity.solution_regularity
  - concept: positive mass theorem with completeness and decay hypotheses
    identifier: null
    status: unresolved
    needed_for: data_class.adm_mass
  - concept: I+ conformal regularity k >= 3 under the frozen decay class
    identifier: null
    status: unresolved
    needed_for: regularity.i_plus_regularity
  unresolved_citations:
  - whether the literature's C0-inextendibility results assume any curvature or solution
    structure on the extension
  - the claimed meagerness of the extendible family, including the Kerr family
  - the containment lattice for {C0, H2_loc, C1, C2} extension classes at the borderline
    Sobolev exponent
  - the source for the I+ regularity assumption k >= 3
  - the positive mass theorem locator under the declared hypotheses
  no_progress_claim: no assertion that this class is proved, refuted, or open; L1
    owns the ledger
  extensions:
    no_decisive_use_rule: no entry in this block is used to establish the class conclusion;
      candidate anchors may be promoted only by L1 binding exact definitions and hypotheses,
      after which this artifact must be revised
