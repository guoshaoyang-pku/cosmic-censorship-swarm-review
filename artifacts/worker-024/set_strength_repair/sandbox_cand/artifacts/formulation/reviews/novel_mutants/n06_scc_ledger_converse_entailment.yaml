schema_version: '1.0'
artifact_kind: class_schema
class_id: AF-SCC-C2-VAC-GEN
node_id: F2a
owner: lead-formulation
authored_by: astra-lead-formulation
authored_at: '2026-09-11T23:23:37+08:00'
timestamp_provenance: authored_at corrected to the filesystem mtime of this file; the first-pass value was ahead
  of wall clock (lead self-audit 2026-09-11T23:26+08:00)
revision: 1
supersedes: null
class_components:
  asymptotics: AF
  censorship: SCC
  matter: VAC
  genericity: GEN
  regularity_token: C2
class_contract_pointer: artifacts/formulation/formulation_taxonomy.yaml#class_contracts.AF-SCC-C2-VAC-GEN
sibling_disjoint_from: AF-SCC-C0-VAC-GEN
epistemic_status: open_problem
promotion_rule: may be recorded as a theorem only with a checked proof artifact and artifact_refs; a schema is never
  evidence for its own conclusion
scope_statement: 'The maximal globally hyperbolic development of generic asymptotically flat vacuum initial data
  (4-dimensional Einstein vacuum equations, Lambda = 0) admits no proper future extension that is a C2 Lorentzian
  solution of the vacuum equations. The class is about non-extendibility of the development; it makes no statement
  about what an observer at I+ sees.

  '
quantifiers:
  formal: 'forall (s,delta) in D0: exists G_{s,delta} subset X^{s,delta}_vac(AF) with G_{s,delta} comeager: forall
    (Sigma,h,K) in G_{s,delta}, letting (M,g) be the maximal globally hyperbolic development: not exists a proper
    future C2 vacuum extension (M'',g'',iota) of (M,g).'
  ordered:
  - kind: forall
    binder: (s,delta)
    domain_id: D0
  - kind: exists
    binder: G_{s,delta}
    domain_id: D1
  - kind: forall
    binder: (Sigma,h,K)
    domain_id: D2
  - kind: not_exists
    binder: (M',g',iota)
    domain_id: D3
  domains:
    D0:
      definition: 'admissible regularity pairs: Sobolev variant s > 5/2 and delta in (1/2,1), or the smooth-with-decay
        default'
      definition_ref: regularity.data_regularity
    D1:
      definition: comeager (residual) subsets of X^{s,delta}_vac(AF) in the named topology; complement meager
      definition_ref: genericity
    D2:
      definition: one-ended asymptotically flat vacuum initial data satisfying both constraint equations in the
        declared regularity class
      definition_ref: data_class
    D3:
      definition: proper future C2 vacuum extensions of the maximal development, in the exact sense of extension_predicate
      definition_ref: extension_predicate
  order_matters: true
  order_note: the comeager set is fixed independently of the data; the extension quantifier is a negated existential
    over extensions of the given development, not over data
  negation: there exists (s,delta) in D0 such that for every comeager G subset X^{s,delta}_vac(AF) there is (Sigma,h,K)
    in G whose maximal development admits a proper future C2 vacuum extension; equivalently the set of data admitting
    such an extension is non-meager.
  negation_normal_form: '{ (s,delta) in D0 : { D in X : exists proper future C2 vacuum extension of MGHD(D) } is
    non-meager } is non-empty'
  quantifier_class: forall-exists(comeager)-forall-not-exists(extension)
extension_predicate:
  name: proper_future_extension_in_class
  frozen_regularity: C2
  frozen_equation_concept: classical_ricci
  frozen_direction: future
  definition: 'A triple (M'', g'', iota) is a proper future C2 vacuum extension of (M,g) iff: (a) iota: M -> M''
    is an isometric embedding (iota_* g = g'' restricted to iota(M)); (b) iota(M) is an open, proper subset of M'';
    (c) M'' is connected and time-orientable, and its time orientation restricts to that of M; (d) g'' is a C2 Lorentzian
    metric (signature (-,+,+,+), nondegenerate) on M''; (e) Ric(g'') = 0 holds classically at every point of M''
    (g'' of class C2 makes Ric continuous, so this is a pointwise statement); (f) the extension adds points to the
    future: there exist q in iota(M) and p in M'' minus iota(M) with p in I^+(q; g'').'
  why_future_not_two_sided: one-ended AF data can be extendible to the PAST into a white-hole region without any
    failure of future determinism; two-sided inextendibility is a strictly stronger different statement and is registered
    as a variant, not folded into this class.
  must_not_conflate:
  - a bare metric extension with no equation requirement is not a counterexample here; the extension must satisfy
    Ric(g') = 0
  - global hyperbolicity of M' is NOT required; requiring it would be a strictly weaker different statement
  - the maximal development is maximal among globally hyperbolic developments; that is not the same as inextendible
    among all solutions, which is what this class asserts
  - the extension is not required to contain Sigma as a Cauchy surface or to be maximal in any sense
topology:
  spacetime_dimension: 4
  slice_topology: Sigma connected, oriented, complete Riemannian 3-manifold diffeomorphic to R^3 (exactly one asymptotically
    flat end)
  end_structure: one AF end
  completeness_of_slice: true
  conformal_boundary:
  - I+ (future null infinity)
  - I- (past null infinity)
  - i0 (spatial infinity)
  I_plus_topology: R x S^2
  development_topology: M globally hyperbolic, M diffeomorphic to Sigma x R, Sigma a Cauchy surface
  extension_topology: M' is a connected 4-manifold containing iota(M) as an open proper subset; M' is NOT assumed
    globally hyperbolic, compact, or AF
  forbidden:
  - closed or periodic spatial slice
  - more than one asymptotically flat end
  - assuming M' has any asymptotic structure (the extension may be non-AF; that is allowed)
  - assuming the Cauchy horizon has any smoothness or product structure
data_class:
  matter: none
  cosmological_constant: 0
  equations: Einstein vacuum equations Ric(g) = 0
  constraints:
    hamiltonian: R(h) - K_ij K^ij + (tr_h K)^2 = 0
    momentum: D^j (K_ij - (tr_h K) h_ij) = 0
  regularity_class:
    default: 'smooth-with-decay: h and K of class C^infinity with the numeric rates below'
    sobolev_variant:
      s: s > 5/2
      delta: delta in (1/2, 1)
      spaces: h - delta_ij in H^s_delta, K in H^{s-1}_{delta+1}
      status: standard_choice; UNVERIFIED citation
  asymptotic_decay:
    metric: h_ij - delta_ij = O(r^{-1}) and |d^k h| = O(r^{-1-k}) for 1 <= k <= s
    second_fundamental_form: K_ij = O(r^{-2}) and |d^k K| = O(r^{-2-k}) for 0 <= k <= s-1
    parity_conditions: not imposed
  adm_mass:
    exists: true
    sign: m_ADM >= 0 by the positive mass theorem
    citation_status: unresolved
  gauge: no gauge fixed on the data; all predicates are diffeomorphism invariant
  diffeo_quotient: genericity is defined on data modulo asymptotically-identity diffeomorphisms; the quotient construction
    is a declared open technical gap (see unresolved_items)
regularity:
  data_regularity: smooth-with-decay default, or H^s_delta with s > 5/2, delta in (1/2,1)
  solution_regularity: g of class C^infinity(M) for smooth data (H^s_loc for the Sobolev variant); maximal globally
    hyperbolic development exists and is unique up to isometry
  i_plus_regularity: gtilde extends to I+ with C^k regularity, k >= 3; k is part of the assumption
  extension_regularity: C2
  extension_regularity_exact: twice continuously differentiable metric; NOT C^{1,1}, NOT C1, NOT C0, NOT H2_loc,
    NOT smooth-only
  extension_solution_concept: classical_ricci
  must_not_conflate:
  - C-infinity extensions are also C2 extensions, so this class forbids them too; a class that forbade only smooth
    extensions would be different and weaker
  - C^{1,1} and H2_loc extension classes are NOT this class
  - 'a C0 result does not establish this class: it is stronger, and the implication runs C0 => C2 only (see implication_ledger)'
  - WCC content (I+ completeness, visibility) must not appear as the conclusion here
genericity:
  kind: residual_comeager
  ambient_space: X^{s,delta}_vac(AF), modulo asymptotically-identity diffeomorphisms
  topology_or_measure: norm topology of H^s_delta x H^{s-1}_{delta+1}; Frechet topology for the smooth class
  generic_set: G = countable intersection of open dense sets; complement meager
  excluded_set: meager; must contain (status unresolved) the stationary/axisymmetric Kerr data, whose maximal development
    DOES admit a C-infinity vacuum extension, plus self-similar and finite-dimensional analytic families
  excluded_set_status: unresolved
  is_part_of_class: true
  class_change_warning: 'genericity is part of the class: ''for all data'' is strictly stronger and ''open dense
    only'' strictly weaker; neither may be substituted'
  transfer_failures:
  - pair:
    - residual_comeager
    - full_measure
    direction: no_transfer
    witness: comeager sets can be Lebesgue-null
    status: standard_fact
    citation_status: unresolved
  - pair:
    - full_measure
    - residual_comeager
    direction: no_transfer
    witness: comeager null sets exist
    status: standard_fact
    citation_status: unresolved
  - pair:
    - open_dense_escape
    - residual_comeager
    direction: no_transfer
    witness: open dense does not imply comeager
    status: elementary
    citation_status: n/a
  variants:
  - kind: open_dense_escape
    statement_strength: strictly_weaker
    is_this_class: false
  - kind: none
    statement_strength: strictly_stronger
    is_this_class: false
non_vacuity:
  condition: the class must be applied to data whose maximal development is not future geodesically complete; for
    a future-complete development, a future extension is impossible already for elementary reasons (a maximal geodesic
    of the complete development cannot terminate at a boundary point of the extension), so the conclusion would
    be vacuous.
  witness_type: one-parameter family in G whose development contains a future trapped surface, hence is future geodesically
    incomplete
  status: trapped-surface formation is standard; membership of the family in G is UNVERIFIED here
  vacuity_falsifier: if the class is cited for data whose development is future geodesically complete, the citation
    is vacuous and must be rejected
  c2_specific_note: in the C2 class the vacuity argument is elementary because geodesics of a C2 metric are unique;
    see the C0 sibling for why the same argument is NOT automatic there
i_plus:
  role: assumption
  in_conclusion: false
  completeness_in_conclusion: false
  definition: AF structure at future null infinity is used only to define the data class and the notion of the maximal
    development; I+ appears nowhere in the conclusion of this class
  forbidden:
  - asserting I+ completeness as part of this class conclusion
  - importing the WCC I+ predicate as the falsifier of this class
visibility:
  role: not_in_conclusion
  reason: visibility from I+ is the WCC predicate. This SCC class asserts non-extendibility of the maximal development,
    which is a statement about the future boundary of the development, not about causal relations to future null
    infinity.
  visible_singularity_is_wcc: true
  forbidden_falsifier: a visible incomplete causal geodesic is a WCC falsifier; it is NOT the falsifier of this
    class
  derived_note: inextendibility of the development entails that no extension removes the boundary; that remark is
    not the class conclusion and may not be cited as one
conclusion:
  conclusion_type: scc_c2_future_inextendibility
  epistemic_status: open_problem
  family: SCC
  statement_natural_language: Generic asymptotically flat vacuum initial data have a maximal development that is
    future-inextendible as a C2 vacuum solution.
  statement_formal: 'forall (s,delta) in D0 exists G_{s,delta} comeager forall D in G_{s,delta}: not exists proper_future_extension_in_class(MGHD(D))'
  equivalent_rephrasings:
  - phrasing: the maximal development is future inextendible in the C2 class
    status: equivalent by definition of extension_predicate
  - phrasing: no Cauchy horizon of the development can be crossed by a C2 vacuum extension
    status: informal, UNVERIFIED as an equivalence
  known_obstruction: 'the exact stationary (Kerr) vacuum data admit a C-infinity vacuum extension, so the unqualified
    statement over ALL AF vacuum data is false; the class is only meaningful with the generic quantifier, and the
    excluded (extendible) family must be shown meager. Any use of this class must therefore keep ''generic'' in
    the statement. citation_status: unresolved (L1 owns the anchor).'
  forbidden_strengthenings:
  - C0 or C1 or H2_loc inextendibility (different classes)
  - two-sided inextendibility (different, stronger statement)
  - the statement for ALL AF vacuum data (false if the Kerr obstruction is as stated)
  - global hyperbolicity of the extension being required (a different, weaker statement)
  - I+ completeness or asymptotic predictability (WCC content)
  forbidden_weakenings:
  - dropping the generic quantifier in practice while keeping the word
  - requiring only inextendibility among globally hyperbolic extensions
  - replacing future by two-sided direction
  - allowing extensions that do not satisfy Ric = 0
  claim_promotion: epistemic_status=open_problem; theorem requires artifact_refs with a checked proof
implication_ledger:
  one_way_entailments:
  - from: no proper future C2 extension
    to: no proper future C0 extension
    relation: entails
    reason: 'R3 probe: the CONVERSE of the intended one-way statement'
    status: elementary
  forbidden_transfers:
  - from: no proper future C2 extension
    to: no proper future C0 extension
    reason: the converse containment is false
  - from: H2_loc-inextendibility
    to: this class
    reason: H2_loc is a distinct value on the regularity axis
  - from: AF-WCC-VAC-GEN
    to: this class
    reason: visibility and inextendibility are logically independent as stated; no transfer may be assumed
  cross_family: no WCC <-> SCC transfer is licensed by this artifact
falsifier:
  tier_1:
    refutes: AF-SCC-C2-VAC-GEN
    witness_type: an open (or at least non-meager) set of one-ended AF vacuum data whose maximal developments admit
      proper future C2 vacuum extensions, with the extension exhibited (an explicit family, not a numerical near-solution)
    genericity_requirement: one extendible data set refutes only the 'for all data' strengthening; tier 1 requires
      the extendible set to be shown non-meager
    machine_checkable_steps:
    - constraint residuals below tolerance
    - the extension's metric is C2 across the boundary and Ric = 0 holds at sample points
    - the extension map iota is an isometry onto an open proper subset
    - the added points lie in the future of iota(M)
    non_machine_checkable_step: non-meagerness of the extendible set
  tier_2:
    refutes: only the strictly stronger class 'forall AF vacuum data'
    witness_type: one AF vacuum data set (e.g. exact Kerr data) with an exhibited proper future C2 vacuum extension
    labelling_required: refutes_strengthening_only
  schema_falsifiers:
  - 'a statement is bound to this class whose conclusion is really C0 or H2_loc inextendibility: conclusion inflation'
  - 'a statement is bound to this class whose falsifier is a visible singularity: wrong-family falsifier'
  - 'the class is cited for a future-complete development: vacuous citation'
  - 'the extension is not required to solve Ric = 0: weaker statement bound to the wrong class'
anti_scope:
  not_this_class:
  - class_id: AF-SCC-C0-VAC-GEN
    why: different (stronger) extension class; the word 'inextendible' alone does not identify either class
  - class_id: AF-WCC-VAC-GEN
    why: visibility/predictability content, not extendibility
  - class_id: AF-WCC-SCALAR-SPH
    why: different matter and symmetry
  - class_id: AF-SCC-L2LOC-VAC-GEN (candidate)
    why: H2_loc extension class is separate
  - class_id: AF-SCC-C2-TWOSIDED-VAC-GEN (candidate variant)
    why: extension direction is a frozen axis
  phrases_that_are_not_this_class:
  - any 'C0 or C2' composite regularity
  - '''inextendible'' with no regularity token'
  - '''the singularity is not visible'' (WCC phrasing)'
provenance:
  citation_status: unverified
  sources:
  - concept: Choquet-Bruhat-Geroch maximal globally hyperbolic development
    identifier: null
    status: unresolved
    needed_for: regularity
  - concept: statement and known obstruction of the C2 formulation of strong cosmic censorship for AF vacuum data
    identifier: null
    status: unresolved
    needed_for: conclusion, known_obstruction
  - concept: Kerr family and its maximal analytic extension as a counterexample to the unqualified statement
    identifier: null
    status: unresolved
    needed_for: known_obstruction, genericity.excluded_set
  unresolved_citations:
  - the claimed meagerness of the extendible family
  - the equivalence of the informal 'Cauchy horizon cannot be crossed' phrasing
  no_status_claim: no assertion that this class is proved, refuted, or open; L1 owns the ledger
unresolved_items:
- diffeomorphism-quotient construction for genericity
- meagerness of the excluded families
- non-vacuity witness membership in G
- the exact regularity of vacuum extensions across a Cauchy horizon in the nonlinear setting
