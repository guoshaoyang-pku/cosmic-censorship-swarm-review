class_components:
  tokens: ["AF", "WCC", "VAC", "GEN"]
  token_gloss:
    AF: "asymptotically flat (one end; conformal completion with I+, I-, i0)"
    WCC: "weak cosmic censorship conclusion family; contributes no regularity token"
    VAC: "vacuum matter model"
    GEN: "generic-data clause, owned by this schema"
  family: WCC
  matter_model: vacuum
  symmetry: none_assumed
  genericity: generic
  asymptotics: asymptotically_flat_3p1
  regularity_token: null
  regularity_token_count: 0
  family_regularity_rule: "WCC implies regularity_token is null; SCC implies exactly one token"
  decomposition_source: "research_map/formulation_taxonomy.yaml#a82f249c (F0), class axes"

class_axes:
  family: WCC
  matter_model: vacuum
  symmetry: none_assumed
  asymptotics: asymptotically_flat_3p1
  regularity_token: null
  genericity_kind: baire_residual
  genericity_topology: named_by_F1
  conclusion_type: weak_cosmic_censorship

vocabulary_alignment:
  note: >-
    The F0 slot vocabulary uses `conclusion_type` for the conclusion family of a class,
    while the map and claim-event vocabulary uses `conclusion_type` for the epistemic
    type of a statement. Revision 3 records both, in different keys, and never merges
    them: conclusion.conclusion_type is the family value from the spec vocabulary, while
    conclusion.epistemic_status (alias conclusion.type) is the epistemic value.
  f0_slot_conclusion_type: weak_cosmic_censorship
  epistemic_conclusion_type: open_problem
  asserted_epistemic_type_if_proved: theorem

quantifiers:
  ordered:
    - kind: forall
      binder: "(Sigma, h, K)"
      domain: "D_gen, the generic (residual-comeagre) subset of the weighted data space D_w"
      domain_id: D_GEN
    - kind: exists
      binder: "(M_tilde, g_tilde, Omega)"
      domain: "conformal completions of the maximal globally hyperbolic development (M, g) of the data"
      domain_id: COMPLETIONS
    - kind: not_exists
      binder: "p"
      domain: "future boundary points of M that are not on I+ and lie in the past J^-(I+) of I+"
      domain_id: VISIBLE_SINGULAR
  formal: "for every (Sigma, h, K) in D_GEN there exists (M_tilde, g_tilde, Omega) in COMPLETIONS such that there does not exist p in VISIBLE_SINGULAR"
  domains:
    D_GEN:
      definition: "the set of vacuum initial data (Sigma, h, K) in D_w that lie in the residual set defined in genericity.generic_set"
      definition_ref: "genericity.generic_set; F0 hypothesis H4"
      non_vagueness: "defined by the H^4_{1/2+epsilon} norm and the Baire formula; no qualitative qualifier"
    COMPLETIONS:
      definition: "pairs ((M_tilde, g_tilde), Omega) with g_tilde = Omega^2 g on M, Omega > 0 on M, and Omega = 0 with dOmega nonzero on the future boundary I+"
      definition_ref: "i_plus.defining_properties"
      non_vagueness: "conformal factor conditions are stated as equations"
    VISIBLE_SINGULAR:
      definition: "future boundary points p of the maximal development with p not on I+ and p in the past J^-(I+)"
      definition_ref: "visibility.definition"
      non_vagueness: "membership is the causal relation p in J^-(I+)"
  order_notes:
    - "the forall over data precedes the exists over completions; swapping them would change the statement"
    - "genericity restricts the forall domain only; it is not an existential witness"
  quantifier_order_status: pinned

premise:
  field_equations: "Ric(g) = 0 on M (vacuum Einstein equations with zero cosmological constant)"
  development: "(M, g) is the maximal globally hyperbolic development of the initial data"
  maximality_meaning: "no isometric embedding of (M, g) into a strictly larger globally hyperbolic vacuum spacetime that preserves the data"
  future_boundary: "partial_sing(M) is the set of future boundary points of M in the conformal completion (M_tilde, g_tilde) whose existence the conclusion asserts; points lying on I+ are excluded from VISIBLE_SINGULAR"
  future_boundary_class_decision: "F1 decision: visibility is stated with respect to the conformal boundary of the asserted completion; the causal-boundary construction is recorded as an alternative in residuals"
  residuals: ["if no completion exists for a datum, the existential fails and that datum is a counterexample family member rather than a gap in the boundary convention; equivalence with the causal-boundary reading is unverified"]

topology:
  spacetime_dimension: 4
  manifold: "4-dimensional, connected, oriented, time-oriented, smooth Lorentzian manifold (M, g), globally hyperbolic"
  slice_topology: "Sigma connected, complete, oriented, one-ended and asymptotically flat; not restricted to R^3, which is the canonical instance"
  slice_topology_class_decision: "F1 decision: any connected complete one-ended asymptotically flat slice is admitted; Sigma diffeomorphic to R^3 is the canonical instance"
  residuals: ["whether additional asymptotic ends could be admitted is outside this class; admitting them would define a different class"]
  conformal_boundary:
    I_plus: "future null infinity; topology R x S^2"
    I_minus: "past null infinity; topology R x S^2"
    i0: "spatial infinity; a single point"
  forbidden:
    - "closed (compact without boundary) initial slices"
    - "periodic initial slices"
    - "more than one asymptotically flat end"
    - "nonzero cosmological constant asymptotics"
  symmetry: none_assumed
  status: pinned

data_class:
  object: "initial data set (Sigma, h, K): a Riemannian 3-metric h and a symmetric 2-tensor K on Sigma"
  matter: "none (vacuum): the metric solves Ric(g) = 0 and T_{mu nu} = 0"
  cosmological_constant: 0
  constraints:
    hamiltonian: "R(h) - K_ij K^ij + (tr_h K)^2 = 0"
    momentum: "div_h K - d(tr_h K) = 0"
  regularity: "h in H^4_loc(Sigma) and K in H^3_loc(Sigma), which implies a C^2 development; smooth C^infinity data are the canonical sub-case"
  asymptotic_decay:
    metric_minus_euclidean:
      order_0: "O(r^-1)"
      order_k: "O(r^{-1-k}) per derivative order k"
    extrinsic_curvature:
      order_0: "O(r^-2)"
      order_k: "O(r^{-2-k}) per derivative order k"
    rule: "one extra power of r per derivative"
  adm_mass_status: "finite ADM 4-momentum (E, P), causal (E at least |P|); D_w admits all such data; D_gen excludes the Minkowski point E = 0 and imposes no strict positivity bound beyond that"
  adm_mass_class_decision: "F1 decision: no strict lower bound E > 0 is imposed; the generic set excludes only the Minkowski point E = 0"
  sobolev_index:
    s: 4
    status: proposed_by_F1_unreviewed
    alternatives: ["Bartnik H^2_delta", "Christodoulou-Klainerman strong asymptotic flatness (weighted C^k decay with peeling)"]
  weight:
    delta: "1/2 + epsilon, with epsilon > 0 fixed once and for all"
    status: proposed_by_F1_unreviewed
  weighted_norm: "D_w is the completion of smooth asymptotically flat vacuum data in ||(h - delta, K)||_{H^4_{1/2+epsilon}} with weight (1 + r^2)^{delta/2}"
  status: partial
  unresolved_refs: ["unresolved[data_class.weighted_norm]"]

regularity:
  data_regularity: "h in H^4_loc, K in H^3_loc (see data_class.regularity)"
  solution_regularity: "C^2 Lorentzian metric on the maximal globally hyperbolic development; smooth is the canonical sub-case"
  i_plus_regularity: "I+ is a null hypersurface of the conformal completion with Omega = 0 and dOmega nonzero"
  extension_regularity: null
  extension_solution_concept: "not asserted; this class makes no statement about continued spacetimes beyond a horizon"
  extension_regularity_absence_reason: "WCC carries no regularity token; the slot is present and null so a checker distinguishes absent-by-rule from forgotten"
  must_not_conflate:
    - "data regularity (H^4_loc / H^3_loc) is not solution regularity"
    - "solution regularity (C^2) is not a statement about continued spacetimes"
    - "completeness of I+ is not a statement about continued spacetimes"
    - "the regularity of the development is not a conclusion of the class"

genericity:
  kind: residual_comeager
  kind_proposal_status: proposed_by_F1_unreviewed
  ambient_space: "D_w, the completion of smooth asymptotically flat vacuum data (Sigma, h, K) in the weighted Sobolev norm ||(h - delta, K)||_{H^4_{1/2+epsilon}}"
  topology_or_measure: "the norm topology of H^4_{1/2+epsilon} on D_w; the Frechet topology of weighted C^infinity decay is the recorded alternative"
  generic_set: "D_gen = intersection over n >= 1 of U_n, where each U_n is open and dense in (D_w, ||.||_{H^4_{1/2+epsilon}}); D_gen is residual (comeagre)"
  excluded_set: "E_gen = D_w minus D_gen, meagre; candidate members recorded, not asserted: self-similar data of the Rodnianski-Shlapentokh-Rothman type; fine-tuned threshold data of type-II critical collapse"
  transfer_failures:
    - notion: full_measure
      why_transfer_fails: "no canonical Gaussian measure on D_w is fixed by any verified source; full measure is not equivalent to residual"
    - notion: finite_codimension_complement
      why_transfer_fails: "no verified theorem computes the codimension of E_gen; a codimension statement neither implies nor is implied by residuality without further hypotheses"
    - notion: open_dense_escape
      why_transfer_fails: "an open dense set can have dense complement; the escape reading weakens the conjecture and defines a different class"
  is_part_of_class: true
  is_part_of_class_statement: "the GEN token of the class id names this clause; changing genericity.kind or the ambient topology yields a different class with a different conclusion strength"
  failed_transfer_semantics: "conclusions do not transfer between classes that differ in genericity.kind or topology_or_measure"
  residuals:
    - "no verified theorem establishes that the RSR self-similar data are meagre in H^4_{1/2+epsilon}"
    - "the measure-theoretic reading would require a Gaussian measure that no verified source fixes"
  genericity_status: proposed_pending_A1
  load_bearing: true

non_vacuity:
  condition: "there exists at least one data set in D_gen whose maximal development is future-incomplete with a non-empty black-hole region; equivalently, the class is not exhausted by data with complete developments such as Minkowski data"
  witness_type: "existence witness: a generic (residual-set) collapsing family with a future-incomplete development; the known constructed families (short-pulse and critical-collapse data) are not verified to lie in D_gen"
  witness_status: unresolved
  note: "R08: until a witness is filed, the class conclusion must not be called non-trivial"

matter: "none (vacuum): Ric(g) = 0 and T_{mu nu} = 0"

i_plus:
  role: conclusion
  in_conclusion: true
  name: "future null infinity I+ (scri+): the future boundary of a conformal completion (M_tilde, g_tilde, Omega) with g_tilde = Omega^2 g"
  completeness_definition: "every null geodesic generator of I+ is complete to the future; equivalently every future-directed causal curve reaching I+ is complete to the past"
  defining_properties:
    - "Omega > 0 on M, Omega = 0 on I+, and dOmega nonzero along I+"
    - "I+ is a null hypersurface with topology R x S^2"
    - "existence of the completion is part of the conclusion, not an assumption on the data"
  equivalent_forms:
    - "asymptotic predictability: every future-directed causal curve that reaches I+ is complete to the past"
    - "hiding: every singular boundary point is hidden behind an event horizon"
  equivalence_status: unverified

visibility:
  role: conclusion
  predicate: "VisibleFromIplus(p)"
  definition: "for a future boundary point p of the maximal development, VisibleFromIplus(p) holds iff p lies in the past J^-(I+) of I+; equivalently there is a future-directed causal curve in M whose past accumulates on p and whose future reaches I+"
  curve_class: "F1 class decision: geodesic completeness, aligned with the F0 conclusion (every future-directed causal geodesic contained in J^-(I+) is complete); equivalence with the causal-curve variant is unverified and recorded in conclusion.equivalence_claim"
  curve_class_proposal_status: pinned_by_F1_pending_A1
  set_vs_point: "single-point visibility is the class definition; the set-valued variant (an open set of boundary points visible) is strictly stronger and would define a different class"
  negation_conclusion: "not exists p in partial_sing(M) such that VisibleFromIplus(p)"
  status: pinned_by_F1_pending_A1

conclusion:
  conclusion_type: weak_cosmic_censorship
  epistemic_status: open_problem
  type: open_problem
  asserted_epistemic_type_if_proved: theorem
  family: weak_cosmic_censorship
  class_object: AF-WCC-VAC-GEN
  statement: >-
    For every asymptotically flat vacuum initial data set in the generic subset D_gen
    of the weighted data space, the maximal globally hyperbolic development admits a
    conformal completion whose future null infinity I+ is complete, and no singular
    boundary point of the development lies in the past of I+; equivalently, every
    future-directed causal curve that reaches I+ is complete to the past.
  equivalence_claim:
    claimed_equivalences:
      - "statement is equivalent to the asymptotic-predictability form in i_plus.equivalent_forms"
      - "statement is intended to be equivalent to the F0 geodesic-completeness form recorded in variants[tag=f0_equivalent_form]"
    status: unverified
    what_would_verify: "a proof of equivalence, or an A1 ruling that one form is canonical; the F0 form is kept in `variants` because the candidate class-binding linter treats its regularity word as a foreign-family token"
  forbidden_strengthenings:
    - "upgrading epistemic_status to theorem without artifact_refs and a reviewer verdict"
    - "asserting any regularity statement about the region behind an event horizon (different conclusion family; see class_separation)"
    - "asserting existence of the completion as an assumption rather than a conclusion"
    - "asserting stability, decay rates, or black-hole formation for specific data families"

class_separation:
  this_document_class: AF-WCC-VAC-GEN
  frozen_class_ids:
    - AF-WCC-VAC-GEN
    - AF-SCC-C2-VAC-GEN
    - AF-SCC-C0-VAC-GEN
    - AF-WCC-SCALAR-SPH
  conclusion_family: weak_cosmic_censorship
  visibility_is_a_conclusion_here: true
  prohibitions:
    - "do not merge this class id with any other frozen class id"
    - "do not import extension-regularity conclusions from the strong-censorship classes"
    - "do not import scalar-field or spherical-symmetry hypotheses; this class is vacuum and symmetry-free"
    - "do not write a composite regularity token in any conclusion or quantifier field"

variants:
  - tag: f0_equivalent_form
    text: "every future-inextendible causal geodesic contained in J^-(I+) is complete"
    source: "research_map/formulation_taxonomy.yaml#a82f249c (F0 WCC conclusion)"
    exemption: "R12 foreign-token exemption: this block is outside the leakage_scan_blocks (conclusion, visibility, i_plus, falsifier) and is tagged"
    equivalence_status: unverified

falsifier:
  tier_1:
    statement: "an open set, in the declared topology on D_w, of data in D_gen whose maximal development has a future boundary point visible from I+"
    robustness_requirement: "the witness must be robust: it must hold on an open (or at least residual) set of data, not on a single fine-tuned member"
    family_witness_type: "visible incomplete causal geodesic"
    refutes: "the class as stated"
  tier_2:
    statement: "a counterexample to a strengthening only, such as a claimed decay rate, a norm-specific bound, or a specific data family; labelled tier 2 and not a refutation of the class"
    refutes: "a strengthening, not the class"
  witness_type: "visible incomplete causal geodesic; none constructed in this draft"
  machine_checkable_steps:
    - "parse the witness data (Sigma, h, K) and check the vacuum constraint equations"
    - "check membership in D_gen, in particular the genericity clause"
    - "verify that the maximal development is future-incomplete"
    - "exhibit a causal geodesic contained in J^-(I+) that is incomplete"
  nearest_known_witness: "Rodnianski-Shlapentokh-Rothman self-similar vacuum naked-singularity exterior (arXiv:1912.08478); membership of its data in D_gen is not established, so it is currently a witness for the non-generic statement only"
  schema_level: "a field of this schema that two competent readers can instantiate into non-equivalent formal statements; the ambiguity test is independent reconstruction by two A1 reviewers"
  what_would_falsify_this_revision: "A1 review finding that quantifiers.ordered, visibility.definition or regularity.data_regularity admits two non-equivalent readings, that the proposed (s, delta) or genericity topology is incompatible with the F0 axes, or that the equivalence claim in conclusion is false"

