  topology: {field: topology, status: pinned, note: "any connected complete one-ended asymptotically flat slice; Sigma = R^3 is the canonical instance (F1 class decision)"}
  weighted_data_class: {field: data_class, status: proposed_pending_A1, note: "(s, delta) named as an F1 proposal with alternatives"}
  genericity: {field: genericity, status: proposed_pending_A1, note: "kind, ambient space, topology/measure, generic and excluded sets, transfer failures all present"}
  i_plus: {field: i_plus, status: pinned, note: "role=conclusion, in_conclusion=true, completeness definition present"}
  visibility: {field: visibility, status: pinned_by_F1_pending_A1, note: "geodesic completeness and single-point visibility are class decisions; equivalence with the causal-curve variant is unverified"}
  conclusion_type: {field: conclusion, status: pinned, value: "conclusion_type=weak_cosmic_censorship; epistemic_status=open_problem"}

adjudication_queue:
  note: >-
    Output of the flash-04 ambiguity suite (16 probes, run against this revision):
    contract leaves 42/42 present, 15 rows determinate, 1 row open (F1-AMB-15) because
    the equivalence of forms is unverified. Ten rows are expectation mismatches: the
    suite was authored before this schema existed and marked them ambiguous, while this
    revision decides them through an explicit class choice. Determinacy here means the
    schema commits to a reading, not that the physics is settled. A1 must adjudicate each
    commitment below.
  items:
    - test: F1-AMB-01
      probe: "Minkowski data and the non-vacuity of the class"
      schema_decision: "Minkowski data are in D_w but excluded from D_gen by E = 0; the class is non-vacuous only if a witness is filed (non_vacuity.witness_status unresolved)"
      deciding_leaf: non_vacuity.condition
      review_question: "is excluding exactly E = 0 the right generic-set boundary?"
    - test: F1-AMB-02
      probe: "fine-tuned critical-collapse data"
      schema_decision: "membership in D_gen follows from genericity.generic_set; no theorem is claimed about this family"
      deciding_leaf: genericity.generic_set
      review_question: "does the residual-set definition actually exclude fine-tuned critical families, or is that a theorem still to be proved?"
    - test: F1-AMB-04
      probe: "negative ADM mass data with a visible singularity"
      schema_decision: "outside D_w: adm_mass_status requires causal (E at least |P|)"
      deciding_leaf: data_class.adm_mass_status
      review_question: "is the causal-energy restriction part of the class or an extra hypothesis?"
    - test: F1-AMB-07
      probe: "spherically symmetric Schwarzschild-type data"
      schema_decision: "admitted: symmetry is not assumed but also not forbidden; genericity is the only restriction"
      deciding_leaf: topology.symmetry
      review_question: "does 'no symmetry assumed' admit symmetric data, or should the generic set exclude them?"
    - test: F1-AMB-08
      probe: "one-ended exotic slice topology (punctured lens space)"
      schema_decision: "admitted: the class admits any connected complete one-ended asymptotically flat slice, not only R^3"
      deciding_leaf: topology.slice_topology
      review_question: "should the class be restricted to R^3, making the conjecture weaker but cleaner?"
    - test: F1-AMB-09
      probe: "codimension-one non-generic family foliating an open set"
      schema_decision: "outside D_gen: a codimension-one family is meagre, and D_gen is residual"
      deciding_leaf: genericity.generic_set
      review_question: "is meagreness enough, or is a codimension count needed?"
    - test: F1-AMB-10
      probe: "comeagre in one topology, null for every Gaussian measure"
      schema_decision: "the class fixes residual_comeager in the H^4_{1/2+epsilon} norm topology; measure-theoretic readings do not transfer"
      deciding_leaf: genericity.topology_or_measure
      review_question: "which topology is the canonical one; should the class instead fix a measure?"
    - test: F1-AMB-11
      probe: "bad point reachable by unbounded-acceleration causal curve but by no incomplete geodesic"
      schema_decision: "satisfies the class conclusion: visibility and completeness are read geodesically, following F0"
      deciding_leaf: visibility.definition
      review_question: "geodesic-only or causal-curve visibility? this choice changes the conjecture's strength"
    - test: F1-AMB-13
      probe: "data below the MGHD uniqueness threshold"
      schema_decision: "outside D_w: h in H^4_loc and K in H^3_loc are required"
      deciding_leaf: data_class.regularity
      review_question: "is the H^4/H^3 threshold the right one, or should lower-regularity data define a separate class?"
    - test: F1-AMB-16
      probe: "schema-level conclusion_type probe"
      schema_decision: "conclusion.conclusion_type is weak_cosmic_censorship and epistemic_status is open_problem, per the rule-spec vocabularies"
      deciding_leaf: conclusion.conclusion_type
      review_question: "contract-compliance probe: determinacy is the intended outcome; confirm the dual-key convention"
  open_row:
    - test: F1-AMB-15
      probe: "equivalence of the statement forms"
      schema_decision: "conclusion.equivalence_claim.status is unverified; i_plus.equivalence_status is unverified"
      review_question: "which form is canonical; the F0 phrasing sits in variants[tag=f0_equivalent_form]"

