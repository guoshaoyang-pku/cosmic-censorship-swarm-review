    - ref: "arXiv:1702.05715 and arXiv:1702.05716 (Luk-Oh)"
      reason: "Einstein-Maxwell-scalar in spherical symmetry; strong-censorship family, not vacuum weak censorship"
    - ref: "arXiv:1710.01722 (Dafermos-Luk)"
      reason: "horizon-interior stability statement; must not be imported into the weak-censorship conclusion"

