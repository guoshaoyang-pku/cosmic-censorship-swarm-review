  - conclusion_type
  pair:
  - AF-SCC-C0-VAC-GEN
  - AF-WCC-SCALAR-SPH
  separation: Conclusion family, matter model and symmetry all differ.
disjointness_overlap_note: 'Data sets may satisfy the hypotheses of more than one
  descriptor: for example Schwarzschild vacuum data also solve the Einstein-massless-scalar-field
  system with phi = 0 (review HF-04). What is exclusive is the class binding of a
  CLAIM, and a checker must not read this table as data-space disjointness. The decisive
  axes below separate descriptors, not solution sets.'
disjointness_scope: class descriptors (axis vectors), not data-space disjointness
field_vocabulary:
  asymptotics:
    allowed:
    - asymptotically_flat_3p1
    meaning: 3+1 dimensional, one asymptotically flat end, conformal completion with
      I+, I-, i0 and a complete I+ unless the class states otherwise.
  conclusion_type:
    allowed:
    - weak_cosmic_censorship
    - strong_cosmic_censorship_C2
    - strong_cosmic_censorship_C0
    rule: one class -> exactly one conclusion_type; strong_cosmic_censorship_C2 and
      _C0 are distinct values and must never be merged into a single regularity token
      (guards G3).
  family:
    allowed:
    - WCC
    - SCC
    meaning: WCC = visibility/asymptotic-predictability conclusion; SCC = inextendibility
      conclusion.
  genericity_kind:
    allowed:
    - baire_residual
    - dense_open
    - measure_one
    - provisional_baire_residual
    - unresolved
    rule: a generic-quantified claim must name genericity_kind AND genericity_topology;
      'generic' alone is not a machine-readable value. 'provisional_*' tokens are
      placeholders owned by F1/F2 and must not be read as frozen values.
  genericity_topology:
    allowed:
    - unresolved
    - named_by_F1
    - named_by_F2
    rule: the topology or measure space in which genericity is defined; must be named
      before any theorem-status claim.
  matter_model:
    allowed:
    - vacuum
    - massless_scalar_field
    meaning: vacuum = Ricci-flat, T=0, Lambda=0; massless_scalar_field = Einstein-massless-scalar-field
      system.
  regularity_token:
    allowed:
    - C2
    - C0
    - null
    meaning_C0: forbidden extensions are C0 (continuous-metric) Lorentzian extensions;
      strictly stronger than the C2 conclusion when the data class and genericity
      notion are identical.
    meaning_C2: 'forbidden extensions are C2 Lorentzian extensions solving the field
      equations, and a fortiori every smoother class contained in C2 (C^k for k>=2,
      C^infinity, analytic). It does NOT forbid C^{1,1} or H^2_loc extensions: those
      are strictly larger classes, so excluding C2 does not exclude them (review HF-02).
      A statement that also forbids them is stronger and must be classified explicitly.'
    rule: exactly one token iff family == SCC; null (absent) iff family == WCC.
  symmetry:
    allowed:
    - none_assumed
    - spherical
    meaning: spherical = SO(3) isometry with 2-sphere orbits and a regular center
      (symmetry-reduced data space).
gate: G-F0
guards:
- id: G1
  rule: each claim carries exactly one class_id from class_ids
- id: G2
  rule: family == SCC implies exactly one regularity_token in {C0, C2}; family ==
    WCC implies regularity_token is absent/null
- id: G3
  rule: no merged regularity string matches the normalized pattern. Normalize before
    matching by removing the characters ^ { } _ and whitespace, so that braced/superscript
    spellings such as C^{{0}} or C^{{2}} are caught, not only the plain spelling (review
    finding 6). The full regex lives in artifacts/worker-01/validate_taxonomy.py (MERGED_REGULARITY_RE
    + normalization) and must be copied by downstream linters, not re-derived.
- id: G4
  rule: 'no symmetry release: a spherical-symmetry result may not be filed under a
    none_assumed class'
- id: G5
  rule: 'no matter-model swap: vacuum <-> massless_scalar_field without a bridge artifact'
- id: G6
  rule: 'no conclusion inflation: C2 result may not be filed as C0; WCC may not be
    filed as SCC'
- id: G7
  rule: conclusion_type == theorem requires artifact_refs with sha256 and a reviewer
    verdict (comms/PROTOCOL.md rule 2)
