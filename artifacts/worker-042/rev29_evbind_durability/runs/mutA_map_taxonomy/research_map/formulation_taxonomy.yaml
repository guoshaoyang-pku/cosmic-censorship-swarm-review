  - symmetry
  pair:
  - AF-WCC-VAC-GEN
  - AF-WCC-SCALAR-SPH
  separation: Vacuum versus massless scalar field, and no symmetry assumption versus
    spherical symmetry; the data spaces differ, so neither hypotheses nor conclusions
    transfer.
- decisive_axes:
  - regularity_token
  - conclusion_type
  pair:
  - AF-SCC-C2-VAC-GEN
  - AF-SCC-C0-VAC-GEN
  separation: C0-inextendibility implies C2-inextendibility for identical data and
    genericity, but not conversely; the conclusions are distinct values and may never
    be merged into a single regularity token (guards G3).
- decisive_axes:
  - family
  - matter_model
  - symmetry
  - conclusion_type
  pair:
  - AF-SCC-C2-VAC-GEN
  - AF-WCC-SCALAR-SPH
  separation: Conclusion family, matter model and symmetry all differ.
