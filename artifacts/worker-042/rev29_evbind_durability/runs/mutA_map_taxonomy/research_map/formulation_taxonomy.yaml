  and no literature claim as established. Every literature pointer is marked unresolved
  pending ledger L0/L1. Field values marked provisional are owned by the downstream
  schema nodes (F1 for AF-WCC-VAC-GEN, F2 for the two AF-SCC classes) and must be
  replaced, not inherited silently.
