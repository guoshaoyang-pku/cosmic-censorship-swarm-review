schema_version: '0.1'
class_id: AF-SCC-C2-VAC-GEN
title: 'Strong cosmic censorship, C^2 class: asymptotically flat vacuum, generic data'
matter_model: vacuum
quantifiers:
  for_all: for all initial data sets (Sigma, g, K) in the weighted class below satisfying
    the vacuum constraints, outside the exceptional set
  there_exists: there exists a maximal globally hyperbolic development (M, g) with
    future null infinity I+ attached
  counterexample_form: there exists an admissible datum whose maximal development
    has a singularity visible from I+, i.e. a causal curve from the singular boundary
    reaches I+
  order: for_all data; NOT (there_exists a visible singularity)
topology:
  manifold: 3+1 dimensional manifold with Cauchy surface Sigma diffeomorphic to R^3
    minus a compact set; one asymptotically flat end
  asymptotically_flat: true
  i_plus: future null infinity I+ of the conformal completion, taken complete and
    with standard spherical topology
  end_count: 1
data_class:
  space: weighted Sobolev space H^s_{-delta} with s > 3/2 and delta in (1/2, 1)
  weights: -delta, delta in (1/2, 1)
  decay: g - delta_euclidean in H^s_{-delta}; K in H^{s-1}_{-delta-1/2}
regularity_of_solution: C^2 (twice continuously differentiable) vacuum development
  of the data
constraints: 'vacuum Einstein constraint equations hold on every datum: scalar constraint
  and momentum constraint'
genericity:
  measure_or_topology: open dense subset in the weighted H^s_{-delta} topology; complement
    is meagre (Baire-generic)
  statement: the inextendibility conclusion holds for all data outside a meagre exceptional
    set
visibility:
  definition: a Cauchy horizon point is visible from I+ if a future-directed causal
    curve from it reaches I+; SCC does not require the violation to be visible
  cauchy_horizon: future Cauchy horizon CH+(Sigma) of the maximal development, beyond
    which extendibility is tested
conclusion:
  type: conditional_theorem
  statement: for generic admissible vacuum data, the maximal development is C^2-inextendible
    beyond the Cauchy horizon
  inextendibility_regularity: C2
  negation: there exist generic admissible data whose maximal development admits a
    C^2 extension beyond the Cauchy horizon
falsifier:
  witness_type: an explicit admissible datum in the weighted class whose maximal development
    admits a C^2 extension beyond the Cauchy horizon while meeting the genericity
    condition
  check: construct the maximal development, exhibit the extension across the Cauchy
    horizon and verify its differentiability class
source_refs:
- 'Penrose 1969, Gravitational collapse: the role of general relativity'
- Christodoulou 1999, The instability of naked singularities in the gravitational
  collapse of a scalar field
related_classes:
- class_id: AF-WCC-VAC-GEN
  relation: 'distinct conclusion: no visible singularity; shares the AF vacuum data
    class only'
- class_id: AF-SCC-C0-VAC-GEN
  relation: separate regularity class; never merged as a disjunction
