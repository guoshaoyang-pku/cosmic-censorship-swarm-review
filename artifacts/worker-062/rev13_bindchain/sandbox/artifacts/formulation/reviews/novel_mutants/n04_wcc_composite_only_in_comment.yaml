class_id: AF-WCC-VAC-GEN
node_id: F1
owner: lead-formulation
authored_by: astra-lead-formulation
authored_at: "2026-09-11T23:23:03+08:00"
timestamp_provenance: "authored_at corrected to the filesystem mtime of this file; the first-pass value was ahead of wall clock (lead self-audit 2026-09-11T23:26+08:00)"
revision: 1
supersedes: null
class_components:
  asymptotics: AF
  censorship: WCC
  matter: VAC
  genericity: GEN
  regularity_token: none
class_contract_pointer: artifacts/formulation/formulation_taxonomy.yaml#class_contracts.AF-WCC-VAC-GEN
epistemic_status: open_problem
promotion_rule: "may be recorded as a theorem only with a checked proof artifact and artifact_refs; a schema is never evidence for its own conclusion"
scope_statement: >
  The maximal globally hyperbolic development of generic asymptotically flat vacuum initial data
  (4-dimensional Einstein vacuum equations, Lambda = 0) has future null infinity I+ that is
  complete, and no future-incomplete causal geodesic is visible from I+. The class asserts
  hiddenness of singularities, not their absence.

quantifiers:
  formal: >-
    forall (s,delta) in D0: exists G_{s,delta} subset X^{s,delta}_vac(AF) with G_{s,delta} comeager:
    forall (Sigma,h,K) in G_{s,delta}, letting (M,g) be the maximal globally hyperbolic development:
    exists a conformal completion (Mtilde,gtilde,Omega) of (M,g) at I+ such that
    (i) I+ is null with I+ diffeomorphic to R x S^2, and
    (ii) every null geodesic generator of I+ is future-complete, and
    forall future-inextendible causal geodesics gamma of (M,g) with finite affine length:
    not exists q in I+ with gamma subset J^-(q) intersect M.
  ordered:
    - {kind: forall, binder: "(s,delta)", domain_id: D0}
    - {kind: exists, binder: "G_{s,delta}", domain_id: D1}
    - {kind: forall, binder: "(Sigma,h,K)", domain_id: D2}
    - {kind: exists, binder: "(Mtilde,gtilde,Omega)", domain_id: D3}
    - {kind: forall, binder: "gamma", domain_id: D4}
    - {kind: not_exists, binder: "q", domain_id: D5}
  domains:
    D0:
      definition: "admissible regularity pairs: Sobolev variant s > 5/2 and delta in (1/2,1), or the smooth-with-decay default; the class is fixed at these values and does not range over 'suitable' regularity"
      definition_ref: regularity.data_regularity
    D1:
      definition: "comeager (residual) subsets of X^{s,delta}_vac(AF): G = intersection over n >= 1 of U_n with each U_n open and dense in the named topology; equivalently X minus G is meager"
      definition_ref: genericity
    D2:
      definition: "one-ended asymptotically flat vacuum initial data satisfying both constraint equations in the declared regularity class"
      definition_ref: data_class
    D3:
      definition: "conformal completions of the maximal development at future null infinity: Omega > 0 on M, Omega = 0 and dOmega != 0 on I+, gtilde = Omega^2 g extends as a C^k Lorentzian metric to M union I+, I+ null and diffeomorphic to R x S^2"
      definition_ref: i_plus
    D4:
      definition: "future-directed causal geodesics gamma: [0,T) -> M, inextendible in M, with T < infinity in affine parameter (unit speed in the timelike case)"
      definition_ref: visibility
    D5:
      definition: "points q of I+ such that gamma([0,T)) is contained in the causal past J^-(q) intersected with M"
      definition_ref: visibility
  order_matters: true
  order_note: "the generic set is chosen before and independently of the data; it may not depend on (Sigma,h,K). Swapping the first exists and the following forall yields the trivial statement that every data set lies in some comeager set."
  negation: >-
    there exists (s,delta) in D0 such that for every comeager G subset X^{s,delta}_vac(AF)
    there is (Sigma,h,K) in G whose development fails the conclusion: either it admits no conformal
    completion of the declared kind, or some null geodesic generator of I+ is incomplete, or some
    future-inextendible causal geodesic of finite affine length is visible from I+.
  negation_normal_form: "{ (s,delta) in D0 : { D in X^{s,delta}_vac(AF) : not P_WCC(D) } is non-meager } is non-empty"
  quantifier_class: "forall-exists(comeager)-forall-exists-forall-not-exists; not reducible to a first-order statement over the data because the comeager set is a set quantifier"

topology:
  spacetime_dimension: 4
  slice_topology: "Sigma connected, oriented, complete Riemannian 3-manifold diffeomorphic to R^3 (exactly one asymptotically flat end)"
  end_structure: "one AF end; outside a compact set a chart in which the decay rates of data_class hold"
  completeness_of_slice: true
  conformal_boundary: ["I+ (future null infinity)", "I- (past null infinity)", "i0 (spatial infinity)"]
  I_plus_topology: "R x S^2"
  development_topology: "M globally hyperbolic, M diffeomorphic to Sigma x R, Sigma a Cauchy surface"
  horizon_topology: "not assumed a priori; no spherical-horizon-topology theorem is used, and no a priori product structure of the black-hole region is assumed"
  forbidden:
    - "closed or periodic spatial slice"
    - "more than one asymptotically flat end"
    - "assuming the black-hole region or the horizon is non-empty or smooth (that would assume part of the conclusion)"
    - "assuming asymptotic simplicity of the conformal completion (that assumes the I+ part of the conclusion)"

data_class:
  matter: none
  cosmological_constant: 0
  equations: "Einstein vacuum equations Ric(g) = 0"
  constraints:
    hamiltonian: "R(h) - K_ij K^ij + (tr_h K)^2 = 0"
    momentum: "D^j (K_ij - (tr_h K) h_ij) = 0"
  regularity_class:
    default: "smooth-with-decay: h and K of class C^infinity with the numeric rates below"
    sobolev_variant:
      s: "s > 5/2"
      delta: "delta in (1/2, 1)"
      spaces: "h - delta_ij in H^s_delta, K in H^{s-1}_{delta+1} (weighted Sobolev)"
      status: "standard_choice; the numeric thresholds are UNVERIFIED citations, L1 owns verification"
  asymptotic_decay:
    metric: "h_ij - delta_ij = O(r^{-1}) and |d^k h| = O(r^{-1-k}) for 1 <= k <= s"
    second_fundamental_form: "K_ij = O(r^{-2}) and |d^k K| = O(r^{-2-k}) for 0 <= k <= s-1"
    parity_conditions: "not imposed; imposing a parity condition would shrink the class and must be declared as a different class"
  adm_mass:
    exists: true
    sign: "m_ADM >= 0 by the positive mass theorem"
    rigidity: "m_ADM = 0 iff the data are Minkowski (vacuum case)"
    citation_status: unresolved
  gauge: "no gauge is fixed on the data; every predicate in this schema is diffeomorphism invariant"
  diffeo_quotient: "genericity is defined on data modulo diffeomorphisms that are asymptotically the identity; constructing that quotient rigorously is a declared open technical gap (see unresolved_items), not a solved step"
  excluded_data: "data outside the declared generic set are members of other classes (non-generic subfamilies); they are NOT counterexamples to this class"

# NOTE (R3 probe): the extension regularity is C0 or C2 depending on the
# branch; composite regularity C0 or C2 is intended here.
regularity:
  data_regularity: "smooth-with-decay default, or H^s_delta with s > 5/2 and delta in (1/2,1)"
  solution_regularity: "g of class C^infinity(M) for smooth data (H^s_loc for the Sobolev variant); the maximal globally hyperbolic development exists and is unique up to isometry"
  existence_theorem: "local existence and maximal development for the vacuum equations; UNVERIFIED citation, L1 owns the anchor"
  i_plus_regularity: "gtilde extends to I+ with C^k regularity for a fixed k >= 3, and Omega solves the conformal Einstein equations to the order required by k; k is part of the assumption, never a conclusion"
  extension_regularity: null
  extension_solution_concept: null
  must_not_conflate:
    - "smooth-data statements may not be transferred to the Sobolev variant without an approximation/stability argument"
    - "C^infinity or C^2 extensions of the development are permitted by WCC in principle; WCC constrains visibility, not extendibility"
    - "I+ regularity k is an assumption of the class, not a physical result"
    - "MGHD maximality (no larger globally hyperbolic development) is NOT inextendibility (no larger solution at all); these are different properties owned by the SCC classes"

genericity:
  kind: residual_comeager
  ambient_space: "X^{s,delta}_vac(AF): one-ended asymptotically flat vacuum initial data in the declared regularity class, modulo asymptotically-identity diffeomorphisms"
  topology_or_measure: "norm topology of the weighted Sobolev product H^s_delta x H^{s-1}_{delta+1}; Frechet topology for the smooth-with-decay class"
  generic_set: "G = intersection over n >= 1 of U_n, each U_n open and dense in the named topology; equivalently the complement is meager (first category)"
  excluded_set: "meager by construction; candidates that must be shown meager or explicitly excluded are: data with a nonzero Killing field, data in the exactly-extendible (Cauchy-horizon) family, self-similar or scale-invariant data, and finite-dimensional analytic families generated by continuation"
  excluded_set_status: unresolved
  is_part_of_class: true
  class_change_warning: "genericity is part of the class identity: 'for all data' is a strictly stronger different class and 'open dense only' is a strictly weaker different class; neither may be substituted silently"
  acceptance_alignment: "Astra F1 acceptance names 'open dense'. This schema's frozen default is the stronger residual/comeager form; open_dense_escape is registered below as a distinct weaker variant and is never silently substituted."
  transfer_failures:
    - pair: [residual_comeager, full_measure]
      direction: no_transfer
      witness: "comeager and measure-zero are compatible: the complement of a fat Cantor set is open dense with arbitrarily small measure; a comeager set can be Lebesgue-null"
      status: standard_fact
      citation_status: unresolved
    - pair: [full_measure, residual_comeager]
      direction: no_transfer
      witness: "a measure-zero set can be comeager (e.g. the irrationals in R are comeager and have full measure; a comeager null set exists by intersecting open dense sets of shrinking measure)"
      status: standard_fact
      citation_status: unresolved
    - pair: [open_dense_escape, residual_comeager]
      direction: no_transfer
      witness: "a set can meet every non-empty open set without containing a comeager set; comeagerness requires a countable intersection of open dense sets"
      status: elementary
      citation_status: n/a
    - pair: [residual_comeager, finite_codimension_complement]
      direction: no_transfer
      witness: "a countable union of finite-codimension submanifolds can be dense with empty interior; codimension control is neither necessary nor sufficient for comeagerness"
      status: elementary
      citation_status: n/a
  variants:
    - {kind: open_dense_escape, statement_strength: strictly_weaker, is_this_class: false}
    - {kind: full_measure, statement_strength: incomparable, is_this_class: false, requires: "a specified measure on X, e.g. a Gaussian measure induced by the constraint map"}
    - {kind: none, statement_strength: strictly_stronger, is_this_class: false}

non_vacuity:
  condition: "G must contain data whose development has non-empty black-hole region B = M minus J^-(I+); if G consisted only of dispersing data, the conclusion would hold trivially and the class would carry no information"
  witness_type: "a one-parameter family in G containing a future trapped surface (sufficiently concentrated AF vacuum data) whose MGHD has B non-empty"
  status: "trapped-surface formation is standard, but membership of such a family in the comeager set is exactly what must be supplied; UNVERIFIED here"
  vacuity_falsifier: "if every data set admitted by the schema disperses to a geodesically complete development with B empty, the schema is vacuous and must be revised rather than cited"

i_plus:
  role: conclusion
  in_conclusion: true
  definition: "conformal completion of (M,g) at future null infinity: an embedding into (Mtilde,gtilde) with Omega > 0 on M, Omega = 0 and dOmega != 0 on I+, gtilde = Omega^2 g of class C^k Lorentzian on Mtilde = M union I+, I+ a null hypersurface diffeomorphic to R x S^2, with the conformal Einstein equations holding near I+ to the order required by k"
  asymptotically_simple: "NOT assumed"
  completeness_definition: "every null geodesic generator of I+ is future-complete: it is defined for all values of the affine parameter induced by gtilde; equivalently every future-directed null geodesic reaching I+ has infinite affine length with respect to g"
  required_properties:
    - "I+ non-empty, null, and diffeomorphic to R x S^2"
    - "I+ future-complete in the affine parameter of gtilde"
    - "no generator of I+ terminates at a singular point of the conformal boundary"
  forbidden_weakenings:
    - "replacing completeness by mere existence of I+"
    - "assuming I+ complete rather than concluding it"
    - "assuming asymptotic simplicity or that I+ is the entire conformal boundary"

visibility:
  role: conclusion
  in_conclusion: true
  predicate_name: visible_singularity_from_I_plus
  singularity_definition: "an incomplete causal geodesic: future-directed, future-inextendible in M, with finite affine length (unit speed in the timelike case). Curvature blow-up is NOT used as the definition of a singular point."
  definition: "a future-inextendible causal geodesic gamma: [0,T) -> M with T < infinity in affine parameter is visible from I+ iff there exists q in I+ with gamma([0,T)) contained in J^-(q) intersect M"
  visible_singularity_exists: "exists gamma visible from I+ in the sense above"
  negation_conclusion: "there is NO visible_singularity_from_I_plus: every future-inextendible causal geodesic of finite affine length lies outside the causal past of every point of I+, i.e. inside the black-hole region B = M minus J^-(I+)"
  must_not_conflate:
    - "bounded affine length is the notion used, not curvature-scalar blow-up; a curvature singularity inside a horizon is not a counterexample"
    - "visibility is via a causal relation to a point of I+, not via a geodesic that merely escapes to spatial infinity i0"
    - "a singularity hidden inside B is consistent with this class and is not a failure"
  witness_protocol: "for a claimed counterexample: (1) constraint residuals below tolerance; (2) AF decay rates at the declared orders; (3) gamma future-inextendible with finite affine parameter; (4) causal relation gamma subset J^-(q) for an exhibited q in I+. Step (5), genericity membership or non-meagerness of the failure set, is NOT machine-checkable and must be argued separately."
  observability_note: "the class is falsifiable in principle by one visible singularity only if the failure set is shown non-meager; see falsifier.tier_1 vs tier_2"

conclusion:
  conclusion_type: weak_cosmic_censorship
  epistemic_status: open_problem
  family: WCC
  statement_natural_language: "Generic asymptotically flat vacuum initial data have a maximal development with complete future null infinity and no singularity visible from future null infinity."
  statement_formal: "forall (s,delta) in D0 exists G_{s,delta} comeager forall D in G_{s,delta}: AF_{I+}(M_D) and complete(I+_D) and not exists visible_singularity_from_I_plus(M_D)"
  equivalent_standard_formulation:
    predicate: "future asymptotic predictability: there exists a partial Cauchy surface S, asymptotically flat, whose future domain of dependence has I+ in its closure"
    status: "claimed equivalence, UNVERIFIED; the class is bound to statement_formal, and a citation of the equivalent phrasing must carry L1 verification"
  forbidden_strengthenings:
    - "black-hole region non-empty (black-hole formation is a separate statement and is NOT part of this conclusion)"
    - "geodesic completeness of M"
    - "C2 or C0 inextendibility of the maximal development (SCC content)"
    - "absence of singularities anywhere"
    - "the statement for ALL data rather than for generic data"
  forbidden_weakenings:
    - "dropping I+ completeness"
    - "replacing the generic quantifier with 'there exist data'"
    - "replacing 'no visible singularity' by 'no singularity'"
    - "using a weaker visibility notion or a different definition of singular point"
  claim_promotion: "epistemic_status=open_problem; recording conclusion_type=theorem requires artifact_refs with a checked proof and is auto-rejected otherwise"

falsifier:
  tier_1:
    refutes: AF-WCC-VAC-GEN
    witness_type: "a one-ended AF vacuum initial data set together with a future-inextendible causal geodesic of finite affine length visible from I+, AND an argument that the failure set is non-meager (e.g. an open set of constraint solutions with a robust naked-singularity mechanism)"
    genericity_requirement: "one data set alone refutes only the strengthening 'for all data', because the data may be non-generic; tier 1 needs the failure set to be non-meager"
    machine_checkable_steps: ["constraint residuals below tolerance", "AF decay rates at declared orders", "finite affine parameter while future-inextendible in M", "causal relation to an exhibited point of I+"]
    non_machine_checkable_step: "comeagerness/non-meagerness of the failure set; must be argued explicitly and reviewed by a human-scale argument"
  tier_2:
    refutes: "only the strictly stronger class 'forall AF vacuum data'"
    witness_type: "a single AF vacuum initial data set with a visible incomplete causal geodesic"
    labelling_required: refutes_strengthening_only
  schema_falsifiers:
    - "two competent readers classify the same described spacetime differently under this schema (Astra F1 falsifier): the schema is imprecise and must be revised"
    - "the conclusion is satisfiable by a dispersing family with B empty and no non-vacuity witness: the schema is vacuous as stated"
    - "a reader can derive C2/C0 inextendibility or black-hole formation from the conclusion block: conclusion inflation"
    - "a rephrased statement with no forbidden token carries SCC content through the conclusion block: the leakage scan is insufficient for that phrasing"

anti_scope:
  not_this_class:
    - {class_id: AF-SCC-C2-VAC-GEN, why: "conclusion is future C2 inextendibility, not visibility; a C2-inextendibility result is not a WCC result"}
    - {class_id: AF-SCC-C0-VAC-GEN, why: "same, at C0 regularity"}
    - {class_id: AF-WCC-SCALAR-SPH, why: "different matter content and symmetry, hence a different ambient space and genericity manifold"}
    - {class_id: "AF-SCC-L2LOC-VAC-GEN (candidate, not in the map)", why: "H2_loc is a separate value of the regularity axis"}
  phrases_that_are_not_this_class:
    - "any 'C0 or C2' composite regularity"
    - "any conclusion asserting extension regularity"
    - "inner-horizon or mass-inflation statements used as the class conclusion"

