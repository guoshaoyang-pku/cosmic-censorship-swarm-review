promotion_rule: "may be recorded as a theorem only with a checked proof artifact and artifact_refs; a schema is never evidence for its own conclusion"
scope_statement: >
  The maximal globally hyperbolic development of generic asymptotically flat vacuum initial data
  (4-dimensional Einstein vacuum equations, Lambda = 0) has future null infinity I+ that is
  complete, and no future-incomplete causal geodesic is visible from I+. The class asserts
  hiddenness of singularities, not their absence.

quantifiers:
  formal: >-
    forall r in D0: exists G_r subset X^r_vac(AF) with G_r comeager:
    forall (Sigma,h,K) in G_r, letting (M,g) be the maximal globally hyperbolic development:
    exists a conformal completion (Mtilde,gtilde,Omega) of (M,g) at I+ such that
    (i) I+ is null with I+ diffeomorphic to R x S^2, and
    (ii) every null geodesic generator of I+ is future-complete, and
    forall future-inextendible causal geodesics gamma of (M,g) with finite affine length:
    not exists q in I+ and very very very very very very very very very very very very very xxx t0 in [0,T) with gamma([t0,T)) subset J^-(q) intersect M.
  ordered:
    - {kind: forall, binder: "r", domain_id: D0}
    - {kind: exists, binder: "G_r", domain_id: D1}
    - {kind: forall, binder: "(Sigma,h,K)", domain_id: D2}
    - {kind: exists, binder: "(Mtilde,gtilde,Omega)", domain_id: D3}
    - {kind: forall, binder: "gamma", domain_id: D4}
    - {kind: not_exists, binder: "(q,t0)", domain_id: D5}
  domains:
    D0:
      definition: "admissible regularity indices, a tagged disjoint union: r = smooth (the smooth-with-decay default) or r = (sobolev,s,delta) with s > 5/2 and delta in (1/2,1). X^r_vac(AF) is the corresponding one-ended AF vacuum constraint manifold (Frechet for r = smooth; weighted Sobolev product H^s_delta x H^{s-1}_{delta+1} for r = (sobolev,s,delta)). The index r ranges over exactly D0, so the smooth branch is no longer typed as a pair and the class does not range over 'suitable' regularity. [rev12 F-2 well-typedness repair: F1-review-19 F-2, F2b-review-034 HF-034-1]"
      definition_ref: regularity.data_regularity
    D1:
      definition: "comeager (residual) subsets of X^r_vac(AF): G_r = intersection over n >= 1 of U_n with each U_n open and dense in the named topology; equivalently X^r_vac(AF) minus G_r is meager"
      definition_ref: genericity
    D2:
      definition: "one-ended asymptotically flat vacuum initial data satisfying both constraint equations in the declared regularity class"
      definition_ref: data_class
    D3:
      definition: "conformal completions of the maximal development at future null infinity: Omega > 0 on M, Omega = 0 and dOmega != 0 on I+, gtilde = Omega^2 g extends as a C^k Lorentzian metric to M union I+, I+ null and diffeomorphic to R x S^2"
      definition_ref: i_plus
    D4:
      definition: "future-directed causal geodesics gamma: [0,T) -> M that are future-inextendible in M, with T < infinity in affine parameter (unit speed in the timelike case). Qualifier aligned with visibility.definition and non_vacuity: future-inextendibility is what makes the terminal end a singularity. [R1 minor]"
      definition_ref: visibility
    D5:
      definition: "pairs (q,t0) with q a point of I+ and t0 in [0,T) such that the tail gamma([t0,T)) is contained in the causal past J^-(q) intersected with M. Whole-curve containment gamma([0,T)) subset J^-(q) is EQUIVALENT to the tail form for causal geodesics, because J^-(q) is past-closed (for t < t0, gamma(t) <= gamma(t0) <= q), so the tail formulation is a definitional choice and NOT a weakening; neither reading is a second predicate of this class. [rev13: strict-order direction corrected - W076-GFORM-STRICTNESS-RECONCILE-06 T1 (0/355 preorders on 4 points separate the readings) and worker-040 W040-F1-STRICTNESS-ADJ-04; the rev12 'strictly STRONGER' assertion was false]"
      definition_ref: visibility
  order_matters: true
  order_note: "the generic set is chosen before and independently of the data; it may not depend on (Sigma,h,K). Swapping the first exists and the following forall yields the trivial statement that every data set lies in some comeager set."
  negation: >-
    there exists r in D0 such that for every comeager G_r subset X^r_vac(AF)
    there is (Sigma,h,K) in G_r whose development fails the conclusion: either it admits no conformal
    completion of the declared kind, or some null geodesic generator of I+ is incomplete, or some
    future-inextendible causal geodesic of finite affine length has a tail visible from I+.
  negation_normal_form: "{ r in D0 : { D in X^r_vac(AF) : not P_WCC(D) } is non-meager } is non-empty"
  quantifier_class: "forall-exists(comeager)-forall-exists-forall-not-exists; not reducible to a first-order statement over the data because the comeager set is a set quantifier"

topology:
  spacetime_dimension: 4
  slice_topology: "Sigma connected, oriented, complete Riemannian 3-manifold diffeomorphic to R^3 (exactly one asymptotically flat end)"
  end_structure: "one AF end; outside a compact set a chart in which the decay rates of data_class hold"
  completeness_of_slice: true
  conformal_boundary: ["I+ (future null infinity)", "I- (past null infinity)", "i0 (spatial infinity)"]
  I_plus_topology: "R x S^2"
  development_topology: "M globally hyperbolic, M diffeomorphic to Sigma x R, Sigma a Cauchy surface"
  horizon_topology: "not assumed a priori; no spherical-horizon-topology theorem is used, and no a priori product structure of the black-hole region is assumed"
  forbidden:
    - "closed or periodic spatial slice"
    - "more than one asymptotically flat end"
    - "assuming the black-hole region or the horizon is non-empty or smooth (that would assume part of the conclusion)"
    - "assuming asymptotic simplicity of the conformal completion (that assumes the I+ part of the conclusion)"

data_class:
  matter: none
  cosmological_constant: 0
  equations: "Einstein vacuum equations Ric(g) = 0"
  constraints:
    hamiltonian: "R(h) - K_ij K^ij + (tr_h K)^2 = 0"
    momentum: "D^j (K_ij - (tr_h K) h_ij) = 0"
  regularity_class:
    default: "smooth-with-decay: h and K of class C^infinity with the numeric rates below"
    sobolev_variant:
      s: "s > 5/2"
      delta: "delta in (1/2, 1)"
      spaces: "h - delta_ij in H^s_delta, K in H^{s-1}_{delta+1} (weighted Sobolev)"
      status: "standard_choice; the numeric thresholds are UNVERIFIED citations, L1 owns verification"
  asymptotic_decay:
    metric: "h_ij - delta_ij = O(r^{-1}) and |d^k h| = O(r^{-1-k}) for 1 <= k <= s"
    second_fundamental_form: "K_ij = O(r^{-2}) and |d^k K| = O(r^{-2-k}) for 0 <= k <= s-1"
    parity_conditions: "not imposed; imposing a parity condition would shrink the class and must be declared as a different class"
  adm_mass:
    exists: true
    sign: "m_ADM >= 0 by the positive mass theorem"
    rigidity: "m_ADM = 0 iff the data are Minkowski (vacuum case)"
    citation_status: unresolved
  symmetry: none_assumed
  gauge: "no gauge is fixed on the data; every predicate in this schema is diffeomorphism invariant"
  diffeo_quotient: "genericity is defined on data modulo diffeomorphisms that are asymptotically the identity; constructing that quotient rigorously is a declared open technical gap (see unresolved_items), not a solved step"
  excluded_data: "data outside the declared generic set are non-generic; they are NOT counterexamples to this class. The schema does NOT decide individual membership (see genericity.membership_ruling), and the meagerness of the named families is unresolved - so 'outside G' may not be asserted for a named datum without a proof. [R1 minor: this field previously conflicted with membership_ruling and with falsifier.schema_falsifiers.]"

regularity:
  data_regularity: "smooth-with-decay default, or H^s_delta with s > 5/2 and delta in (1/2,1)"
  solution_regularity: "g of class C^infinity(M) for smooth data (H^s_loc for the Sobolev variant); the maximal globally hyperbolic development exists and is unique up to isometry"
  existence_theorem: "local existence and maximal development for the vacuum equations; UNVERIFIED citation, L1 owns the anchor"
  i_plus_regularity: "gtilde extends to I+ with C^k regularity for a fixed k >= 3, and Omega solves the conformal Einstein equations to the order required by k; k is part of the assumption, never a conclusion"
  extension_regularity: null
  extension_solution_concept: null
  must_not_conflate:
    - "smooth-data statements may not be transferred to the Sobolev variant without an approximation/stability argument"
    - "C^infinity or C^2 extensions of the development are permitted by WCC in principle; WCC constrains visibility, not extendibility"
    - "I+ regularity k is an assumption of the class, not a physical result"
    - "MGHD maximality (no larger globally hyperbolic development) is NOT inextendibility (no larger solution at all); these are different properties owned by the SCC classes"

genericity:
  kind: residual_comeager
  ambient_space: "the constraint manifold X^r_vac(AF) of one-ended asymptotically flat VACUUM initial data in the declared regularity class, carrying the topology induced from the weighted Sobolev product H^s_delta x H^{s-1}_{delta+1}. R1 F04 accepted: the topology is the SUBSPACE topology on the constraint set, not the topology of the unconstrained product (under the latter reading X_vac itself is meager and no G exists). X_vac is a closed subset of a Banach space, hence a Baire space, so comeagerness is non-vacuous and G is non-empty."
  topology_or_measure: "subspace topology induced on X^r_vac(AF); Frechet topology for the smooth-with-decay class. Gauge invariance is handled by noting every predicate here is diffeomorphism invariant; the quotient by asymptotically-identity diffeomorphisms is NOT used to define comeagerness and remains an open technical gap (see unresolved_items)."
  generic_set: "G = intersection over n >= 1 of U_n with each U_n open and dense in X^r_vac(AF); equivalently the complement is meager (first category); G_r is non-empty because X_vac is Baire"
  excluded_set: "the excluded set is REQUIRED to be meager; whether the named candidate families are meager is UNRESOLVED, so they are listed as obligations rather than as constructions. Candidates: data with a nonzero Killing field, data in the exactly-extendible (Cauchy-horizon) family, self-similar or scale-invariant data, finite-dimensional analytic families generated by continuation, and exactly symmetric data (see axis_registry and membership_ruling)."
  excluded_set_status: unresolved
  ambient_space_is_data_space: true
  membership_ruling: "set-level only: the class quantifies over a comeager set G of data; the schema does not decide membership of an individual datum. A single symmetric/stationary datum is expected outside G in the vacuum class, but that expectation is a proof obligation, not a schema field (flash-04 AMB-07 ruling)."
  vocabulary_aliases_ref: artifacts/formulation/VOCAB_ALIASES.json
  is_part_of_class: true
  class_change_warning: "genericity is part of the class identity. The comeager form is this class. 'For all data' is strictly stronger. The dense-open form is ALSO strictly stronger, because a dense open set is comeager (it is the countable intersection of the constant family). The comeager form does not imply the dense-open form (a comeager set can have empty interior). No strengthening may be substituted silently. See genericity.transfer_failures for the two directions."
  acceptance_alignment: "Astra F1 acceptance names 'open dense'. This schema's frozen default is the residual/comeager form; open_dense_escape is registered below as a distinct STRICTLY STRONGER variant (a dense open set is comeager, so it implies the default) and is never silently substituted. A gate matching only the literal words 'open dense' would accept a stronger class than this one - recorded as a vocabulary risk."
  transfer_failures:
    - pair: [residual_comeager, full_measure]
      direction: no_transfer
      witness: "let C = intersection over n of U_n with each U_n open dense and of measure < 1/n; C is comeager and Lebesgue-null, so comeagerness does not yield full measure (a single fat-Cantor complement is open dense but not null, which is why the countable intersection is used) [R1 F03]"
      status: standard_fact
      citation_status: unresolved
    - pair: [full_measure, residual_comeager]
      direction: no_transfer
      witness: "let C be the comeager null set of the row above; then X minus C is meager and has full measure, so full measure does not yield comeagerness. (The irrationals are BOTH comeager and full-measure and therefore witness nothing - R1 F03.)"
      status: standard_fact
      citation_status: unresolved
    - {pair: [residual_comeager, open_dense_escape], direction: no_transfer, witness: "the irrationals are comeager with empty interior: a comeager set need not contain any nonempty open subset, so the comeager form does not yield a dense-open form", status: standard_fact, citation_status: unresolved}
    - {pair: [residual_comeager, finite_codimension_complement], direction: no_transfer, witness: "a fat Cantor set is nowhere dense (meager) yet has positive measure, so it is not contained in any countable union of finite-codimension submanifolds, which is null", status: elementary, citation_status: n/a}
  transfer_holds:
    - {pair: [open_dense_escape, residual_comeager], direction: transfers, witness: "a dense open set U is the countable intersection of the constant family {U}, hence comeager; the dense-open form implies the comeager form", status: elementary, citation_status: n/a}
    - {pair: [finite_codimension_complement, residual_comeager], direction: transfers, witness: "a proper closed finite-codimension submanifold is closed and nowhere dense, so a countable union of them is meager; if the exceptional set is so covered, the property holds on a comeager set", status: elementary, citation_status: n/a}
  variants:
    - {kind: open_dense_escape, statement_strength: strictly_stronger, is_this_class: false, relation: "implies residual_comeager"}
    - {kind: dense_escape, statement_strength: strictly_weaker, is_this_class: false, relation: "implied by residual_comeager in a Baire space (a comeager set is dense); a dense set need not be comeager, so it is strictly weaker than the class default. [R2-16 corrected: was off-vocabulary and mislabelled incomparable]"}
    - {kind: full_measure, statement_strength: incomparable, is_this_class: false, requires: "a specified measure on X, e.g. a Gaussian measure induced by the constraint map"}
    - {kind: none, statement_strength: strictly_stronger, is_this_class: false}

