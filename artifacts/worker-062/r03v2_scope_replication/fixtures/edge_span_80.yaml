non_vacuity:
  condition: "G must contain data whose MGHD is future geodesically incomplete; otherwise the 'no visible singularity' clause has no content and the class is trivially satisfied by dispersion. The stronger requirement that the black-hole region B be non-empty belongs to the separate black-hole-formation statement and is NOT assumed here (worker-16 F1-16-03 accepted)."
  witness_type: "a one-parameter family in G containing a future trapped surface (sufficiently concentrated AF vacuum data), hence a future-incomplete development"
  status: "trapped-surface formation is standard, but membership of such a family in the comeager set is exactly what must be supplied; UNVERIFIED here"
  vacuity_falsifier: "if every data set admitted by the schema disperses to a future-complete development, the schema is vacuous and must be revised rather than cited"

i_plus:
  role: conclusion
  in_conclusion: true
  definition: "conformal completion of (M,g) at future null infinity: an embedding into (Mtilde,gtilde) with Omega > 0 on M, Omega = 0 and dOmega != 0 on I+, gtilde = Omega^2 g of class C^k Lorentzian on Mtilde = M union I+, I+ a null hypersurface diffeomorphic to R x S^2, with the conformal Einstein equations holding near I+ to the order required by k"
  predicate_abbreviation: "AF_{I+}(M) abbreviates the existence predicate of i_plus.definition: M admits a conformal completion (Mtilde,gtilde,Omega) at future null infinity with the regularity assumed in i_plus_regularity. It introduces no assumption beyond that leaf and is the only reading of the symbol in this schema. [rev12: F1-review-090 HF and F1-review-19 HF-06 - the symbol was previously undefined; grep AF_{I+} matched conclusion.statement_formal only]"
  asymptotically_simple: "NOT assumed"
  completeness_definition: "every null geodesic generator of I+ is future-complete: it is defined for all values of the affine parameter induced by gtilde; equivalently every future-directed null geodesic reaching I+ has infinite affine length with respect to g"
  completeness_definition_status: "definitional restatement of generator completeness. It is NOT the unverified equivalence recorded in conclusion.equivalent_standard_formulation, and it asserts no theorem (worker-16 F1-16-01 clarification)."
  completion_uniqueness: "NOT asserted: the schema requires existence of a conformal completion of the stated regularity. Uniqueness up to conformal isometry fixing I+ is not claimed. [R1 minor]"
  k_is_a_class_parameter: "the exponent k in 'C^k completion' is part of the class assumption (i_plus_regularity), not a physical conclusion; statement_formal concludes existence of a completion OF THAT ASSUMED REGULARITY. [R1 minor]"
  required_properties:
    - "I+ non-empty, null, and diffeomorphic to R x S^2"
    - "I+ future-complete in the affine parameter of gtilde"
    - "no generator of I+ terminates at a singular point of the conformal boundary"
  forbidden_weakenings:
    - "replacing completeness by mere existence of I+"
    - "assuming I+ complete rather than concluding it"
    - "assuming asymptotic simplicity or that I+ is the entire conformal boundary"

visibility:
  role: conclusion
  in_conclusion: true
  predicate_name: visible_singularity_from_I_plus
  singularity_definition: "an incomplete causal geodesic: future-directed, future-inextendible in M, with finite affine length (unit speed in the timelike case). Curvature blow-up is NOT used as the definition of a singular point."
  definition: "a future-inextendible causal geodesic gamma: [0,T) -> M with T < infinity in affine parameter is visible from I+ iff there exists q in I+ AND t0 in [0,T) such that the TAIL gamma([t0,T)) is contained in J^-(q) intersect M. Visibility is a property of the singular END of the geodesic, so the tail formulation is used; for causal geodesics the tail and whole-curve readings are EQUIVALENT (past-closedness of J^-(q)), so no geodesic is misclassified by either reading. [rev13: the rev12 misclassification example was a non-sequitur and is removed; the predicate is unchanged - W076-GFORM-STRICTNESS-RECONCILE-06 T1, worker-040 W040-F1-STRICTNESS-ADJ-04]"
  visible_singularity_exists: "exists gamma visible from I+ in the sense above"
  negation_conclusion: "there is NO visible_singularity_from_I_plus: for every future-inextendible causal geodesic gamma of finite affine length, for every q in I+ and every t0 in [0,T), the tail gamma([t0,T)) is NOT contained in J^-(q) intersect M - no single point of I+ causally precedes the singular end of gamma. This is NOT equivalent to 'gamma is contained in B = M minus J^-(I+)': B-containment is strictly stronger, and a geodesic may begin in J^-(I+) and end in the black-hole region. [R1 F02 accepted; the earlier 'i.e. inside B' equivalence was false]"
  must_not_conflate:
    - "bounded affine length is the notion used, not curvature-scalar blow-up; a curvature singularity inside a horizon is not a counterexample"
    - "visibility is via a causal relation to a point of I+, not via a geodesic that merely escapes to spatial infinity i0"
    - "a singularity hidden inside B is consistent with this class and is not a failure"
    - "single-q non-containment (the formal negation) must not be replaced by B-containment; see negation_conclusion [R1 F02]"
  witness_protocol: "for a claimed counterexample: (1) constraint residuals below tolerance; (2) AF decay rates at the declared orders; (3) gamma future-inextendible with finite affine parameter; (4) causal relation gamma subset J^-(q) for an exhibited q in I+. Step (5), genericity membership or non-meagerness of the failure set, is NOT machine-checkable and must be argued separately."
  observability_note: "the class is falsifiable in principle by one visible singularity only if the failure set is shown non-meager; see falsifier.tier_1 vs tier_2"

class_identity_variants:
  # astra-classscope-02: this class carries exactly ONE canonical visibility predicate - the
  # single-q TAIL predicate defined above. The set-based reading is recorded here only as a
  # variant pointer (parent_class AF-WCC-VAC-GEN, variant_id SET in VARIANT_REGISTRY.json);
  # it is NOT a second predicate of this class and NOT a separate class id.
  - kind: set_based_visibility_reading
    class_id: AF-WCC-VAC-GEN
    status: "registered_variant_not_written"
    is_this_class: false
    statement: "variant SET: a future-inextendible causal geodesic gamma is visible from I+ iff gamma([0,T)) is contained in the union of J^-(q) over all q in I+ (intersected with M), i.e. iff gamma lies in J^-(I+) as a set"
    relation: "strictly WEAKER than this class's single-q tail predicate: the single-q tail predicate entails the union reading, and non-containment in the union implies no single q sees a tail of gamma, but not conversely; the two readings are NOT equivalent and must never be interchanged. [rev13: direction corrected from 'strictly STRONGER' - W076-GFORM-STRICTNESS-RECONCILE-06 T2 (tail => set, 0 violations), T3 (finite I+ or a causal maximum of gamma collapses them) and T4 (the omega-chain with infinite I+ and a geodesic without causal maximum separates them, which is this class's case)]"
    why_separate: "the declared F0 taxonomy used this set-based wording before the 2026-09-12 adjudication; it is registered as variant SET of AF-WCC-VAC-GEN (parent_class + variant_id), not as a class, pending Human PI"
    falsifier: "show the two readings equivalent - every incomplete geodesic contained in the union has a tail inside J^-(q) for some single q - which would collapse variant SET and clear divergence D1 by proof rather than by wording"
    note: "binding a set-based result to AF-WCC-VAC-GEN, or a single-q result to variant SET, is class leakage; see artifacts/formulation/VARIANT_REGISTRY.json and artifacts/formulation/variants/AF-WCC-VAC-GEN.variant-SET.delta.json"

conclusion:
  conclusion_type: weak_cosmic_censorship
