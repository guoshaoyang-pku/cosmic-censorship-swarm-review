schema_version: '1.0'
artifact_kind: class_schema
class_id: AF-SCC-C2-VAC-GEN
node_id: F2
owner: lead-formulation
epistemic_status: open_problem
class_components:
  asymptotics: AF
  censorship: SCC
  matter: VAC
  genericity: GEN
  regularity_token: C2
quantifiers:
  ordered:
  - kind: forall
    binder: (Sigma,h,K)
    domain: generic vacuum AF data
    domain_id: D_GEN
  - kind: exists
    binder: (M,g)
    domain: maximal development
    domain_id: DEV
  - kind: not_exists
    binder: p
    domain: future boundary points
    domain_id: VIS
  formal: 'forall (Sigma,h,K) in D_GEN : exists (M,g) in DEV : not exists p in VIS with Visible(p)'
  order_matters: true
  negation: there exists data outside the residual set, or a visible boundary point reached from I+
  domains:
    D_GEN:
      definition: data in the residual set G = intersection of open dense sets in the H^4_{1/2+eps} topology
      definition_ref: genericity.generic_set
    DEV:
      definition: the maximal globally hyperbolic development of the data
    VIS:
      definition: future boundary points p with p in J^-(I+)
topology:
  spacetime_dimension: 4
  slice_topology: Sigma connected, complete, oriented, one-ended and asymptotically flat
  completeness_of_slice: true
  conformal_boundary:
  - I+ (future null infinity)
  - I- (past null infinity)
  - i0 (spatial infinity)
  I_plus_topology: R x S^2
  forbidden:
  - closed (compact without boundary) slices
  - periodic slices
data_class:
  matter: none
  cosmological_constant: 0
  constraints:
    hamiltonian: R(h) - K_ij K^ij + (tr K)^2 = 0
    momentum: div K - d tr K = 0
  adm_mass_status: finite ADM 4-momentum; the Minkowski point is excluded
  adm_mass:
    exists: true
    sign: m_ADM >= 0
  asymptotic_decay:
    metric: h - delta = O(r^-1); d^k h = O(r^{-1-k})
    curvature: K = O(r^-2); d^k K = O(r^{-2-k})
  regularity_class:
    default: smooth-with-decay
    sobolev_variant:
      s: 4
      delta: 1/2 + epsilon
  sobolev_index:
    s: 4
  weight:
    delta: 1/2 + epsilon
regularity:
  data_regularity: h in H^4_loc, K in H^3_loc
  solution_regularity: C^2 Lorentzian metric on the maximal development
  i_plus_regularity: conformal factor extends to I+ with C^3 regularity
  extension_regularity: C2
  extension_solution_concept: classical_ricci
  must_not_conflate:
  - differentiability smuggled in through smooth coordinates
  - WCC content must not appear as this class's conclusion
  extension_solution_concept_note: classical vacuum extension (Ric = 0) for C2
genericity:
  kind: residual_comeager
  ambient_space: D_w, completion of smooth AF vacuum data in H^4_{1/2+eps}
  topology_or_measure: norm topology of H^4_{1/2+eps}
  generic_set: G = intersection over n of open dense U_n
  excluded_set: meagre complement; candidate members recorded, not asserted
  transfer_failures:
  - notion: full_measure
    why_transfer_fails: no canonical Gaussian measure
  is_part_of_class: true
  is_part_of_class_statement: changing the genericity notion yields a different class
  class_change_warning: genericity is part of the class; substituting another notion yields a different class
non_vacuity:
  condition: there exists data in D_GEN with a future-incomplete development
  witness_type: 'existence witness: a collapsing family'
i_plus:
  role: assumption
  in_conclusion: false
  definition: future null infinity defines the data class and the maximal development; it appears nowhere in the conclusion; I+ completeness is asserted as part of this class conclusion
  forbidden:
  - asserting I+ completeness as part of the class conclusion
visibility:
  role: not_in_conclusion
  reason: visibility from I+ is the WCC predicate; it is logically independent of extendibility of the development
  visible_singularity_is_wcc: true
  forbidden_falsifier: a visible incomplete causal geodesic is a WCC falsifier, not a falsifier of this class
conclusion:
  conclusion_type: scc_c2_future_inextendibility
  epistemic_status: open_problem
  statement: generic AF vacuum data have a maximal development that is future-inextendible as a C2 Lorentzian manifold
  statement_natural_language: generic AF vacuum data are future-inextendible as C2 Lorentzian manifolds
  statement_formal: 'forall D in G : not exists proper future C2 extension of MGHD(D)'
  forbidden_strengthenings:
  - two-sided inextendibility
  - upgrading to theorem without artifact_refs
falsifier:
  tier_1:
    refutes: AF-SCC-C2-VAC-GEN
    witness_type: a non-meager set of one-ended AF vacuum data whose maximal developments admit proper future C2 metric extensions
    genericity_requirement: tier 1 requires non-meagerness of the extendible set
    family_witness_type: 'extension witness: a proper future C2 metric extension'
    machine_checkable_steps:
    - check constraint residuals below tolerance
    - verify the C2 extension is nondegenerate on a neighbourhood of the boundary
    - verify the embedding is an isometry onto an open proper subset
  tier_2:
    refutes: only the strictly stronger class 'for all AF vacuum data'
    witness_type: a single extendible data set
    labelling_required: refutes_strengthening_only
  witness_type: proper future C2 extension; none constructed here
provenance:
  citation_status: unresolved
  sources: []
  unresolved_citations:
  - no source in this fixture establishes the class conclusion
  source_conclusion_disclaimer: no source is presented as establishing the class conclusion
implication_ledger:
  one_way_entailments:
  - from: no proper future C0 extension
    to: no proper future C2 extension
    relation: entails
    reason: every C2 metric extension is a C0 metric extension, so the C2 extension class is strictly smaller (C2 subset C0)
  forbidden_transfers:
  - from: no proper future C2 extension
    to: this class
    reason: C2-inextendibility is strictly weaker and does not transfer
  - from: AF-WCC-VAC-GEN
    to: this class
    reason: WCC <-> SCC transfer is forbidden here
  cross_family: no WCC <-> SCC transfer is licensed by this fixture
