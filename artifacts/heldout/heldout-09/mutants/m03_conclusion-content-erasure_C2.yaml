promotion_rule: may be recorded as a theorem only with a checked proof artifact and artifact_refs; a schema is never evidence for its own conclusion
scope_statement: 'The maximal globally hyperbolic development of generic asymptotically flat vacuum initial data (4-dimensional Einstein vacuum equations, Lambda = 0) admits no proper future extension that is a C2 Lorentzian solution of the vacuum equations. The class is about non-extendibility of the development; it makes no statement about what an observer at I+ sees.

  '
quantifiers:
  formal: 'forall r in D0: exists G_r subset X^r_vac(AF) with G_r comeager: forall (Sigma,h,K) in G_r, letting (M,g) be the maximal globally hyperbolic development: not exists a proper future C2 vacuum extension (M'',g'',iota) of (M,g).'
  ordered:
  - kind: forall
    binder: r
    domain_id: D0
  - kind: exists
    binder: G_r
    domain_id: D1
  - kind: forall
    binder: (Sigma,h,K)
    domain_id: D2
  - kind: not_exists
    binder: (M',g',iota)
    domain_id: D3
  domains:
    D0:
      definition: 'admissible regularity indices, a tagged disjoint union: r = smooth (the smooth-with-decay default) or r = (sobolev,s,delta) with s > 5/2 and delta in (1/2,1). X^r_vac(AF) is the corresponding one-ended AF vacuum constraint manifold (Frechet for r = smooth; weighted Sobolev product H^s_delta x H^{s-1}_{delta+1} for r = (sobolev,s,delta)). The index r ranges over exactly D0, so the smooth branch is no longer typed as a pair and the class does not range over ''suitable'' regularity. [rev12 F-2 well-typedness repair: F1-review-19 F-2, F2b-review-034 HF-034-1]'
      definition_ref: regularity.data_regularity
    D1:
      definition: comeager (residual) subsets of X^r_vac(AF) in the named topology; X^r_vac(AF) minus G_r is meager
      definition_ref: genericity
    D2:
      definition: one-ended asymptotically flat vacuum initial data satisfying both constraint equations in the declared regularity class
      definition_ref: data_class
    D3:
      definition: proper future C2 vacuum extensions of the maximal development, in the exact sense of extension_predicate
      definition_ref: extension_predicate
  order_matters: true
  order_note: the comeager set is fixed independently of the data; the extension quantifier is a negated existential over extensions of the given development, not over data
  negation: there exists r in D0 such that for every comeager G_r subset X^r_vac(AF) there is (Sigma,h,K) in G_r whose maximal development admits a proper future C2 vacuum extension; equivalently the set of data admitting such an extension is non-meager.
  negation_normal_form: '{ r in D0 : { D in X : exists proper future C2 vacuum extension of MGHD(D) } is non-meager } is non-empty'
  quantifier_class: forall-exists(comeager)-forall-not-exists(extension)
class_boundary:
  provenance:
    harvested_from: schemas/af_scc_c2_vacuum.yaml
