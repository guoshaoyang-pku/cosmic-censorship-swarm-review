    status: input to the canonical revision; one sentence corrected
  one_class_only: AF-SCC-C2-VAC-GEN
  class_selector_meaning: the C2 token selects the differentiability class of the EXTENSION whose non-existence is asserted; it does not select the data regularity and does not denote the C0 formulation
  merge_forbidden: true
  one_way_implication: E(C0) entails E(C2) because every C2 extension is a C0 extension; the converse is forbidden (matches implication_ledger)
  import_rule: content from another class may appear only in anti_scope, variants or provenance, never in quantifiers, topology, genericity or conclusion
conventions:
  primary_direction: future
  past_variant: recorded separately; a past-direction instantiation must declare it and must not mix directions in one conclusion
  field_equations_on_extension: 'required: Ric(g'') = 0 classically on the extension'
  data_versus_extension_classes: the class-id token selects the extension class; data regularity is a separate axis
  proof_status: open_problem; this schema carries no truth value of its own
extension_predicate:
  name: proper_future_extension_in_class
  frozen_regularity: C2
  frozen_equation_concept: classical_ricci
  frozen_direction: future
  definition: 'A triple (M'', g'', iota) is a proper future C2 vacuum extension of (M,g) iff: (a) iota: M -> M'' is an isometric embedding (iota_* g = g'' restricted to iota(M)); (b) iota(M) is an open, proper subset of M''; (c) M'' is connected and time-orientable, and its time orientation restricts to that of M; (d) g'' is a C2 Lorentzian metric (signature (-,+,+,+), nondegenerate) on M''; (e) Ric(g'') = 0 holds classically at every point of M'' (g'' of class C2 makes Ric continuous, so this is a pointwise statement); (f) the extension adds points to the future: there exist q in iota(M) and p in M'' minus iota(M) with p in I^+(q; g'').'
  why_future_not_two_sided: one-ended AF data can be extendible to the PAST into a white-hole region without any failure of future determinism; two-sided inextendibility is a strictly stronger different statement and is registered as a variant, not folded into this class.
  must_not_conflate:
  - a bare metric extension with no equation requirement is not a counterexample here; the extension must satisfy Ric(g') = 0
  - global hyperbolicity of M' is NOT required; requiring it would be a strictly weaker different statement
  - the maximal development is maximal among globally hyperbolic developments; that is not the same as inextendible among all solutions, which is what this class asserts
  - the extension is not required to contain Sigma as a Cauchy surface or to be maximal in any sense
topology:
  spacetime_dimension: 4
  slice_topology: Sigma connected, oriented, complete Riemannian 3-manifold diffeomorphic to R^3 (exactly one asymptotically flat end)
  end_structure: one AF end
  completeness_of_slice: true
  conformal_boundary:
  - I+ (future null infinity)
  - I- (past null infinity)
  - i0 (spatial infinity)
  I_plus_topology: R x S^2
  development_topology: M globally hyperbolic, M diffeomorphic to Sigma x R, Sigma a Cauchy surface
  extension_topology: M' is a connected 4-manifold containing iota(M) as an open proper subset; M' is NOT assumed globally hyperbolic, compact, or AF
  forbidden:
  - closed or periodic spatial slice
  - more than one asymptotically flat end
  - assuming M' has any asymptotic structure (the extension may be non-AF; that is allowed)
  - assuming the Cauchy horizon has any smoothness or product structure
data_class:
  matter: none
  cosmological_constant: 0
  equations: Einstein vacuum equations Ric(g) = 0
  constraints:
    hamiltonian: R(h) - K_ij K^ij + (tr_h K)^2 = 0
    momentum: D^j (K_ij - (tr_h K) h_ij) = 0
  regularity_class:
    default: 'smooth-with-decay: h and K of class C^infinity with the numeric rates below'
    sobolev_variant:
      s: s > 5/2
      delta: delta in (1/2, 1)
      spaces: h - delta_ij in H^s_delta, K in H^{s-1}_{delta+1}
      status: standard_choice; UNVERIFIED citation
  asymptotic_decay:
    metric: h_ij - delta_ij = O(r^{-1}) and |d^k h| = O(r^{-1-k}) for 1 <= k <= s
    second_fundamental_form: K_ij = O(r^{-2}) and |d^k K| = O(r^{-2-k}) for 0 <= k <= s-1
    parity_conditions: not imposed
  symmetry: none_assumed
  adm_mass:
    exists: true
    sign: m_ADM >= 0 by the positive mass theorem
    citation_status: unresolved
    locator: to be supplied by L1
  gauge: no gauge fixed on the data; all predicates are diffeomorphism invariant
  diffeo_quotient: genericity is defined on data modulo asymptotically-identity diffeomorphisms; the quotient construction is a declared open technical gap (see unresolved_items)
regularity:
  data_regularity: smooth-with-decay default, or H^s_delta with s > 5/2, delta in (1/2,1)
  solution_regularity: g of class C^infinity(M) for smooth data (H^s_loc for the Sobolev variant); maximal globally hyperbolic development exists and is unique up to isometry
  i_plus_regularity: gtilde extends to I+ with C^k regularity, k >= 3; k is part of the assumption
  extension_regularity: C2
  extension_regularity_exact: the class token is exactly C2 (twice continuously differentiable metric; not C^{1,1}, not C1, not C0, not H2_loc as a class id, not smooth-only). Containment of extension sets runs E_C2 subset of E_{C^1,1} subset of E_H2loc subset of E_C0, which is why lower-regularity inextendibility entails this conclusion [R2 major]
  extension_solution_concept: classical_ricci
  must_not_conflate:
  - C-infinity extensions are also C2 extensions, so this class forbids them too; a class that forbade only smooth extensions would be different and weaker
  - 'C^{1,1} and H2_loc are DIFFERENT classes (separate tokens and nodes), but the extension sets are nested: E_C2 subset of E_{C^1,1} subset of E_H2loc subset of E_C0. A C2 metric has locally bounded curvature (C2 => C^1,1 => Riemann in L^infinity_loc => Riemann in L^2_loc), so H2_loc-inextendibility ENTAILS this class''s conclusion; see implication_ledger. [R2 major: the earlier ''no containment with C2 is asserted'' was wrong]'
  - 'a C0 result does not establish this class: it is stronger, and the implication runs C0 => C2 only (see implication_ledger)'
  - WCC content (I+ completeness, visibility) must not appear as the conclusion here
genericity:
  kind: residual_comeager
  ambient_space: the constraint manifold X^r_vac(AF) of one-ended asymptotically flat vacuum data, with the SUBSPACE topology induced from the weighted Sobolev product H^s_delta x H^{s-1}_{delta+1} (not the unconstrained product, under which X_vac would be meager and no G would exist). X_vac is a closed subset of a Banach space, hence Baire, so G is non-empty.
  topology_or_measure: subspace topology on the constraint manifold; Frechet topology for the smooth-with-decay class. The diffeomorphism quotient is not used to define comeagerness (open technical gap).
  generic_set: G = countable intersection of open dense subsets of X^r_vac(AF); complement meager; non-empty by Baire-ness
  excluded_set: meager; must contain (status unresolved) the stationary/axisymmetric Kerr data, whose maximal development DOES admit a C-infinity vacuum extension, plus self-similar and finite-dimensional analytic families
  excluded_set_status: unresolved
  is_part_of_class: true
  class_change_warning: genericity is part of the class identity. The comeager form is this class. 'For all data' is strictly stronger. The dense-open form is ALSO strictly stronger, because a dense open set is comeager (it is the countable intersection of the constant family). The comeager form does not imply the dense-open form (a comeager set can have empty interior). No strengthening may be substituted silently.
  transfer_failures:
  - pair:
    - residual_comeager
    - full_measure
    direction: no_transfer
    witness: let C = intersection over n of open dense U_n with measure < 1/n; C is comeager and null, so comeagerness does not yield full measure [R1 F03]
    status: standard_fact
    citation_status: unresolved
  - pair:
    - full_measure
    - residual_comeager
    direction: no_transfer
    witness: the complement of the comeager null set above is meager with full measure; the irrationals are both and witness nothing [R1 F03]
    status: standard_fact
    citation_status: unresolved
  - pair:
    - residual_comeager
    - finite_codimension_complement
    direction: no_transfer
    witness: a fat Cantor set is meager with positive measure, hence not covered by countably many finite-codimension submanifolds
    status: elementary
    citation_status: n/a
  - pair:
    - residual_comeager
    - open_dense_escape
    direction: no_transfer
    witness: 'the irrationals are comeager with empty interior: a comeager set need not contain any nonempty open subset, so the comeager form does not yield a dense-open form'
    status: standard_fact
    citation_status: unresolved
  transfer_holds:
  - pair:
    - open_dense_escape
    - residual_comeager
    direction: transfers
    witness: a dense open set U is the countable intersection of the constant family {U}, hence comeager; the dense-open form implies the comeager form
    status: elementary
    citation_status: n/a
  - pair:
    - finite_codimension_complement
    - residual_comeager
    direction: transfers
    witness: a proper closed finite-codimension submanifold is closed and nowhere dense, so a countable union of them is meager; if the exceptional set is so covered, the property holds on a comeager set
    status: elementary
    citation_status: n/a
  variants:
  - kind: open_dense_escape
    statement_strength: strictly_stronger
    is_this_class: false
    relation: implies residual_comeager
  - kind: dense_escape
    statement_strength: strictly_weaker
    is_this_class: false
    relation: 'implied by residual_comeager in a Baire space (a comeager set is dense); a dense set need not be comeager, so it is strictly weaker than the class default. [R2-16 corrected: was off-vocabulary and mislabelled incomparable]'
  - kind: full_measure
    statement_strength: incomparable
    is_this_class: false
    requires: a specified measure on X, e.g. a Gaussian measure induced by the constraint map
  - kind: none
    statement_strength: strictly_stronger
    is_this_class: false
non_vacuity:
  condition: the class must be applied to data whose maximal development is not future geodesically complete. The expectation that a future-complete development admits no proper future extension is a proof obligation, NOT an elementary fact (see c2_specific_note); if it fails, the class would be vacuous on complete developments and must be revised rather than cited.
  witness_type: one-parameter family in G whose development contains a future trapped surface, hence is future geodesically incomplete
  status: trapped-surface formation is standard; membership of the family in G is UNVERIFIED here
  vacuity_falsifier: if the class is cited for data whose development is future geodesically complete, the citation is vacuous and must be rejected
  c2_specific_note: the vacuity argument (a future geodesically complete development admits no proper future extension) is ASSERTED here as a proof obligation, NOT as an established fact. The one-line reason (a maximal geodesic of the complete development cannot terminate at a boundary point of the extension) needs a Lorentzian-distance / causality step in M-prime, and M-prime is NOT assumed globally hyperbolic, so the step is not free. No counterexample is known in the frozen AF Lambda=0 class; the claim is marked UNVERIFIED pending a derivation or an L1 source. [R2 major accepted]
  c2_vacuity_argument_status: unverified_proof_obligation
i_plus:
  role: assumption
  in_conclusion: false
  completeness_in_conclusion: false
  definition: AF structure at future null infinity is used only to define the data class and the notion of the maximal development; I+ appears nowhere in the conclusion of this class
  forbidden:
  - asserting I+ completeness as part of this class conclusion
  - importing the WCC I+ predicate as the falsifier of this class
visibility:
  role: not_in_conclusion
  reason: visibility from I+ is the WCC predicate. This SCC class asserts non-extendibility of the maximal development, which is a statement about the future boundary of the development, not about causal relations to future null infinity.
  visible_singularity_is_wcc: true
  forbidden_falsifier: a visible incomplete causal geodesic is a WCC falsifier; it is NOT the falsifier of this class
  derived_note: inextendibility of the development entails that no extension removes the boundary; that remark is not the class conclusion and may not be cited as one
conclusion:
  conclusion_type: scc_c2_future_inextendibility
  epistemic_status: open_problem
  family: SCC
  statement_natural_language: Generic asymptotically flat vacuum initial data have a maximal globally hyperbolic development.
  statement_formal: 'forall r in D0 exists G_r comeager forall D in G_r: MGHD(D) is a globally hyperbolic 4-manifold'
  equivalent_rephrasings:
  - phrasing: the maximal development is future inextendible in the C2 class
    status: equivalent by definition of extension_predicate
  - phrasing: no Cauchy horizon of the development can be crossed by a C2 vacuum extension
    status: informal, UNVERIFIED as an equivalence
  known_obstruction: 'the exact stationary (Kerr) vacuum data admit a C-infinity vacuum extension, so the unqualified statement over ALL AF vacuum data is false; the class is only meaningful with the generic quantifier, and the excluded (extendible) family must be shown meager. Any use of this class must therefore keep ''generic'' in the statement. citation_status: unresolved (L1 owns the anchor).'
  forbidden_strengthenings:
  - C0 or C1 or H2_loc inextendibility (different classes)
  - two-sided inextendibility (different, stronger statement)
  - the statement for ALL AF vacuum data (false if the Kerr obstruction is as stated)
  - global hyperbolicity of the extension being required (a different, weaker statement)
  - I+ completeness or asymptotic predictability (WCC content)
  forbidden_weakenings:
  - dropping the generic quantifier in practice while keeping the word
  - requiring only inextendibility among globally hyperbolic extensions (a strictly weaker statement)
  - allowing extensions that do not satisfy Ric = 0
  - using the C2 token for the C^1,1, C1 or H2_loc classes
  forbidden_strengthenings_addition: two-sided inextendibility is a DIFFERENT, STRICTLY STRONGER statement (it also forbids past extensions). An earlier revision mislabelled it here as a weakening; it must be registered as its own class variant. [R2 minor]
  claim_promotion: epistemic_status=open_problem; theorem requires artifact_refs with a checked proof
implication_ledger:
  extension_class_containment: 'E_C2 subset of E_{C^1,1} subset of E_H2loc subset of E_C0 (nested extension sets): the lower the required regularity, the larger the set of admissible extensions, hence the stronger the inexistence statement. [R2 major: the earlier revision had the H2_loc ordering wrong]'
  one_way_entailments:
  - from: no proper future C0 extension
    to: no proper future C2 extension
    relation: entails
    reason: E_C2 subset of E_C0, so C0-inextendibility is stronger
    status: elementary
  - from: no proper future C^1,1 extension
    to: no proper future C2 extension
    relation: entails
    reason: E_C2 subset of E_{C^1,1}
    status: elementary
  - from: no proper future H2_loc extension
    to: no proper future C2 extension
    relation: entails
    reason: 'a C2 metric has locally bounded Riemann curvature, hence locally square-integrable curvature, so E_C2 subset of E_H2loc; H2_loc-inextendibility is stronger than this class. [R2 major corrected: this entailment was wrongly listed as forbidden]'
    status: standard_fact
    citation_status: unresolved
  forbidden_transfers:
  - from: no proper future C2 extension
    to: no proper future C0 extension
    reason: the converse containment is false
  - from: no proper future C2 extension
    to: no proper future H2_loc extension
    reason: the converse containment is false; C2-inextendibility is weaker than H2_loc-inextendibility
  - from: AF-WCC-VAC-GEN
    to: this class
    reason: visibility and inextendibility are logically independent as stated; no transfer may be assumed
  omitted_and_recorded: C^1,1 and C1 extension classes are separate axis values; the chain above covers the implications licensed from them to this class.
  cross_family: no WCC <-> SCC transfer is licensed by this artifact
falsifier:
  tier_1:
    refutes: AF-SCC-C2-VAC-GEN
    witness_type: an open (or at least non-meager) set of one-ended AF vacuum data whose maximal developments admit proper future C2 vacuum extensions, with the extension exhibited (an explicit family, not a numerical near-solution)
    genericity_requirement: 'tier 1 refutes the class by showing the EXTENDIBLE set is non-meager (equivalently: it meets every comeager set). One extendible datum is NOT sufficient in general because G is existentially quantified and individual membership is undecided. Route R1 = non-meagerness (general); route R2 = a datum in an explicitly instantiated generic set G* (instantiated claims only). [R1 F01 accepted]'
    proof_obligations:
    - non-meagerness of the extendible set (general route R1)
    - the extension is a proper future extension in the frozen class
    - D in G* (membership), needed only for the instantiated route R2
    machine_checkable_steps:
    - constraint residuals below tolerance
    - the extension's metric is C2 across the boundary and Ric = 0 holds at sample points
    - the extension map iota is an isometry onto an open proper subset
    - the added points lie in the future of iota(M)
    non_machine_checkable_step: non-meagerness of the extendible set
  tier_2:
    refutes: only the strictly stronger class 'forall AF vacuum data'
    witness_type: one AF vacuum data set (e.g. exact Kerr data) with an exhibited proper future C2 vacuum extension
    labelling_required: refutes_strengthening_only
  schema_falsifiers:
  - 'a statement is bound to this class whose conclusion is really C0 or H2_loc inextendibility: conclusion inflation'
  - 'a statement is bound to this class whose falsifier is a visible singularity: wrong-family falsifier'
  - 'the class is cited for a future-complete development: vacuous citation'
  - 'the extension is not required to solve Ric = 0: weaker statement bound to the wrong class'
anti_scope:
  not_this_class:
  - class_id: AF-SCC-C0-VAC-GEN
    why: different (stronger) extension class; the word 'inextendible' alone does not identify either class
  - class_id: AF-WCC-VAC-GEN
    why: visibility/predictability content, not extendibility
  - class_id: AF-WCC-SCALAR-SPH
    why: different matter and symmetry
  - kind: regularity_axis_variant
    class_id: AF-SCC-C0-VAC-GEN
    why: the H2_loc extension class is a VARIANT of the C0 class (parent_class AF-SCC-C0-VAC-GEN, variant_id H2LOC in VARIANT_REGISTRY.json), not a separate class id
  - kind: extension_direction_variant
    class_id: AF-SCC-C2-VAC-GEN
    why: the two-sided extension class is a VARIANT of this class (parent_class AF-SCC-C2-VAC-GEN, variant_id TWOSIDED in VARIANT_REGISTRY.json); extension direction is a frozen axis
  phrases_that_are_not_this_class:
  - any 'C0 or C2' composite regularity
  - '''inextendible'' with no regularity token'
  - '''the singularity is not visible'' (WCC phrasing)'
