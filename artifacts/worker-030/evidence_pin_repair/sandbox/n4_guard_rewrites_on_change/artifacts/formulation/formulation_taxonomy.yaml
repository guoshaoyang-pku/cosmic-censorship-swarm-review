implication_ledger:
- from: AF-SCC-C0-VAC-GEN
  to: AF-SCC-C2-VAC-GEN
  relation: entails
  status: 'elementary (extension-class containment: every C2 extension is a C0 extension)'
  direction: one_way
- from: AF-SCC-C2-VAC-GEN
  to: AF-SCC-C0-VAC-GEN
  relation: does_not_entail
  status: forbidden transfer; the converse is not available
  direction: forbidden
- from: bare C0 metric inextendibility
  to: distributional-Ricci C0 inextendibility
  relation: entails
  status: elementary (fewer allowed extensions in the latter)
  direction: one_way
- from: AF-WCC-VAC-GEN
  to: AF-SCC-C2-VAC-GEN
  relation: independent_or_unresolved
  status: unresolved; neither implication direction may be assumed
  direction: unresolved
- from: H2_loc inextendibility
  to: AF-SCC-C2-VAC-GEN
  relation: entails
  status: 'E_C2 subset of E_H2loc: a C2 metric has locally bounded, hence locally
    square-integrable, curvature. [R2 major corrected]'
  direction: one_way
- from: H2_loc inextendibility
  to: AF-SCC-C0-VAC-GEN
  relation: does_not_entail
  status: H2_loc requires more regularity than C0, so it is the weaker statement
  direction: forbidden
- from: C^{1,1} inextendibility
  to: AF-SCC-C2-VAC-GEN
  relation: entails
  status: E_C2 subset of E_{C^1,1}
  direction: one_way
