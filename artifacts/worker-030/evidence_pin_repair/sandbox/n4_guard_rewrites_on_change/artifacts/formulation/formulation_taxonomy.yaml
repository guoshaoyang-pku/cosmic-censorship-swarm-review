terminology_disambiguation:
  WCC: weak cosmic censorship (visibility/predictability of singularities from future
    null infinity I+); NOT weakly connected components
  SCC: strong cosmic censorship (future inextendibility of the maximal development);
    NOT strongly connected components
  observed_risk: runtime/logs/astra-lead-literature.log reads WCC/SCC as weakly/strongly
    connected components; this taxonomy is the binding disambiguation for the fleet
  I_plus: future null infinity, the conformal boundary R x S^2 approached by future-directed
    null geodesics
frozen_classes:
- AF-WCC-VAC-GEN
- AF-SCC-C2-VAC-GEN
- AF-SCC-C0-VAC-GEN
- AF-WCC-SCALAR-SPH
class_contracts:
  AF-WCC-VAC-GEN:
    node_id: F1
    components:
      asymptotics: AF
      censorship: WCC
      matter: VAC
      genericity: GEN
      regularity_token: none
    ambient_theory: 4-dimensional Einstein vacuum equations, Lambda = 0, classical
      smooth solutions
    hypotheses:
    - 'initial data (Sigma, h, K): Sigma connected, oriented, complete, Sigma diffeomorphic
      to R^3 (exactly one asymptotically flat end)'
    - 'vacuum constraint equations: R(h) - |K|^2 + (tr_h K)^2 = 0 and div_h(K - (tr_h
      K) h) = 0'
    - 'asymptotically flat decay at the rates named in F1 data_class (default: smooth-with-decay,
      numeric rates per derivative order; Sobolev variant s > 5/2, weight delta)'
    - data lies in the declared generic set (residual/comeager in the named topology);
      genericity is part of the class, not a weakening
    - M = MGHD(Sigma,h,K) exists, is unique up to isometry, globally hyperbolic with
      Cauchy surface Sigma
    exclusions:
    - matter of any kind, Lambda != 0, more than one AF end, non-complete or closed/periodic
      slices
    - data outside the declared generic set (stationary/axisymmetric data, self-similar
      data, data in the exactly-extendible family) - they are non-generic members
      of a DIFFERENT class
    - conclusions about C2 or C0 inextendibility (those are SCC classes), and conclusions
      that the black-hole region is non-empty (separate black-hole-formation statement)
    - spherical symmetry or scalar matter (class AF-WCC-SCALAR-SPH)
    conclusion_type: weak_cosmic_censorship
    conclusion_predicate: AF at I+ and I+ complete and no future-incomplete causal
      geodesic visible from I+
    non_goals:
    - black hole formation
    - inextendibility
    - geodesic completeness of M
    - absence of singularities
    positive_test_case:
      description: Smooth one-ended AF vacuum data on Sigma = R^3, ADM mass > 0, decay
        at the declared rates, member of the declared generic set, whose MGHD contains
        a future trapped surface.
      must_classify_as: AF-WCC-VAC-GEN
    negative_test_case:
      description: A claim that the maximal development of generic AF data is future-inextendible
        as a C0 Lorentzian manifold.
      must_classify_as: AF-SCC-C0-VAC-GEN
      reason: the conclusion is a C0 inextendibility statement, i.e. strong censorship
        content; it must not be bound to the WCC class
  AF-SCC-C2-VAC-GEN:
    node_id: F2a
    components:
      asymptotics: AF
      censorship: SCC
      matter: VAC
      genericity: GEN
      regularity_token: C2
    ambient_theory: 4-dimensional Einstein vacuum equations, Lambda = 0, classical
      solutions; extension class C2
    hypotheses:
    - same AF one-ended vacuum initial-data hypotheses as AF-WCC-VAC-GEN
    - 'the extension class under test is exactly C2: a proper future extension (M'',g'')
      with g'' in C2, Lorentzian, Ric(g'') = 0 classically, M open in M'''
    - 'a non-vacuity witness is required: data in the class whose development is not
      geodesically complete, so inextendibility is not vacuous'
    exclusions:
    - C0, C1, C^{1,1}, H^2_loc or smooth extension classes (C2 is a single frozen
      regularity; C-infinity extensions ARE C2 extensions, so excluding them would
      be a different statement)
    - extensions that do not solve the vacuum equations (a bare metric extension is
      not a counterexample here)
    - 'two-sided/white-hole extensions used as if they were failures of future determinism:
      the class is FUTURE inextendibility, because the past of an AF slice can be
      extendible into a white-hole region'
    - visibility/I+ completeness conclusions (WCC content); the class says nothing
      about what an observer at I+ sees
    conclusion_type: scc_c2_future_inextendibility
    conclusion_predicate: no proper future extension of the MGHD in the C2 vacuum
      class exists
    non_goals:
    - C0 inextendibility
    - I+ completeness
    - asymptotic predictability
    - black hole formation
    - any claim that the singularity is visible or invisible
    positive_test_case:
      description: 'Generic one-ended AF vacuum data with ADM mass > 0 whose MGHD
        is not geodesically complete, together with the assertion: the MGHD has no
        proper future C2 vacuum extension.'
      must_classify_as: AF-SCC-C2-VAC-GEN
    negative_test_case:
      description: A result proved by exhibiting the absence of any continuous (C0)
        Lorentzian extension of the MGHD.
      must_classify_as: AF-SCC-C0-VAC-GEN
      reason: C0-inextendibility is a strictly stronger statement at lower regularity;
        binding it to the C2 class inflates the C2 conclusion
  AF-SCC-C0-VAC-GEN:
    node_id: F2b
    components:
      asymptotics: AF
      censorship: SCC
      matter: VAC
      genericity: GEN
      regularity_token: C0
    ambient_theory: 4-dimensional Einstein vacuum equations, Lambda = 0; extension
      class C0 (continuous Lorentzian metric), with the equation requirement frozen
      separately
    hypotheses:
    - same AF one-ended vacuum initial-data hypotheses as AF-WCC-VAC-GEN
    - 'the extension class under test is exactly C0: a proper future extension (M'',g'')
      with g'' continuous, Lorentzian (nondegenerate, signature (-,+,+,+)), and M
      open in M'''
    - 'declared equation requirement: none (bare continuous metric extension); the
      distributional-Ricci variant is a DIFFERENT weaker class and may not be substituted'
    - a non-vacuity witness is required (development not geodesically complete)
    exclusions:
    - C2, C^1, C^{1,1}, H^2_loc smoothness assumptions smuggled in as 'C0'
    - extensions satisfying the vacuum equations distributionally when the class is
      the bare-metric variant, and conversely (the two variants are separate classes)
    - visibility/I+ completeness conclusions (WCC content)
    - two-sided extension direction (frozen to future; the past can be extendible
      into a white hole)
    class_identity_variants:
      frozen_broad_statement: no proper future extension with a merely continuous
        Lorentzian metric (any future boundary) - the class frozen in artifacts/formulation/schemas/af_scc_c0_vacuum.yaml
      horizon_localized_variant:
        variant_id: CH
        parent_class: AF-SCC-C0-VAC-GEN
        status: registered_variant_not_written
        statement: inextendible as a continuous Lorentzian manifold ACROSS ITS CAUCHY
          HORIZON
        addressed_by:
        - D-002
        - T-301
        why_separate: L1's verified D-002 records the C0 formulation in this form;
          L1's conditional refutation T-301 (interior data, conditional on Kerr exterior
          stability, preprint-level antecedent) binds the variant, not the broad frozen
          class. Binding either way is a scope error. Registered as a variant (parent_class
          + variant_id), NOT a class id, per astra-classscope-02.
    data_class_freeze: smooth-with-decay default with a registered Sobolev variant
      (s > 5/2, delta in (1/2,1)), identical across F1/F2a/F2b; rule_spec v1.3. Worker
      drafts that freeze H^4_{1/2+eps} are divergent and superseded.
    conclusion_type: scc_c2_future_inextendibility
    conclusion_predicate: no proper future extension of the MGHD in the C0 Lorentzian
      class (bare continuous metric) exists
    non_goals:
    - C2 inextendibility
    - I+ completeness
    - asymptotic predictability
    - distributional-solution inextendibility
    - visibility
    positive_test_case:
      description: 'Generic one-ended AF vacuum data with ADM mass > 0 whose MGHD
        is not geodesically complete, together with the assertion: no proper future
        extension with continuous Lorentzian metric exists.'
      must_classify_as: AF-SCC-C0-VAC-GEN
    negative_test_case:
      description: A result that exhibits an extension with locally square-integrable
        curvature (H^2_loc) and concludes inextendibility in that class.
      must_classify_as: variant H2LOC of AF-SCC-C0-VAC-GEN (parent_class AF-SCC-C0-VAC-GEN,
        variant_id H2LOC; not a class id)
      reason: H^2_loc is strictly between C2 and C0; treating it as either is the
        single most likely scope error in this portfolio
  AF-WCC-SCALAR-SPH:
    node_id: unmapped (N0 depends on F0 only)
    components:
      asymptotics: AF
      censorship: WCC
      matter: massless scalar field
      symmetry: spherical
      genericity: GEN
      regularity_token: none
    ambient_theory: 4-dimensional Einstein-massless-scalar-field system, Lambda =
      0, spherical symmetry
    hypotheses:
    - spherically symmetric AF initial data with a regular center, scalar field in
      the declared weighted class
    - genericity in the spherically symmetric constraint manifold (a different ambient
      space from the vacuum case)
    exclusions:
    - vacuum data without symmetry, non-spherical data, and any conclusion imported
      from the vacuum class
    - C2/C0 inextendibility conclusions (SCC content)
    conclusion_type: weak_cosmic_censorship
    conclusion_predicate: no future-incomplete causal geodesic visible from I+ (the
      spherical version of the WCC predicate)
    non_goals:
    - SCC
    - black hole formation
    - stability of the spherical symmetry
    positive_test_case:
      description: Spherically symmetric AF Einstein-massless-scalar-field data with
        regular center in the declared generic set.
      must_classify_as: AF-WCC-SCALAR-SPH
    negative_test_case:
      description: Generic one-ended AF vacuum data with no symmetry.
      must_classify_as: AF-WCC-VAC-GEN
      reason: matter and symmetry are part of the class identity; the vacuum class
        may not absorb scalar-field results
axis_registry:
  note: axes that vary across the literature and MUST be frozen per class; conflating
    two values is class leakage
  regularity_axis:
    values:
    - C2
    - C0
    - H2_loc
    - C1
    - C1_1
    - C_infinity
    frozen:
      AF-SCC-C2-VAC-GEN: C2
      AF-SCC-C0-VAC-GEN: C0
    containment: 'extension sets are nested E_C2 subset of E_{C^1,1} subset of E_H2loc
      subset of E_C0, so statement strength runs the other way: C0-inextendibility
      entails H2_loc-inextendibility entails C2-inextendibility. [Corrected after
      R2: the earlier ''H2_loc incomparable with C2'' / ''strictly inside C0'' wording
      had the ordering wrong.]'
  extension_direction:
    values:
    - future
    - two_sided
    frozen:
      AF-SCC-C2-VAC-GEN: future
      AF-SCC-C0-VAC-GEN: future
    reason: one-ended AF data can be extendible to the past into a white-hole region
      without any failure of future determinism
  extension_equation_requirement:
    values:
    - classical_ricci
    - distributional_ricci
    - none
    frozen:
      AF-SCC-C2-VAC-GEN: classical_ricci
      AF-SCC-C0-VAC-GEN: none
    containment: classical_ricci subset distributional_ricci subset bare C0 metric
      extensions, so bare-metric inextendibility is the STRONGEST of the three
  development_type:
    values:
    - MGHD_one_ended_AF
    - maximal_analytic_extension
    - two_ended_bridge
    frozen:
      AF-SCC-C2-VAC-GEN: MGHD_one_ended_AF
      AF-SCC-C0-VAC-GEN: MGHD_one_ended_AF
  genericity_axis:
    values:
    - residual_comeager
    - full_measure
    - open_dense_escape
    - finite_codimension_complement
    - none
    frozen:
      AF-WCC-VAC-GEN: residual_comeager
      AF-SCC-C2-VAC-GEN: residual_comeager
      AF-SCC-C0-VAC-GEN: residual_comeager
      AF-WCC-SCALAR-SPH: unresolved
    scalar_note: the spherical-scalar class has no schema node yet; its genericity
      notion is left UNRESOLVED and owned by that future node. The three vacuum classes
      freeze residual_comeager. This matches research_map/formulation_taxonomy.yaml
      (worker-01 rev3), which records genericity as provisional for this class.
    warning: not interchangeable; see genericity.transfer_failures in each schema
      and artifacts/flash-15/genericity/genericity_matrix.json
    containment: open_dense_escape implies residual_comeager (a dense open set is
      the countable intersection of the constant family); residual_comeager does NOT
      imply open_dense_escape (a comeager set can have empty interior). dense_escape
      is implied by residual_comeager in a Baire space and implies nothing back. full_measure
      is incomparable with all topological notions. Corrected after flash-15 found
      the earlier reverse claim to be a mathematical error.
disjointness_matrix:
  rule: the four classes are pairwise disjoint as statement classes; membership requires
    every frozen axis, not only the name
  pairwise:
  - - AF-WCC-VAC-GEN
    - AF-SCC-C2-VAC-GEN
    - 'disjoint: censorship kind (WCC vs SCC) and conclusion family'
  - - AF-WCC-VAC-GEN
    - AF-SCC-C0-VAC-GEN
    - 'disjoint: censorship kind and conclusion family'
  - - AF-WCC-VAC-GEN
    - AF-WCC-SCALAR-SPH
    - 'disjoint: matter content and symmetry (different ambient space, different genericity
      manifold)'
  - - AF-SCC-C2-VAC-GEN
    - AF-SCC-C0-VAC-GEN
    - 'disjoint: extension regularity token; C2 != C0; the phrase ''C0 or C2'' is
      forbidden as a class name'
  - - AF-SCC-C2-VAC-GEN
    - AF-WCC-SCALAR-SPH
    - 'disjoint: matter, symmetry, censorship kind'
  - - AF-SCC-C0-VAC-GEN
    - AF-WCC-SCALAR-SPH
    - 'disjoint: matter, symmetry, censorship kind'
  composite_regularity_ban: no artifact may use 'C0 or C2', 'C2 or C0', 'C2/C0' or
    any merged regularity as a single class
