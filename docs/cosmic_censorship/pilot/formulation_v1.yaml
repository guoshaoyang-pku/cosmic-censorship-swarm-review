version: 1
status: draft-for-audit
scope:
  dimension: 4
  equations: vacuum Einstein Ric(g)=0
  topology: Sigma connected oriented 3-manifold with one asymptotically Euclidean end
  initial_data: smooth maximal vacuum data satisfying the constraint equations
  development: maximal globally hyperbolic Cauchy development modulo diffeomorphism
weak:
  target: future null infinity I+ exists with declared conformal regularity
  genericity: open dense or residual subset in a declared weighted Sobolev topology
  visibility: a causal curve from every neighborhood of the singular endpoint reaches I+
  singularity: C2-inextendibility and curvature blow-up are separate variants
  claim: generic data have no singularity visible from I+
strong:
  genericity: same topology and genericity notion as weak version
  extension_thresholds: [C2, C0, weak-Einstein-Christoffel-L2]
  claim: generic maximal Cauchy developments have no proper extension in the declared class
required_freezes:
  - weighted Sobolev indices, AF decay, and parity
  - conformal definition and regularity of I+
  - exact genericity topology or measure
  - singularity and visibility quantifiers
  - extension class and weak Einstein equation
forbidden_inferences:
  - symmetric matter naked singularity refutes 4D vacuum WCC
  - curvature blow-up implies nakedness
  - C0 extendibility refutes every SCC formulation
  - finite-grid visibility proves visibility at I+
