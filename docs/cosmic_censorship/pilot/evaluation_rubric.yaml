version: 1
dimensions:
  mathematical_correctness: 0-5
  formulation_completeness: 0-5
  scope_and_non_overclaiming: 0-5
  citation_verifiability: 0-5
  reproducibility: 0-5
  executability: 0-5
  novelty_or_information_gain: 0-5
  efficiency: 0-5
hard_failures:
  - conflates WCC and SCC
  - treats curvature blowup as nakedness without causal visibility
  - presents unverified citation as theorem
  - generalizes symmetry-restricted or matter-specific result to vacuum 4D
  - reports model output as proof or refutation
  - omits initial-data class or genericity definition
  - no independent artifact or falsifier for numerical claim
score_policy: any hard failure caps result at grade C; two or more caps at grade D
grades:
  A: score >= 34 and no hard failure
  B: score >= 27 and at most one minor caveat
  C: score >= 18; planning or suggestive evidence only
  D: score < 18 or hard failure that invalidates the central claim
