version: 1
purpose: exhaustive-enough problem matrix for swarm coverage and audit
dimensions:
  spacetime_dimension: [3+1, higher_dimensional]
  gravitational_model: [vacuum_Einstein, Einstein_scalar, Einstein_Maxwell, Einstein_Vlasov, Einstein_Yang_Mills, Einstein_fluid, modified_gravity]
  asymptotics: [asymptotically_flat, de_Sitter, anti_de_Sitter, cosmological_compact, finite_boundary]
  symmetry: [none, spherical, axial, Gowdy_or_other_reduced, perturbative_Kerr]
  topology: [R3_one_end, multiple_ends, nontrivial_topology]
  initial_data: [smooth_compact_support, weighted_Sobolev, finite_energy_weak, characteristic_data]
  genericity: [open_dense, residual, full_measure, codimension_statement, stability_only, unspecified_forbidden]
  singularity: [geodesic_incompleteness, curvature_invariant_blowup, trapped_surface_boundary, Cauchy_horizon, weak_null_singularity]
  visibility: [future_null_infinity, timelike_infinity, finite_asymptotic_observer, domain_of_outer_communications, causal_boundary]
  predictability: [MGHD_global_hyperbolicity, C2_inextendibility, C0_inextendibility, weak_Einstein_inextendibility, curvature_L2_condition]
  conclusion_type: [theorem, conditional_theorem, stability_result, counterexample, numerical_evidence, formal_model, open_problem]

priority_classes:
  - id: AF-WCC-VAC-GEN
    statement: 4D asymptotically-flat vacuum weak censorship for generic weighted initial data
    status: central open target; formulation needs exact genericity and null-infinity regularity
  - id: AF-SCC-C2-VAC-GEN
    statement: C2 strong censorship for generic 4D AF vacuum data
    status: central open target
  - id: AF-SCC-C0-VAC-GEN
    statement: C0 strong censorship for generic 4D AF vacuum data
    status: distinct harder/possibly different target; never merge with C2
  - id: AF-WCC-SCALAR-SPH
    statement: spherical Einstein-massless-scalar visibility/critical-collapse benchmark
    status: calibration model; not a vacuum-WCC test
  - id: AF-SCC-SCALAR-SPH
    statement: spherical scalar MGHD extension and naked-singularity stability
    status: model-specific theorem/benchmark family
  - id: KERR-SCC-INNER
    statement: stability, Cauchy horizon and mass inflation in perturbed Kerr
    status: perturbative/internal strong-censorship family
  - id: AF-WCC-EM
    statement: charged Einstein-Maxwell collapse and naked singularity/cosmic censorship
    status: separate matter-model family
  - id: D-SCC
    statement: positive-Lambda de Sitter strong censorship variants
    status: separate asymptotic family
  - id: ADS-CENSORSHIP
    statement: AdS timelike-boundary censorship and boundary conditions
    status: separate causal-boundary family
  - id: HIGH-D-WCC
    statement: higher-dimensional censorship and black-ring/instability cases
    status: separate dimension family
  - id: LOW-REG-WEAK-EINSTEIN
    statement: extension/inextendibility when Einstein equations hold only weakly
    status: regularity-definition family
  - id: CRITICAL-COLLAPSE
    statement: codimension and stability of critical naked-singularity solutions
    status: mechanism/stability family

coverage_rule: every swarm claim must name one class id and may not generalize across dimensions, matter, asymptotics, symmetry, or regularity without a proved implication.
