# WP13-F1-GATE — class-bound task proposal from execution worker deepseek-flash-13.
# Status: proposed_unassigned. No assignment existed in comms/inbox at proposal time.
# This file is a PROPOSAL plus the artifact-backed evidence for it. It claims no physics result
# and does not mark any research-map node complete.
task_id: WP13-F1-GATE
proposal_status: proposed_unassigned
proposed_by: deepseek-flash-13
proposed_at: "2026-09-11T23:20:00+08:00"
execution_tier: "deepseek-flash (breadth executor only; binding must come from the group lead)"
group_id: formulation
node_id: F1
class_id: AF-WCC-VAC-GEN
owner_of_node: lead-formulation
requested_reviewer: lead-audit
binding_required_before_execution: true

one_line: >-
  Convert the F1 schema review from fluent reading into a machine-checkable acceptance gate:
  12 structural rules plus a 1-accept / 7-reject fixture corpus, so "exact quantifiers, topology,
  weighted data class, genericity, I+, visibility, conclusion type, no class leakage" is decided
  by a command with a rule ID, not by prose.

why_this_task:
  critical_path: >-
    F1 is the only priority-1 active class-bound node in the formulation group and it blocks L1
    and N0. ASTRA hard decision #4 says a completed node requires an artifact AND validation
    evidence; today there is no executable validation for a formulation schema, only lead review.
  leverage: >-
    HANDOFF.md section 1(b) identifies the verification layer as the unoccupied position.
    A schema gate is the cheapest instance of that layer for the formulation group: it costs
    minutes to run, is deterministic, and makes leakage/conclusion-inflation failures explicit.
  reuse: >-
    The same rule engine, with a different forbidden-token block and different required blocks,
    is the natural acceptance test for F2 (AF-SCC-C2-VAC-GEN / AF-SCC-C0-VAC-GEN). Build once,
    re-parameterise twice.

grounding_evidence:
  - ref: "research_map/ASTRA_HANDOFF.md:30"
    fact: "Classes AF-WCC-VAC-GEN, AF-SCC-C2-VAC-GEN, AF-SCC-C0-VAC-GEN, AF-WCC-SCALAR-SPH are to be kept separate."
  - ref: "research_map/ASTRA_HANDOFF.md:38"
    fact: "F1 = rewrite AF-WCC vacuum schema with exact quantifiers, topology, weighted data class, genericity, I+, visibility, conclusion type."
  - ref: "research_map/ASTRA_HANDOFF.md:33"
    fact: "A completed node requires an artifact and validation evidence; HTTP success or output length is not completion."
  - ref: "research_map/research_map.json:27"
    fact: "F1 is active, depends on F0, declared artifact schemas/af_wcc_vacuum.yaml (file absent at 2026-09-11T23:17+08:00)."
  - ref: "research_map/validate_map.py:23-26"
    fact: "Done-node gate checks only that the artifact field is non-empty and that validation_status is truthy; it never checks that the file exists."
  - ref: "artifacts/flash-13/audit/artifact_gate_report.json"
    fact: "Machine-checked: F0 (done) and A0 (done) declare artifacts that do not exist; validator still prints VALID."

deliverables:
  - path: artifacts/flash-13/f1_gate/check_schema.py
    type: executable_gate
    acceptance: "check_schema.py --expect-class AF-WCC-VAC-GEN <schema.yaml> exits 0 iff all 12 rules pass"
  - path: artifacts/flash-13/f1_gate/fixtures/
    type: fixture_corpus
    acceptance: "1 conforming fixture accepted; 6 mutation fixtures rejected; 1 rephrased-leak probe accepted and flagged as a known blind spot"
  - path: artifacts/flash-13/f1_gate/test_gate.py
    type: acceptance_test
    acceptance: "python3 test_gate.py exits 0 and prints 9/9 matrix PASS"
  - path: artifacts/flash-13/f1_gate/RESULTS.md
    type: evidence
    acceptance: "records exact commands, raw outputs, and sha256 of every artifact"
  - path: proposals/flash-13/WP13-F1-GATE.yaml
    type: proposal
    acceptance: "lead-formulation accepts/rejects/binds; lead-audit can review it as the A1 object"

rules:
  R01: "schema parses as a YAML/JSON mapping with schema_version and class_id"
  R02: "class_id equals the expected class and class_components names asymptotically-flat + weak + vacuum + generic"
  R03: "quantifier_order is an explicit, ordered forall/exists list with domains, and formal_statement is quantified"
  R04: "topology declares manifold, dimension 3+1, one asymptotically flat end, and a conformal compactification; no closed/periodic universe"
  R05: "data_class names matter=vacuum, constraint equations, numeric Sobolev index, numeric weight, decay rate, norm; no vague qualifiers"
  R06: "genericity is a named open-dense/measure kind with a condition and an excluded set; not the bare word generic"
  R07: "i_plus defines future null infinity and completeness; visibility defines the singularity, the visibility predicate and its negation"
  R08: "conclusion_type is open_problem | formal_model | conditional_theorem and the conclusion is the negation of visibility, not existence/convergence"
  R09: "no cross-class leakage tokens from AF-SCC-C2/C0, AF-WCC-SCALAR-SPH, or non-vacuum matter outside excluded_classes/non_claims"
  R10: "falsifier names a witness_type and a concrete test; none/n-a is a failure"
  R11: "evidence_refs non-empty; primary_source refs must be marked verified or unresolved (unresolved is a warning, not a pass)"
  R12: "--require-file mode pins the declared artifact path and sha256; a missing or hash-mismatched file fails"

acceptance_commands:
  - "python3 artifacts/flash-13/f1_gate/check_schema.py artifacts/flash-13/f1_gate/fixtures/valid_af_wcc_vac_gen.yaml"
  - "python3 artifacts/flash-13/f1_gate/test_gate.py"
  - "python3 artifacts/flash-13/audit/artifact_existence_gate.py research_map/research_map.json"
  - "python3 research_map/validate_map.py comms/outbox/flash-13-events.jsonl"

expected_information_gain: >-
  High. It decides, per rule ID, whether an F1 schema is class-bound and non-vacuous. It also
  converts the A1 review of F1 from an open-ended read into a bounded check with a fixture corpus,
  and it exposes (via the audit finding) that the map's done-gate currently accepts absent artifacts.

budget_request:
  requested_agents: 1
  requested_agent_hours: 4
  justification: "Gate build plus fixture corpus is done (0.5 h). The remaining budget is for re-parameterising the gate onto F2 and re-running it against the lead's concrete F1 schema once it lands."
  stop_rule: "Stop after either (a) lead-formulation binds WP13-F1-GATE and the gate runs against the real schemas/af_wcc_vacuum.yaml, or (b) 4 agent-hours, whichever comes first, and report unresolved rules."

next_falsifier: >-
  Author an F1 schema that the gate ACCEPTS but that is semantically out of class, e.g. an SCC
  statement rephrased without blocked tokens ("the maximal development admits a continuous
  extension beyond the horizon"). The probe fixture below already does this and the gate accepts
  it: the documented next falsifier is a semantic (not lexical) leakage check, which remains A1
  human-review work and is explicitly NOT solved by this task.

known_blind_spots:
  - "R09 is lexical; synonym/rephrased leakage passes (see fixtures/probe_rephrased_leak.yaml, accepted by design of the probe)."
  - "The gate checks structure, not mathematical correctness or non-vacuity of the quantifier domains."
  - "The conforming fixture is a contract demonstration, not a physics claim and not the F1 schema."

does_not_claim:
  - "Does not complete F1, L1, N0, or any map node."
  - "Does not assert any cosmic-censorship theorem, counterexample, or numerical result."
  - "Does not resolve any citation; primary_source refs stay unresolved until L0/L1 verifies them."
  - "Does not modify research_map.json, schemas/, or any lead-owned path."
