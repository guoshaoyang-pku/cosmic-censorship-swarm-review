<!doctype html><html lang='zh-CN'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>AI4Math Research Map</title><script src='https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js'></script><style>body{margin:0;background:#07101f;color:#edf3ff;font:14px system-ui}header,main{padding:20px 28px}main{display:grid;gap:14px}.panel{background:#101b31;border:1px solid #2d4771;border-radius:14px;padding:15px}.dag{overflow:auto;min-height:240px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}.card{background:#162744;border:1px solid #2d4771;border-radius:10px;padding:12px}.row{display:flex;justify-content:space-between}.small{color:#9db0d2}.done{color:#39d98a}.active{color:#62a5ff}.queued{color:#ffca5c}.blocked{color:#ff6e86}.bar{height:8px;background:#0a1428;margin:8px 0;border-radius:5px}.bar i{display:block;height:100%;background:#39d98a}</style></head><body><header><h1>AI4Math Research Command Center</h1><div class='small'>Human PI - Astra - group leads - DeepSeek Flash pool | 100 to 1000 agents</div></header><main><section class='panel'><h2>Agent architecture</h2><div id='agentDag' class='dag'></div></section><section class='panel'><h2>Research content DAG</h2><div id='toolbar'></div><div id='researchDag' class='dag'></div></section><section class='panel'><h2>Groups and progress</h2><div id='cards' class='cards'></div></section><section class='panel'><h2>Selected work item</h2><pre id='detail' class='small'>Hover over a node or click a group.</pre></section></main><script src='research_map.js'></script></body></html>
