# A2 — Four-arm matched-budget ablation, design + dry-run only
# Owner: lead-audit. Canonical artifact path: evaluation/ablation_design.yaml
# Status: design frozen for review; execution is BLOCKED on a provider config
#         (no ~/.maso/model-providers.yaml in this environment). No model budget is spent.
# Rule of the run: run the null first; add seeds before believing a max-statistic.
artifact_id: A2-ablation-design
created_at: "2026-09-11T23:35:00+08:00"
author: lead-audit
gate: G-AUDIT
design_version: 1.0
execution_status:
  state: blocked
  blocker: "no provider config at ~/.maso/model-providers.yaml and no SWARM_PROVIDERS env var in this environment; framework/pool.py cannot construct a Pool"
  what_is_done: "design, budget arithmetic, power analysis, synthetic dry-run of the full metrics pipeline, negative control on budget matching"
  what_is_not_done: "any real arm execution; no result is claimed"

question: >-
  At matched token and wall-clock budget, does a cheap-agent swarm with a coordinator
  produce more gate-accepted, non-duplicated, citation-supported artifacts per token than
  (a) one strong model, (b) self-consistency on the same strong model, or (c) the same
  cheap agents without a coordinator?

arms:
  - id: S
    label: one strong model
    composition: "single strong proposer, effort=high, one sample per task, no communication, no coordinator"
    role: quality reference
  - id: SC
    label: self-consistency
    composition: "same strong proposer, k independent samples per task, union of candidates passed through the same verifier gate; no cross-agent messaging"
    role: sampling reference
  - id: IC
    label: independent cheap agents
    composition: "m DeepSeek Flash agents, one sample per task each, no coordinator, no dead-end channel, no reassignment"
    role: breadth reference
  - id: ICC
    label: cheap agents + coordinator
    composition: "same m cheap agents plus a coordinator that assigns class-bound task cards, enforces the artifact gate, broadcasts refuted regions (dead ends), and reallocates calls by marginal information gain"
    role: treatment
  - id: NULL
    label: matched-budget null
    composition: "iid random selection from the task's candidate pool at the same token spend, plus a shuffled-gate control at the observed base rate"
    role: "mandatory control; the run is uninterpretable without it"

budget_matching:
  rule: >-
    All arms receive the same total completion-token budget B (+/-2%) and the same wall-clock
    envelope T (+/-2%), enforced by a scheduler that stops an arm when either is exhausted.
    Verifier calls per accepted artifact and human-review minutes are also equalised.
  call_counts_differ_by_design: true
  token_cost_assumption: >-
    From framework/pool.py and the measurements in HANDOFF.md: high effort ~12,842
    completion tokens/call and low effort ~2,137 on the same prompt, so matching call counts
    would silently convert the effort axis into the depth axis (HF-11). Calls are therefore
    reported, not matched.
  secondary_diagnostic: "an equal-call variant may be run, but it is labelled non-primary and may never be used for a swarm-advantage claim"
  accounting_source: "provider usage fields only; estimated tokens are a hard failure (HF-08)"
  matched_fields: [total_completion_tokens, wall_clock_s, verifier_calls_per_accepted_artifact, human_review_minutes]

tasks:
  suite: "24 auto-gradable or adjudicated micro-tasks drawn from the frozen class work, 6 of each type"
  types:
    - id: T1
      name: class-binding repair
      prompt: "given a mutated formulation schema, repair it to satisfy rule_spec R01-R16"
      gate: "single frozen gate + adjudicated diff"
      gold: "the unmutated schema plus the injected-mutation label"
    - id: T2
      name: citation binding
      prompt: "given a claim and N candidate sources, select the source whose physical scope matches the class"
      gate: "exact match to adjudicated label"
      gold: "adjudicated source_id"
    - id: T3
      name: falsifier construction
      prompt: "write a tier-1 falsifier for a named class"
      gate: "checklist: finite witness, genericity clause, class-correct family, machine-checkable steps"
      gold: "adjudicated checklist"
    - id: T4
      name: scope extraction
      prompt: "extract matter_model, Lambda, dimension, symmetry, formulation from a primary-source abstract"
      gate: "exact match to L1 registry fields"
      gold: "ledger source_meta once L1 completes it"
  difficulty_control: "the same task set and the same order for every arm; per-task random intercept in the analysis"

design:
  unit_of_analysis: "one task x one arm x one seed"
  blocks: "task (24 levels)"
  seeds_per_arm: 8
  seeds_reason: >-
    HANDOFF process rule: max-statistics over fewer than 8 seeds have already produced two
    retracted readings in this project. With 8 seeds, best-of-k is reported separately from
    mean-of-k and never as the headline (HF-09).
  randomization: "arm order within a block randomized; adjudicators blind to arm identity"
  stopping_rule: >-
    Fixed-horizon primary analysis at 8 seeds. An optional sequential extension uses
    O'Brien-Fleming alpha-spending with 3 looks; no peeking outside the spending plan.
  pre_registration: "this file is hashed before execution; any change is a versioned amendment with a reason"

endpoints:
  primary:
    name: accepted_artifacts_per_1M_tokens
    definition: "(number of task outputs that pass their task gate AND an independent blind adjudication) / (total completion tokens / 1e6)"
    direction: higher_is_better
  guardrail:
    name: hard_failure_rate
    rule: "if an arm's critical hard-failure rate exceeds 0.10, its accepted count is truncated at the gate for that arm and the arm is flagged; hard failures dominate any primary gain"
  secondary:
    - citation_support_score
    - duplication: "1 - mean pairwise novelty; Kish ESS for reviewers, never nominal n"
    - reviewer_agreement_kappa: "on a >=20% blind sample"
    - novel_accepted_coverage_by_class
    - cost_per_accepted_artifact: [tokens, agent_hours, verifier_calls]
    - per_class_coverage: "all four frozen classes must be represented or the coverage claim is scoped to the represented subset"
  no_universal_scalar_score: >-
    TRUE by construction. The report is a gate + a primary endpoint + a Pareto table of
    secondary metrics. There is no weighted composite.
  decision_rule: >-
    (1) apply the hard-failure guardrail; (2) compare the primary endpoint against the NULL
    arm's spread; (3) only then rank the surviving arms, and report ties as ties.
  hypotheses:
    - id: H-swarm
      statement: "ICC - IC > 0 on the primary endpoint, 95% CI excluding 0 and exceeding the NULL spread"
      falsifier: "ICC - IC <= 0, or the difference lies inside the NULL spread"
    - id: H-quality
      statement: "S >= ICC on the primary endpoint: at matched tokens, one strong model is not beaten by cheap breadth even with a coordinator"
      falsifier: "ICC > S with CI excluding 0"
    - id: H-selfconsistency
      statement: "SC > S: sampling beats single-shot at matched tokens"
      falsifier: "SC <= S"
    - id: H-design
      statement: "all arms matched within 2% on tokens and wall-clock"
      falsifier: "any arm pair outside tolerance -> the comparison is void (HF-11)"

analysis:
  model: "beta-binomial (or binomial GLMM) with a task random intercept; arm fixed effect; seed as replicates"
  contrasts: ["ICC-IC", "ICC-S", "SC-S", "IC-NULL", "ICC-NULL"]
  multiplicity: "Holm across the four planned contrasts"
  reporting: "per-arm mean +/- sd and best-of-k separately; never a bare max"
  power_analysis:
    method: "two-sided two-proportion normal approximation, alpha=0.05, power=0.80, n=8 per arm"
    mdes_absolute_at_p1_0.30: "see evaluation/ablation_dryrun_report.json (computed, not asserted)"
    warning: >-
      n=8 cannot detect the +3% effect size seen in the offline lab; a 15-point absolute
      difference needs roughly 60-70 outputs per arm. Sequential extension or more seeds is
      the only honest fix; lowering the bar is not.

metrics_pipeline:
  class_binding: "audit_lib.check_class_binding"
  citation_support: "audit_lib.citation_support with verified_primary=1.0, verified_secondary=0.5, unresolved=0"
  hard_failures: "evaluation_rubric.yaml HF-01..HF-14"
  duplication: "audit_lib.duplication_report + kish_ess"
  information_gain: "audit_lib.information_gain over class-status entropy, cost-normalised"
  budget_check: "audit_lib.check_budget_match (HF-11)"

traps_encoded:
  - "token budget equalised across effort, not call count (HANDOFF: 6x cost difference)"
  - "empty / truncated / timeout counted separately and never as 'no answer'"
  - "evaluator runs behind a process boundary with a hard timeout (no in-process arbitrary code)"
  - "gateway concurrency capped at 16 (measured: 24 -> 2 failures, 32 -> 15 failures)"
  - "driver scripts carry an __main__ guard (macOS spawn)"
  - "seeds >= 8; max-statistics labelled"
  - "verifier cost counted in the budget"

falsifier_of_this_design:
  - "arms not matched within 2% on tokens and wall-clock"
  - "primary endpoint replaced by a universal scalar score"
  - "no NULL arm, or the NULL arm given a different budget"
  - "an arm's outputs adjudicated by their author"

artifacts:
  design: evaluation/ablation_design.yaml
  harness: artifacts/audit/ablation_harness.py
  dryrun_csv: evaluation/ablation_dryrun.csv
  dryrun_report: evaluation/ablation_dryrun_report.json
  raw_runs: evaluation/runs/ (created only when execution is unblocked)
